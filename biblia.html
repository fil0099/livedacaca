<style>
#emConstrucao {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10000;
    pointer-events: none;
    font-family: Arial, sans-serif;
    text-align: center;
}
#emConstrucao .titulo {
    font-size: clamp(28px, 4vw, 54px);
    font-weight: 800;
    color: #2d2d2d;
    margin-bottom: 22px;
    text-shadow: 0 2px 8px rgba(255,255,255,.9);
}
#emConstrucao .worker {
    position: relative;
    width: 170px;
    height: 170px;
}
#emConstrucao .head {
    position: absolute;
    left: 58px;
    top: 12px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #f1c27d;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.08);
}
#emConstrucao .helmet {
    position: absolute;
    left: 52px;
    top: 2px;
    width: 66px;
    height: 28px;
    border-radius: 18px 18px 8px 8px;
    background: #f4c430;
}
#emConstrucao .body {
    position: absolute;
    left: 61px;
    top: 66px;
    width: 48px;
    height: 56px;
    border-radius: 12px;
    background: #f4b400;
    transform-origin: center top;
    animation: bob 1s ease-in-out infinite;
}
#emConstrucao .body::before,
#emConstrucao .body::after {
    content: "";
    position: absolute;
    top: 14px;
    width: 18px;
    height: 42px;
    background: #5a5a5a;
    border-radius: 10px;
}
#emConstrucao .body::before {
    left: -14px;
    transform: rotate(22deg);
    transform-origin: top center;
    animation: armLeft 1s ease-in-out infinite;
}
#emConstrucao .body::after {
    right: -14px;
    transform: rotate(-22deg);
    transform-origin: top center;
    animation: armRight 1s ease-in-out infinite;
}
#emConstrucao .leg {
    position: absolute;
    top: 116px;
    width: 18px;
    height: 48px;
    background: #3f3f3f;
    border-radius: 10px;
    transform-origin: top center;
    animation: leg 1s ease-in-out infinite;
}
#emConstrucao .leg.left { left: 66px; transform: rotate(10deg); }
#emConstrucao .leg.right { left: 88px; transform: rotate(-10deg); animation-delay: .1s; }
#emConstrucao .boot {
    position: absolute;
    bottom: -4px;
    left: -4px;
    width: 24px;
    height: 12px;
    border-radius: 6px;
    background: #1f1f1f;
}
#emConstrucao .tool {
    position: absolute;
    left: 116px;
    top: 50px;
    width: 10px;
    height: 70px;
    background: #7b4b24;
    border-radius: 6px;
    transform-origin: top center;
    animation: hammer 1s ease-in-out infinite;
}
#emConstrucao .tool::before {
    content: "";
    position: absolute;
    left: -12px;
    top: -6px;
    width: 34px;
    height: 18px;
    border-radius: 6px;
    background: #5b5b5b;
}
#emConstrucao .ground {
    position: absolute;
    bottom: 0;
    width: 180px;
    height: 8px;
    border-radius: 999px;
    background: rgba(0,0,0,.12);
    filter: blur(1px);
}
@keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
}
@keyframes armLeft {
    0%, 100% { transform: rotate(22deg); }
    50% { transform: rotate(36deg); }
}
@keyframes armRight {
    0%, 100% { transform: rotate(-22deg); }
    50% { transform: rotate(-36deg); }
}
@keyframes leg {
    0%, 100% { transform: rotate(10deg); }
    50% { transform: rotate(18deg); }
}
@keyframes hammer {
    0%, 100% { transform: rotate(10deg) translateY(0); }
    50% { transform: rotate(-18deg) translateY(-8px); }
}
</style>

<div id="emConstrucao" aria-label="Em construção">
    <div class="titulo">Em constru&ccedil;&atilde;o</div>
    <div class="worker">
        <div class="ground"></div>
        <div class="helmet"></div>
        <div class="head"></div>
        <div class="body"></div>
        <div class="leg left"><div class="boot"></div></div>
        <div class="leg right"><div class="boot"></div></div>
        <div class="tool"></div>
    </div>
</div>

<script>

/* livros com nome correto da API */
const biblia = {
"Gnesis":{api:"Genesis", caps:50},
"xodo":{api:"Exodus", caps:40},
"Levtico":{api:"Leviticus", caps:27},
"Nmeros":{api:"Numbers", caps:36},
"Deuteronmio":{api:"Deuteronomy", caps:34},
"Salmos":{api:"Psalms", caps:150},
"Provrbios":{api:"Proverbs", caps:31},
"Mateus":{api:"Matthew", caps:28},
"Marcos":{api:"Mark", caps:16},
"Lucas":{api:"Luke", caps:24},
"Joo":{api:"John", caps:21},
"Atos":{api:"Acts", caps:28},
"Romanos":{api:"Romans", caps:16},
"Apocalipse":{api:"Revelation", caps:22}
};

/* preencher livros */
const livroSelect = document.getElementById("livro");
for(let l in biblia){
    let op = document.createElement("option");
    op.value = l;
    op.text = l;
    livroSelect.add(op);
}

/* atualizar captulos */
livroSelect.addEventListener("change", ()=>{
    const capSelect = document.getElementById("capitulo");
    capSelect.innerHTML = "";

    let total = biblia[livroSelect.value].caps;

    for(let i=1;i<=total;i++){
        let op = document.createElement("option");
        op.value = i;
        op.text = i;
        capSelect.add(op);
    }
});

/* iniciar */
livroSelect.dispatchEvent(new Event("change"));

/* carregar */
function carregar(){
    let livro = livroSelect.value;
    let apiLivro = biblia[livro].api;
    let cap = document.getElementById("capitulo").value;

    resultado.innerHTML = "Carregando...";

    fetch(`https://bible-api.com/${apiLivro}%20${cap}`)
    .then(res => res.json())
    .then(data => {

        if(!data.verses){
            throw "erro";
        }

        let html = `<h3>${livro} ${cap}</h3>`;

        data.verses.forEach(v=>{
            html += `<p><b>${v.verse}</b> ${v.text}</p>`;
        });

        resultado.innerHTML = html;

    })
    .catch(()=>{
        resultado.innerHTML = "Erro ao carregar captulo.";
    });
}

/* buscar */
function buscar(){
    let termo = document.getElementById("busca").value;

    resultado.innerHTML = "Buscando...";

    fetch(`https://bible-api.com/${encodeURIComponent(termo)}`)
    .then(res => res.json())
    .then(data => {

        if(!data.text){
            throw "erro";
        }

        resultado.innerHTML =
        `<h3>${data.reference}</h3><p>${data.text}</p>`;

    })
    .catch(()=>{
        resultado.innerHTML = "Nada encontrado.";
    });
}

</script>
</body>
