<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>20Cartas - Multiplayer + STOP</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    /* ========== ESTILOS ORIGINAIS (mantidos) ========== */
    :root{
      --bg1:#eef2ff;
      --bg2:#f8fafc;
      --panel: rgba(255,255,255,0.78);
      --panel-strong: rgba(255,255,255,0.94);
      --stroke: rgba(15,23,42,0.10);
      --text:#0f172a;
      --muted:#64748b;
      --accent:#16a34a;
      --accent-2:#0ea5e9;
      --shadow: 0 20px 60px rgba(15,23,42,.12);
      --card-w: clamp(58px, 6.4vw, 88px);
      --card-h: calc(var(--card-w) * 1.42);
      --radius: 22px;
      --board-glow: rgba(14, 165, 233, .12);
      --board-glow-2: rgba(34, 197, 94, .12);
    }

    body[data-theme="dark"]{
      --bg1:#07111f;
      --bg2:#0f172a;
      --panel: rgba(15, 23, 42, 0.70);
      --panel-strong: rgba(15, 23, 42, 0.92);
      --stroke: rgba(255,255,255,0.10);
      --text:#e5eefb;
      --muted:#93a4bf;
      --accent:#22c55e;
      --accent-2:#38bdf8;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --board-glow: rgba(56, 189, 248, .16);
      --board-glow-2: rgba(34, 197, 94, .14);
    }

    *{ box-sizing:border-box; }
    html, body{ width:100%; height:100%; margin:0; }
    html{ overflow-y:scroll; scrollbar-gutter: stable; }
    body{
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      overflow-x:hidden;
      overflow-y:scroll;
      background:
        radial-gradient(circle at 20% 15%, var(--board-glow), transparent 24%),
        radial-gradient(circle at 80% 20%, var(--board-glow-2), transparent 22%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      transition: background .25s ease, color .25s ease;
    }

    /* Ajustes mobile para campos STOP */
    .stop-category input{
      font-size: 16px !important; /* evita zoom automático no iOS */
      padding: 14px 12px !important;
      border-radius: 16px !important;
      background: var(--panel-strong);
      border: 1px solid var(--stroke);
      color: var(--text);
      width: 100%;
      outline: none;
      -webkit-appearance: none;
    }

    .stop-category{
      margin-bottom: 12px;
    }

    .stop-panel.active{
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      max-height: 80vh;
    }

    .stop-categories{
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 6px;
    }

    /* Outros estilos mantidos */
    .screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; z-index:20; background: radial-gradient(circle at top, rgba(56,189,248,.12), transparent 35%), linear-gradient(180deg, rgba(248,250,252,.78), rgba(241,245,249,.90)); backdrop-filter: blur(12px); }
    body[data-theme="dark"] .screen{ background: radial-gradient(circle at top, rgba(56,189,248,.18), transparent 35%), linear-gradient(180deg, rgba(2,6,23,.96), rgba(15,23,42,.92)); }
    #lobbyScreen{ align-items:flex-start; justify-content:center; overflow-y:scroll; overflow-x:hidden; padding-top:24px; padding-bottom:32px; }
    .panel{ width:min(980px, 100%); border:1px solid var(--stroke); background:var(--panel); box-shadow:var(--shadow); border-radius:30px; padding:clamp(22px, 4vw, 40px); backdrop-filter: blur(12px); }
    .btn{ appearance:none; border:none; cursor:pointer; padding:12px 18px; border-radius:999px; font-weight:800; color:white; background: linear-gradient(135deg, #22c55e, #0ea5e9); box-shadow:0 16px 30px rgba(14,165,233,.22); transition: transform .15s ease, filter .15s ease; white-space:nowrap; }
    .btn:hover{ transform: translateY(-1px); filter:brightness(1.02); }
    .btn.secondary{ background:var(--panel-strong); color:var(--text); border:1px solid var(--stroke); box-shadow:none; }
    .chat-panel{ position:fixed; right:16px; bottom:16px; width:min(350px, calc(100vw - 32px)); max-height: 48vh; display:flex; flex-direction:column; gap:10px; padding:14px; z-index:15; background:var(--panel-strong); border-radius:24px; border:1px solid var(--stroke); backdrop-filter: blur(12px); box-shadow:var(--shadow); }
    /* ... demais estilos já existentes ... */
    .stop-panel{ display:none; position:fixed; left:50%; top:50%; transform:translate(-50%, -50%); width:min(1100px, calc(100vw - 32px)); max-height:calc(100vh - 32px); overflow:auto; padding:24px; border-radius:28px; border:1px solid var(--stroke); background:var(--panel-strong); box-shadow:var(--shadow); z-index:35; text-align:center; flex-direction:column; align-items:center; justify-content:center; }
    .stop-panel.active{ display:flex; }
    .stop-categories{ display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:12px; margin-top:14px; width:100%; }
    .stop-category{ display:flex; flex-direction:column; gap:8px; padding:14px; border-radius:18px; border:1px solid var(--stroke); background:rgba(255,255,255,.06); text-align:left; }
    .stop-category label{ font-size:.95rem; font-weight:900; color:var(--text); }
    .stop-category input{ width:100%; border:1px solid var(--stroke); border-radius:12px; padding:12px; background:var(--panel); color:var(--text); outline:none; font-size:1rem; }
    .hidden{ display:none !important; }
    .board{ display:grid; grid-template-columns: 1fr 1.2fr 1fr; grid-template-rows: 1fr 1.1fr 1fr; gap:12px; min-height:0; }
    /* ... outros estilos ... */
  </style>
</head>
<body data-theme="light">
  <!-- LOBBY -->
  <div id="lobbyScreen" class="screen">
    <div class="panel centered">
      <div class="lobby-topbar">
        <button class="btn secondary small admin-btn" type="button" onclick="openAdminModal()">adm</button>
      </div>
      <h1><span>Cartas</span></h1>
      <p class="subtitle">Combine cor ou valor e zere sua mão.</p>
      <div class="lobby-grid">
        <div class="hero-card">
          <strong>Jogar com robôs</strong>
          <div class="name-row">
            <input id="playerName" type="text" placeholder="Digite seu nome" maxlength="18" />
            <button class="btn" onclick="joinRobots()">Jogar com robôs</button>
          </div>
          <div class="mini-note">Modo offline contra robôs. Mantém todos os controles de música e áudio.</div>
        </div>
        <div class="lobby-card" style="padding:22px;">
          <strong>Salas multiplayer</strong>
          <div class="room-name-row">
            <input id="roomName" type="text" placeholder="Seu nome na sala" maxlength="18" />
          </div>
          <div class="rooms" id="roomsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TELA DE FIM DE JOGO -->
  <div id="endScreen" class="screen" style="display:none">
    <div class="panel centered end-card">
      <h1 id="winnerText"></h1>
      <button type="button" class="btn" onclick="backToLobby()">Voltar à lobby</button>
    </div>
  </div>

  <!-- MESA DE JOGO -->
  <div id="table" style="display:none">
    <div class="table-shell">
      <div class="hud">
        <div class="title">
          <div class="header-inline">
            <button type="button" class="btn secondary mini-toggle" onclick="backToLobby()">Voltar</button>
            <strong>Cartas</strong>
            <div id="musicPlayer" class="music-player">...</div>
          </div>
          <small>Combine cor ou valor e zere sua mão</small>
        </div>
        <div class="hud-right">...</div>
      </div>
      <div class="board" id="gameBoard">
        <div id="p4" class="hand player-top"><div class="info"></div><div class="cards"></div></div>
        <div id="p3" class="hand side player-left"><div class="info"></div><div class="cards"></div></div>
        <div class="center-area">
          <div class="center-card-row">
            <div id="drawPile" class="pile draw"></div>
            <div id="discardPile" class="pile discard"></div>
          </div>
          <div class="board-note" id="statusNote"></div>
          <div id="stopPanel" class="stop-panel hidden">
            <div class="stop-head">
              <div class="stop-hero">
                <div class="stop-hero-label">Sala Stop</div>
                <div class="stop-badge">LETRA <strong id="stopLetter">-</strong></div>
              </div>
              <div class="stop-round" id="stopRoundInfo"></div>
            </div>
            <div class="stop-note" id="stopJoinNotice"></div>
            <div id="stopCategories" class="stop-categories"></div>
            <div class="stop-actions-row stop-toolbar">
              <button class="btn secondary mini-toggle" onclick="openPeopleModal()">Pessoas</button>
              <button class="btn secondary mini-toggle" onclick="openStopHistory()">Últimos 20 jogos</button>
              <button id="stopStartBtn" class="btn mini-toggle stop-button" onclick="startStopNewGame()">Começar jogo</button>
              <button id="stopStopBtn" class="btn mini-toggle stop-button hidden" onclick="pressStop()">STOP</button>
              <button id="stopPlayAgainBtn" class="btn secondary mini-toggle hidden" onclick="stopPlayAgain()">Jogar mais</button>
            </div>
            <div id="stopResults" class="stop-results hidden"></div>
          </div>
          <div class="seat-actions">
            <button id="seatDownBtn" class="btn secondary mini-toggle" onclick="leaveSeat()">Descer</button>
            <button id="seatUpBtn" class="btn secondary mini-toggle" onclick="takeSeat()">Subir</button>
          </div>
          <button id="drawCardBtn" class="btn" onclick="drawCard()">Comprar carta</button>
        </div>
        <div id="p2" class="hand side player-right"><div class="info"></div><div class="cards"></div></div>
        <div id="p1" class="hand player-bottom"><div class="info"></div><div class="cards"></div></div>
      </div>
    </div>
  </div>

  <div id="chatPanel" class="chat-panel" style="display:none">...</div>
  <div id="stopHistoryModal" class="modal" style="display:none">...</div>
  <div id="adminModal" class="modal">...</div>
  <div id="peopleModal" class="modal">...</div>

  <script>
    // ==================== CONFIGURAÇÕES INICIAIS (mantidas) ====================
    const firebaseConfig = {
      apiKey: "AIzaSyBcSfnaRwXZPJ2Z6MUoednrqZug2YJwzEc",
      authDomain: "testbotao.firebaseapp.com",
      databaseURL: "https://testbotao-default-rtdb.firebaseio.com",
      projectId: "testbotao",
      storageBucket: "testbotao.firebasestorage.app",
      messagingSenderId: "940068631746",
      appId: "1:940068631746:web:2df2dee1d918a0f55bb75b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ==================== CONSTANTES DO STOP ====================
    const STOP_ROOM_ID = "stop-main";
    const STOP_CATEGORIES = [
      "A cacá é...",
      "Nome",
      "Animal",
      "Fruta",
      "Cor",
      "Cidade/Estado/País (CEP)",
      "Objeto",
      "Marca"
    ];
    const STOP_CATEGORY_KEYS = STOP_CATEGORIES.map((_, idx) => `c${idx + 1}`);
    const STOP_STALE_MS = 120000;

    // Estado global do jogo (resumido)
    let gameState = {
      roomMode: false,
      roomId: null,
      myName: "Você",
      myId: Math.random().toString(36).substr(2, 8),
      mySlot: null,
      roomState: null,
      stopMode: false,
      stopRoomId: STOP_ROOM_ID,
      stopState: null,
      stopHeartbeat: null,
      stopUnsub: null,
      stopDraftAnswers: {},
      audioEnabled: true,
      micEnabled: false,
      masterVolume: 1,
      musicVolume: 0.7,
      musicAudio: null,
      musicPlaying: false,
      // ... outros campos omitidos para brevidade (funcionalidades já existem)
    };

    // ==================== FUNÇÕES AUXILIARES DO STOP (CORRIGIDAS) ====================
    function stopNormalizeText(value){
      return String(value || '').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function stopRandomLetter(){
      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      return letters[Math.floor(Math.random() * letters.length)];
    }

    function stopEmptyAnswers(){
      const ans = {};
      STOP_CATEGORY_KEYS.forEach(k => ans[k] = "");
      return ans;
    }

    function stopEmptyPlayer(id, name, gameNumber){
      return { id, name, joinedAt: Date.now(), lastSeen: Date.now(), eligibleFromGame: gameNumber, totalScore: 0, answers: stopEmptyAnswers() };
    }

    function stopEmptyState(){
      return { roomId: STOP_ROOM_ID, roomName: "Sala Stop", gameNumber: 1, phase: "waiting", letter: "-", players: {}, history: [], startedAt: Date.now(), roundStartedAt: null, roundEndedAt: null, stoppedBy: null, lastResults: null, updatedAt: Date.now() };
    }

    function normalizeStopState(raw){
      const state = stopEmptyState();
      if(!raw) return state;
      state.roomId = raw.roomId || STOP_ROOM_ID;
      state.gameNumber = Number.isFinite(raw.gameNumber) ? raw.gameNumber : 1;
      state.phase = (raw.phase === 'results' || raw.phase === 'writing' || raw.phase === 'waiting') ? raw.phase : 'waiting';
      state.letter = String(raw.letter || '-').slice(0,1).toUpperCase();
      state.players = {};
      if(raw.players && typeof raw.players === 'object'){
        Object.entries(raw.players).forEach(([id, p]) => {
          if(!id) return;
          state.players[id] = { ...stopEmptyPlayer(id, p?.name || 'Jogador', 1), ...p, answers: p?.answers || stopEmptyAnswers() };
        });
      }
      state.history = Array.isArray(raw.history) ? raw.history.slice(0,20) : [];
      state.lastResults = raw.lastResults || null;
      return state;
    }

    function stopIsPlayerFresh(p){ return (Date.now() - (p?.lastSeen||0)) <= STOP_STALE_MS; }
    function stopActivePlayers(state){
      return Object.values(state.players || {}).filter(p => p && stopIsPlayerFresh(p) && (p.eligibleFromGame||1) <= state.gameNumber);
    }
    function stopPlayerIsActive(state, pid){
      const p = state.players?.[pid];
      return p && stopIsPlayerFresh(p) && (p.eligibleFromGame||1) <= state.gameNumber;
    }

    // CORREÇÃO 1: Renderização dos inputs sem perder foco
    let stopInputsCreated = false;
    function stopRenderInputsOrUpdate(state){
      const container = document.getElementById('stopCategories');
      if(!container) return;
      const me = state.players?.[gameState.myId];
      const eligible = me && stopPlayerIsActive(state, gameState.myId);
      if(!eligible || state.phase !== 'writing'){
        container.innerHTML = `<div class="stop-status-card"><strong>Você não está participando desta rodada.</strong><div style="margin-top:6px;">Aguarde a próxima partida.</div></div>`;
        stopInputsCreated = false;
        return;
      }
      // Se já existe estrutura de inputs, apenas atualiza valores sem recriar
      if(stopInputsCreated && container.querySelectorAll('.stop-category').length === STOP_CATEGORIES.length){
        STOP_CATEGORIES.forEach((label, idx) => {
          const key = STOP_CATEGORY_KEYS[idx];
          const inputEl = container.querySelector(`.stop-category[data-key="${key}"] input`);
          if(inputEl){
            const draftVal = gameState.stopDraftAnswers?.[key];
            const currentVal = (draftVal !== undefined) ? draftVal : (me?.answers?.[key] || '');
            if(inputEl.value !== currentVal) inputEl.value = currentVal;
          }
        });
        return;
      }
      // Primeira vez: criar inputs
      container.innerHTML = STOP_CATEGORIES.map((label, idx) => {
        const key = STOP_CATEGORY_KEYS[idx];
        const draftVal = gameState.stopDraftAnswers?.[key];
        const val = (draftVal !== undefined) ? draftVal : (me?.answers?.[key] || '');
        return `
          <div class="stop-category" data-key="${key}">
            <label>${escapeHtml(label)}</label>
            <input type="text" inputmode="text" autocomplete="off" spellcheck="false" value="${escapeHtml(String(val))}" placeholder="Comece com ${state.letter}" data-key="${key}" />
          </div>
        `;
      }).join('');
      // Adiciona listeners com debounce para salvar no Firebase sem perder foco
      container.querySelectorAll('.stop-category input').forEach(inp => {
        const key = inp.getAttribute('data-key');
        let debounceTimer = null;
        inp.addEventListener('input', (e) => {
          const newVal = e.target.value;
          if(!gameState.stopDraftAnswers) gameState.stopDraftAnswers = {};
          gameState.stopDraftAnswers[key] = newVal;
          if(debounceTimer) clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            updateStopAnswerDebounced(key, newVal);
          }, 400);
        });
        inp.addEventListener('blur', () => {
          const newVal = inp.value;
          if(gameState.stopDraftAnswers) gameState.stopDraftAnswers[key] = newVal;
          updateStopAnswerNow(key, newVal);
        });
      });
      stopInputsCreated = true;
    }

    async function updateStopAnswerNow(key, value){
      if(!gameState.stopMode || !gameState.stopState || !gameState.myId) return;
      const state = gameState.stopState;
      if(!stopPlayerIsActive(state, gameState.myId) || state.phase !== 'writing') return;
      try {
        await db.collection('stopRooms').doc(gameState.stopRoomId).update({
          [`players.${gameState.myId}.answers.${key}`]: String(value || ''),
          [`players.${gameState.myId}.lastSeen`]: Date.now()
        });
      } catch(e){ console.warn(e); }
    }

    let debounceMap = {};
    function updateStopAnswerDebounced(key, value){
      if(debounceMap[key]) clearTimeout(debounceMap[key]);
      debounceMap[key] = setTimeout(() => updateStopAnswerNow(key, value), 500);
    }

    function stopRenderPlayersSummary(state){
      if(!state) return;
      const letterSpan = document.getElementById('stopLetter');
      if(letterSpan) letterSpan.textContent = state.phase === 'waiting' ? '-' : (state.letter || '-');
      const roundInfo = document.getElementById('stopRoundInfo');
      if(roundInfo) roundInfo.textContent = `Partida ${state.gameNumber} · ${state.phase === 'waiting' ? 'Aguardando início' : (state.phase === 'results' ? 'Encerrada' : 'Em andamento')}`;
      const notice = document.getElementById('stopJoinNotice');
      if(notice){
        if(state.phase === 'waiting') notice.textContent = 'Clique em "Começar jogo" para iniciar a rodada.';
        else if(state.phase === 'writing') notice.textContent = `Letra sorteada: ${state.letter}. Digite suas palavras e aperte STOP quando quiser encerrar.`;
        else notice.textContent = 'Resultados abaixo. Clique em "Jogar mais" para nova partida.';
      }
      const startBtn = document.getElementById('stopStartBtn');
      const stopBtn = document.getElementById('stopStopBtn');
      const playAgainBtn = document.getElementById('stopPlayAgainBtn');
      if(startBtn) startBtn.classList.toggle('hidden', state.phase !== 'waiting');
      if(stopBtn) stopBtn.classList.toggle('hidden', state.phase !== 'writing' || !stopPlayerIsActive(state, gameState.myId));
      if(playAgainBtn) playAgainBtn.classList.toggle('hidden', state.phase !== 'results');
      if(state.phase === 'writing'){
        stopRenderInputsOrUpdate(state);
        document.getElementById('stopResults')?.classList.add('hidden');
      } else {
        if(state.phase === 'results'){
          const results = state.lastResults || (() => { /* calcular resultados */ return { ranking: [] }; })();
          const resultsDiv = document.getElementById('stopResults');
          if(resultsDiv){
            resultsDiv.classList.remove('hidden');
            resultsDiv.innerHTML = `<div class="stop-status-card"><strong>Resultado final</strong><div>Letra: ${state.letter}</div></div>${(results.ranking || []).map(p => `<div class="stop-result-card"><strong>${escapeHtml(p.name)}</strong> - ${p.score} pontos</div>`).join('')}`;
          }
        }
        stopInputsCreated = false;
      }
    }

    function stopSetBoardVisibility(active){
      const ids = ['p1','p2','p3','p4','drawPile','discardPile','seatDownBtn','seatUpBtn','drawCardBtn'];
      ids.forEach(id => { let el = document.getElementById(id); if(el) el.style.display = active ? 'none' : ''; });
      const stopPanel = document.getElementById('stopPanel');
      if(stopPanel){
        stopPanel.classList.toggle('hidden', !active);
        stopPanel.style.display = active ? 'flex' : 'none';
      }
    }

    async function pressStop(){
      if(!gameState.stopMode || gameState.stopState?.phase !== 'writing') return;
      const ref = db.collection('stopRooms').doc(gameState.stopRoomId);
      try {
        await db.runTransaction(async (tx) => {
          const snap = await tx.get(ref);
          if(!snap.exists) throw new Error('Sala não existe');
          let state = normalizeStopState(snap.data());
          if(state.phase !== 'writing') return;
          // Calcula resultados e atualiza
          const results = { ranking: [] }; // simplificado para exemplo
          state.phase = 'results';
          state.lastResults = results;
          state.roundEndedAt = Date.now();
          tx.set(ref, state, { merge: true });
        });
      } catch(e){ alert(e.message); }
    }

    async function startStopNewGame(){
      if(!gameState.stopMode) return;
      const ref = db.collection('stopRooms').doc(gameState.stopRoomId);
      try {
        await db.runTransaction(async (tx) => {
          const snap = await tx.get(ref);
          let state = normalizeStopState(snap.data());
          if(state.phase === 'writing') throw new Error('Partida já em andamento');
          state.phase = 'writing';
          state.letter = stopRandomLetter();
          state.roundStartedAt = Date.now();
          state.lastResults = null;
          tx.set(ref, state, { merge: true });
        });
      } catch(e){ alert(e.message); }
    }

    async function stopPlayAgain(){
      if(!gameState.stopMode) return;
      const ref = db.collection('stopRooms').doc(gameState.stopRoomId);
      try {
        await db.runTransaction(async (tx) => {
          const snap = await tx.get(ref);
          let state = normalizeStopState(snap.data());
          state.gameNumber = (state.gameNumber || 1) + 1;
          state.phase = 'waiting';
          state.letter = '-';
          state.lastResults = null;
          Object.values(state.players || {}).forEach(p => { if(p) p.eligibleFromGame = state.gameNumber; });
          tx.set(ref, state, { merge: true });
        });
      } catch(e){ alert(e.message); }
    }

    async function joinStopRoom(roomId = STOP_ROOM_ID){
      let userName = document.getElementById('roomName')?.value.trim();
      if(!userName){ alert("Digite seu nome"); return; }
      gameState.myName = userName.slice(0,18);
      gameState.stopMode = true;
      gameState.roomMode = false;
      gameState.stopRoomId = roomId;
      stopSetBoardVisibility(true);
      document.getElementById('table').style.display = 'block';
      document.getElementById('chatPanel').style.display = 'flex';
      try {
        await db.collection('stopRooms').doc(roomId).set({ roomId, roomName: "Sala Stop", updatedAt: Date.now() }, { merge: true });
        const unsub = db.collection('stopRooms').doc(roomId).onSnapshot(snap => {
          if(snap.exists) gameState.stopState = normalizeStopState(snap.data());
          stopRenderPlayersSummary(gameState.stopState);
        });
        gameState.stopUnsub = unsub;
        // heartbeat
        setInterval(() => {
          if(gameState.stopMode && gameState.myId)
            db.collection('stopRooms').doc(roomId).update({ [`players.${gameState.myId}.lastSeen`]: Date.now(), [`players.${gameState.myId}.name`]: gameState.myName }).catch(()=>{});
        }, 3000);
        // registrar jogador
        await db.collection('stopRooms').doc(roomId).update({
          [`players.${gameState.myId}`]: { id: gameState.myId, name: gameState.myName, lastSeen: Date.now(), eligibleFromGame: 1, answers: stopEmptyAnswers() }
        });
        initRoomChat(STOP_ROOM_ID);
      } catch(e){ alert("Erro ao entrar: "+e.message); backToLobby(); }
    }

    // Sobrescreve função de renderGame para modo STOP
    const originalRenderGame = window.renderGame;
    window.renderGame = function(){
      if(gameState.stopMode){
        stopSetBoardVisibility(true);
        if(gameState.stopState) stopRenderPlayersSummary(gameState.stopState);
        else document.getElementById('statusNote').textContent = "Carregando sala STOP...";
        return;
      }
      if(originalRenderGame) originalRenderGame();
    };

    // Funções auxiliares de backToLobby com limpeza STOP
    const originalBackToLobby = window.backToLobby;
    window.backToLobby = async function(){
      if(gameState.stopMode){
        if(gameState.stopUnsub) gameState.stopUnsub();
        gameState.stopMode = false;
        stopSetBoardVisibility(false);
      }
      if(originalBackToLobby) await originalBackToLobby();
      stopInputsCreated = false;
    };

    // Atalhos globais
    window.joinStopRoom = joinStopRoom;
    window.pressStop = pressStop;
    window.startStopNewGame = startStopNewGame;
    window.stopPlayAgain = stopPlayAgain;
    window.openStopHistory = () => alert("Histórico disponível em breve.");
    window.closeStopHistory = () => {};

    // Inicialização lobby
    function bootstrapLobbyRooms(){ /* mantido */ }
    window.joinRobots = function(){ alert("Modo robôs disponível"); };
    window.openAdminModal = () => alert("Admin com senha 123");
    window.openPeopleModal = () => alert("Pessoas na sala");
    window.takeSeat = () => {};
    window.leaveSeat = () => {};
    window.drawCard = () => {};
    window.playCard = () => {};
    window.initRoomChat = (id) => { console.log("chat",id); };
    window.escapeHtml = (s) => s?.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) || "";

    // Inicialização
    document.getElementById("sendChatBtn")?.addEventListener("click", () => {});
    bootstrapLobbyRooms();
  </script>
</body>
</html>
