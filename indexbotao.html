<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>xCartas - Jogo com Chat em Tempo Real</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    /* ========== ESTILOS (MESMOS DO JOGO ORIGINAL, COM LEVE AJUSTE NO CHAT) ========== */
    :root{
      --bg1:#eef2ff;
      --bg2:#f8fafc;
      --panel: rgba(255,255,255,0.78);
      --panel-strong: rgba(255,255,255,0.94);
      --stroke: rgba(15,23,42,0.10);
      --text:#0f172a;
      --muted:#64748b;
      --accent:#16a34a;
      --accent-2:#0ea5e9;
      --shadow: 0 20px 60px rgba(15,23,42,.12);
      --card-w: clamp(58px, 6.4vw, 88px);
      --card-h: calc(var(--card-w) * 1.42);
      --card-small-w: clamp(42px, 4.8vw, 58px);
      --card-small-h: calc(var(--card-small-w) * 1.42);
      --radius: 22px;
      --board-glow: rgba(14, 165, 233, .12);
      --board-glow-2: rgba(34, 197, 94, .12);
    }

    body[data-theme="dark"]{
      --bg1:#07111f;
      --bg2:#0f172a;
      --panel: rgba(15, 23, 42, 0.70);
      --panel-strong: rgba(15, 23, 42, 0.92);
      --stroke: rgba(255,255,255,0.10);
      --text:#e5eefb;
      --muted:#93a4bf;
      --accent:#22c55e;
      --accent-2:#38bdf8;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --board-glow: rgba(56, 189, 248, .16);
      --board-glow-2: rgba(34, 197, 94, .14);
    }

    *{ box-sizing:border-box; }
    html, body{ width:100%; height:100%; margin:0; }
    html{ overflow-y:scroll; scrollbar-gutter: stable; }
    body{
      font-family: 'Segoe UI', Inter, system-ui, sans-serif;
      color: var(--text);
      overflow-x:hidden;
      overflow-y:scroll;
      background:
        radial-gradient(circle at 20% 15%, var(--board-glow), transparent 24%),
        radial-gradient(circle at 80% 20%, var(--board-glow-2), transparent 22%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      transition: background .25s ease, color .25s ease;
    }

    body::before{
      content:"";
      position:fixed; inset:0; pointer-events:none;
      background:
        linear-gradient(transparent 0, rgba(255,255,255,0.02) 1px, transparent 2px),
        linear-gradient(90deg, transparent 0, rgba(255,255,255,0.02) 1px, transparent 2px);
      background-size:26px 26px;
      mask-image: radial-gradient(circle at center, black 0%, black 55%, transparent 100%);
      opacity:.32;
    }

    .screen{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      padding:24px;
      z-index:20;
      background:
        radial-gradient(circle at top, rgba(56,189,248,.12), transparent 35%),
        linear-gradient(180deg, rgba(248,250,252,.78), rgba(241,245,249,.90));
      backdrop-filter: blur(12px);
    }
    body[data-theme="dark"] .screen{
      background:
        radial-gradient(circle at top, rgba(56,189,248,.18), transparent 35%),
        linear-gradient(180deg, rgba(2,6,23,.96), rgba(15,23,42,.92));
    }

    #lobbyScreen{
      align-items:flex-start;
      justify-content:center;
      overflow-y:scroll;
      overflow-x:hidden;
      padding-top:24px;
      padding-bottom:32px;
    }

    .panel{
      width:min(980px, 100%);
      border:1px solid var(--stroke);
      background:var(--panel);
      box-shadow:var(--shadow);
      border-radius:30px;
      padding:clamp(22px, 4vw, 40px);
      backdrop-filter: blur(12px);
    }

    .centered{ text-align:center; }
    h1{
      margin:0;
      font-size:clamp(2rem, 5vw, 4rem);
      line-height:1;
      letter-spacing:-0.04em;
    }
    h1 span{
      display:inline-block;
      padding:0 .35em;
      border-radius:999px;
      background: linear-gradient(135deg, rgba(14,165,233,.16), rgba(34,197,94,.16));
      border:1px solid var(--stroke);
    }
    .subtitle{
      color:var(--muted);
      font-size:clamp(.98rem, 2.3vw, 1.05rem);
      line-height:1.6;
      margin:10px auto 0;
      max-width:64ch;
    }
    .btn{
      appearance:none; border:none; cursor:pointer;
      padding:12px 18px; border-radius:999px;
      font-weight:800; color:white;
      background: linear-gradient(135deg, #22c55e, #0ea5e9);
      box-shadow:0 16px 30px rgba(14,165,233,.22);
      transition: transform .15s ease, filter .15s ease;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); filter:brightness(1.02); }
    .btn.secondary{
      background:var(--panel-strong);
      color:var(--text);
      border:1px solid var(--stroke);
      box-shadow:none;
    }

    /* lobby */
    .lobby-grid{ display:grid; grid-template-columns: 1fr; gap:18px; margin-top:24px; text-align:left; }
    .hero-card, .lobby-card, .room-card, .chat-panel, .music-player, .hud, .board-note{
      border:1px solid var(--stroke);
      background:var(--panel);
      box-shadow:var(--shadow);
      border-radius:24px;
      backdrop-filter: blur(12px);
    }
    .hero-card{ padding:22px; }
    .name-row{ display:flex; gap:10px; margin-top:14px; }
    .name-row input{
      flex:1; padding:14px 16px; border-radius:16px; border:1px solid var(--stroke);
      background:var(--panel-strong); color:var(--text); outline:none; font-size:1rem;
    }
    .rooms{ display:grid; grid-template-columns: repeat(3, 1fr); gap:14px; }
    .room-card{ padding:18px; }
    .room-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .room-tag{ padding:6px 10px; border-radius:999px; font-size:.75rem; font-weight:800; background:rgba(14,165,233,.12); }
    .room-actions{ display:flex; justify-content:space-between; margin-top:14px; gap:10px; }
    .room-name-row{ display:flex; gap:10px; margin:12px 0 6px; }
    .room-name-row input{
      flex:1; padding:12px 14px; border-radius:16px; border:1px solid var(--stroke);
      background:var(--panel-strong); color:var(--text); outline:none;
    }

    /* mesa de jogo */
    #table{ position:fixed; inset:0; display:none; overflow:hidden; background: radial-gradient(circle at 50% 45%, var(--board-glow-2), transparent 30%), radial-gradient(circle at 50% 45%, var(--board-glow), transparent 42%); }
    .table-shell{ position:relative; width:100%; height:100%; padding:16px; display:grid; grid-template-rows:auto 1fr; gap:12px; }
    .hud{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 16px; flex-wrap:wrap; }
    .hud-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .turn-badge{ display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:999px; background:rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.25); font-weight:800; }
    .turn-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); }
    .theme-switch{ display:inline-flex; align-items:center; gap:10px; padding:8px 10px; border-radius:999px; background:var(--panel-strong); border:1px solid var(--stroke); }
    .switch{ position:relative; width:46px; height:26px; display:inline-block; }
    .switch input{ opacity:0; width:0; height:0; }
    .slider{ position:absolute; inset:0; cursor:pointer; background:#cbd5e1; border-radius:999px; }
    .slider:before{ position:absolute; content:""; height:20px; width:20px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
    .switch input:checked + .slider{ background:#22c55e; }
    .switch input:checked + .slider:before{ transform:translateX(20px); }

    .board{
      position:relative; width:100%; height:100%;
      display:grid; grid-template-columns: 1fr 1.2fr 1fr;
      grid-template-rows: 1fr 1.1fr 1fr;
      gap:12px;
      min-height:0;
    }
    .hand{ min-width:0; display:flex; flex-direction:column; gap:8px; padding:10px; overflow:hidden; }
    .hand .info{ display:flex; align-items:center; gap:8px; font-weight:800; }
    .cards{ display:flex; flex-wrap:wrap; gap:4px; align-items:flex-start; }
    .player-top{ grid-column:1 / 4; grid-row:1; align-self:start; }
    .player-left{ grid-column:1; grid-row:2; align-self:center; }
    .player-right{ grid-column:3; grid-row:2; align-self:center; }
    .center-area{ grid-column:2; grid-row:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
    .player-bottom{ grid-column:1 / 4; grid-row:3; align-self:end; }
    .center-card-row{ display:flex; gap:14px; justify-content:center; }
    .pile{ width:var(--card-w); height:var(--card-h); border-radius:16px; border:1px solid var(--stroke); background:var(--panel-strong); box-shadow: var(--shadow); }
    .pile.draw{ background: linear-gradient(135deg, #0f172a, #334155); }
    .card{
      width:var(--card-w); height:var(--card-h); border-radius:16px; position:relative;
      border:2px solid rgba(255,255,255,.25); background-size:cover; background-position:center;
      box-shadow:0 10px 22px rgba(15,23,42,.18); transition: transform .16s ease;
      cursor:pointer; overflow:hidden;
    }
    .card::after{
      content: attr(data-value); position:absolute; top:6px; left:6px;
      padding:4px 6px; border-radius:999px; font-size:.72rem; font-weight:900;
      background:rgba(15,23,42,.64); backdrop-filter: blur(4px); color:white;
    }
    .card.playable{ transform: translateY(-8px) scale(1.04); box-shadow:0 18px 34px rgba(15,23,42,.26); }
    .card.back{ background: linear-gradient(135deg, #0f172a, #334155); cursor:default; }
    .card.back::after{ content:""; }

    /* ========== CHAT SIMPLES E FUNCIONAL ========== */
    .chat-panel{
      position:fixed;
      right:16px; bottom:16px;
      width:min(340px, calc(100vw - 32px));
      max-height: 42vh;
      display:flex; flex-direction:column; gap:10px;
      padding:14px;
      z-index:15;
      background: var(--panel-strong);
      border-radius: 28px;
      backdrop-filter: blur(12px);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
    }
    .chat-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      border-bottom: 1px solid var(--stroke);
      padding-bottom: 6px;
    }
    .chat-header strong{ font-size: 1rem; }
    .chat-messages{
      flex:1;
      min-height: 180px;
      max-height: 260px;
      overflow-y: auto;
      display:flex;
      flex-direction:column;
      gap: 8px;
      padding-right: 4px;
    }
    .chat-message{
      background: rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 8px 12px;
      border-left: 3px solid var(--accent-2);
    }
    .chat-message .message-author{
      font-weight: 800;
      font-size: 0.85rem;
      color: var(--accent-2);
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .chat-message .message-text{
      font-size: 0.9rem;
      word-break: break-word;
    }
    .chat-message .message-time{
      font-size: 0.7rem;
      color: var(--muted);
    }
    .chat-input-area{
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-name-row{
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-name-row input{
      flex: 2;
      padding: 8px 12px;
      border-radius: 40px;
      border: 1px solid var(--stroke);
      background: var(--panel);
      color: var(--text);
      font-size: 0.85rem;
    }
    .chat-name-row button{
      flex: 1;
      padding: 8px 12px;
      font-size: 0.8rem;
    }
    .chat-message-row{
      display: flex;
      gap: 8px;
    }
    .chat-message-row input{
      flex: 1;
      padding: 10px 12px;
      border-radius: 40px;
      border: 1px solid var(--stroke);
      background: var(--panel);
      color: var(--text);
    }
    .chat-message-row button{
      padding: 10px 16px;
    }
    .chat-collapse-btn{
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text);
    }
    .collapsed .chat-messages,
    .collapsed .chat-input-area{
      display: none;
    }
    .collapsed{
      width: auto;
      max-height: none;
    }

    @media (max-width: 920px){
      .rooms{ grid-template-columns:1fr; }
      .board{ grid-template-columns: 1fr; grid-template-rows:auto auto auto auto auto; }
      .player-top{ grid-column:1; grid-row:1; }
      .center-area{ grid-column:1; grid-row:2; }
      .player-left{ grid-column:1; grid-row:3; }
      .player-right{ grid-column:1; grid-row:4; }
      .player-bottom{ grid-column:1; grid-row:5; }
      .chat-panel{ position:relative; right:auto; bottom:auto; width:auto; margin-top: 12px; }
    }
  </style>
</head>
<body data-theme="light">
  <!-- LOBBY -->
  <div id="lobbyScreen" class="screen">
    <div class="panel centered">
      <h1><span>Cartas</span></h1>
      <p class="subtitle">Combine cor ou valor e zere sua mão.</p>
      <div class="lobby-grid">
        <div class="hero-card">
          <strong>Seu nome</strong>
          <div class="name-row">
            <input id="playerName" type="text" placeholder="Digite seu nome" maxlength="18" />
            <button class="btn" onclick="joinRobots()">Jogar com robôs</button>
          </div>
          <div class="mini-note">Entre sozinho contra robôs ou siga para uma sala multiplayer. Chat em tempo real com Firestore.</div>
        </div>
        <div class="lobby-card" style="padding:22px;">
          <strong>Salas multiplayer</strong>
          <div class="room-name-row">
            <input id="roomName" type="text" placeholder="Seu nome na sala (obrigatório)" maxlength="18" />
          </div>
          <div class="rooms" id="roomsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TELA DE FIM DE JOGO -->
  <div id="endScreen" class="screen" style="display:none">
    <div class="panel centered end-card">
      <h1 id="winnerText"></h1>
      <button class="btn" onclick="backToLobby()">Voltar à lobby</button>
    </div>
  </div>

  <!-- MESA DE JOGO -->
  <div id="table">
    <div class="table-shell">
      <div class="hud">
        <div class="title">
          <button class="btn secondary" onclick="backToLobby()">Voltar</button>
          <strong>Cartas</strong>
          <small>Combine cor ou valor</small>
        </div>
        <div class="hud-right">
          <div id="hudTurn" class="turn-badge"><span class="turn-dot"></span><span>Sua vez</span></div>
          <label class="theme-switch">
            <span>🌞/🌙</span>
            <span class="switch">
              <input id="themeToggle" type="checkbox" onchange="toggleTheme()" />
              <span class="slider"></span>
            </span>
          </label>
        </div>
      </div>
      <div class="board">
        <div id="p2" class="hand player-top"><div class="info"></div><div class="cards"></div></div>
        <div id="p3" class="hand side player-left"><div class="info"></div><div class="cards"></div></div>
        <div class="center-area">
          <div class="center-card-row">
            <div id="drawPile" class="pile draw"></div>
            <div id="discardPile" class="pile discard"></div>
          </div>
          <div class="board-note" id="statusNote">Escolha uma carta ou compre</div>
          <button class="btn" onclick="drawCard()">Comprar carta</button>
        </div>
        <div id="p4" class="hand side player-right"><div class="info"></div><div class="cards"></div></div>
        <div id="p1" class="hand player-bottom"><div class="info"></div><div class="cards"></div></div>
      </div>
    </div>
  </div>

  <!-- CHAT SIMPLES (NOVO) -->
  <div id="chatPanel" class="chat-panel">
    <div class="chat-header">
      <strong>💬 Chat da sala</strong>
      <button class="chat-collapse-btn" onclick="toggleChatPanel()">−</button>
    </div>
    <div id="chatMessagesList" class="chat-messages">
      <div style="text-align:center; color:var(--muted);">Carregando mensagens...</div>
    </div>
    <div class="chat-input-area">
      <div class="chat-name-row">
        <input type="text" id="chatUserName" placeholder="Seu nome (obrigatório)" maxlength="20" value="Anônimo">
        <button class="btn secondary" id="setNameBtn" onclick="updateChatUserName()">Definir</button>
      </div>
      <div class="chat-message-row">
        <input type="text" id="chatMessageInput" placeholder="Digite sua mensagem..." maxlength="200">
        <button class="btn" id="sendChatBtn">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    // ========== CONFIG FIREBASE (FIRESTORE) ==========
    const firebaseConfig = {
      apiKey: "AIzaSyBcSfnaRwXZPJ2Z6MUoednrqZug2YJwzEc",
      authDomain: "testbotao.firebaseapp.com",
      databaseURL: "https://testbotao-default-rtdb.firebaseio.com",
      projectId: "testbotao",
      storageBucket: "testbotao.firebasestorage.app",
      messagingSenderId: "940068631746",
      appId: "1:940068631746:web:2df2dee1d918a0f55bb75b"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ========== JOGO (código original, sem alterações no core) ==========
    const imgs = [
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/000404.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/0005563.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/000569.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/001013.webp"
    ];
    const colors = ["red", "blue", "green", "yellow"];
    const colorMap = { red: "#ef4444", blue: "#3b82f6", green: "#22c55e", yellow: "#eab308" };

    let gameState = {
      roomMode: false,      // false = contra robôs
      roomId: null,
      myName: "Você",
      roomMembers: [],
      deck: [],
      players: [[], [], [], []],
      topCard: null,
      turn: 0,
      penalty: 0,
      gameRunning: false,
      botTimer: null,
      myId: Math.random().toString(36).substr(2, 8)
    };

    // LOBBY: salas padrão (sem senha por simplicidade)
    let roomsList = [
      { id: "sala1", name: "Sala 1", locked: false },
      { id: "sala2", name: "Sala 2", locked: false },
      { id: "sala3", name: "Sala 3", locked: false }
    ];

    function renderLobbyRooms(){
      const container = document.getElementById("roomsList");
      if(!container) return;
      container.innerHTML = "";
      roomsList.forEach(room => {
        const div = document.createElement("div");
        div.className = "room-card";
        div.innerHTML = `
          <div class="room-head"><strong>${escapeHtml(room.name)}</strong><span class="room-tag">Aberta</span></div>
          <div class="room-actions"><button class="btn secondary" onclick="joinRoom('${room.id}')">Entrar</button></div>
        `;
        container.appendChild(div);
      });
    }

    function joinRoom(roomId){
      const room = roomsList.find(r => r.id === roomId);
      if(!room) return;
      let userName = document.getElementById("roomName").value.trim();
      if(!userName) userName = document.getElementById("playerName").value.trim();
      if(!userName) userName = "Jogador";
      gameState.myName = userName.slice(0,18);
      gameState.roomMode = true;
      gameState.roomId = room.id;
      // Membros fictícios (apenas para exibição)
      gameState.roomMembers = [
        { name: "Jogador 2", id: "player2" },
        { name: "Jogador 3", id: "player3" },
        { name: "Jogador 4", id: "player4" }
      ];
      showGame();
      initGame();
      // Inicializa chat da sala
      initRoomChat(roomId);
    }

    function joinRobots(){
      let userName = document.getElementById("playerName").value.trim();
      if(!userName) userName = "Você";
      gameState.myName = userName.slice(0,18);
      gameState.roomMode = false;
      gameState.roomId = null;
      gameState.roomMembers = [];
      showGame();
      initGame();
      // chat offline: usar localStorage (simples)
      initOfflineChat();
    }

    // ========== FUNÇÕES DO JOGO ==========
    function showGame(){
      document.getElementById("lobbyScreen").style.display = "none";
      document.getElementById("endScreen").style.display = "none";
      document.getElementById("table").style.display = "block";
      document.getElementById("chatPanel").style.display = "flex";
    }

    function backToLobby(){
      clearTimeout(gameState.botTimer);
      gameState.roomMode = false;
      gameState.roomId = null;
      detachChatListener();
      document.getElementById("table").style.display = "none";
      document.getElementById("endScreen").style.display = "none";
      document.getElementById("lobbyScreen").style.display = "flex";
      document.getElementById("chatPanel").style.display = "none";
      renderLobbyRooms();
    }

    function initGame(){
      clearTimeout(gameState.botTimer);
      gameState.deck = [];
      gameState.players = [[], [], [], []];
      gameState.penalty = 0;
      gameState.turn = 0;
      gameState.gameRunning = true;
      for(let i=0;i<100;i++) gameState.deck.push(createCard());
      for(let p=0;p<4;p++) for(let i=0;i<6;i++) gameState.players[p].push(drawFromDeck());
      gameState.topCard = drawFromDeck();
      renderGame();
      if(!gameState.roomMode) scheduleBotTurn();
    }

    function createCard(){
      const r = Math.random();
      let value = Math.floor(Math.random() * 10).toString();
      if(r<0.12) value="+2";
      else if(r<0.18) value="+4";
      return { color: colors[Math.floor(Math.random()*colors.length)], value, img: imgs[Math.floor(Math.random()*imgs.length)] };
    }

    function drawFromDeck(){
      if(gameState.deck.length===0) for(let i=0;i<60;i++) gameState.deck.push(createCard());
      return gameState.deck.pop();
    }

    function canPlay(c){
      if(!gameState.topCard) return true;
      if(c.value==="+4") return true;
      if(c.value==="+2") return c.color===gameState.topCard.color || gameState.topCard.value==="+2";
      return c.color===gameState.topCard.color || c.value===gameState.topCard.value;
    }

    function playCard(index){
      if(!gameState.gameRunning || gameState.turn!==0 || gameState.penalty>0) return;
      const c = gameState.players[0][index];
      if(!canPlay(c)) return;
      applyCard(c);
      gameState.players[0].splice(index,1);
      renderGame();
      nextTurn();
    }

    function applyCard(c){
      gameState.topCard = c;
      if(c.value==="+2") gameState.penalty+=2;
      if(c.value==="+4") gameState.penalty+=4;
    }

    function drawCard(){
      if(!gameState.gameRunning || gameState.turn!==0 || gameState.penalty>0) return;
      gameState.players[0].push(drawFromDeck());
      renderGame();
      nextTurn();
    }

    function nextTurn(){
      if(checkWin()) return;
      gameState.turn = (gameState.turn+1)%4;
      renderGame();
      clearTimeout(gameState.botTimer);
      if(!gameState.roomMode) gameState.botTimer = setTimeout(resolveTurn, 220);
    }

    function resolveTurn(){
      if(!gameState.gameRunning) return;
      if(gameState.penalty>0){
        for(let i=0;i<gameState.penalty;i++) gameState.players[gameState.turn].push(drawFromDeck());
        gameState.penalty=0;
        renderGame();
        nextTurn();
        return;
      }
      if(!gameState.roomMode && gameState.turn!==0) botTurn();
    }

    function botTurn(){
      clearTimeout(gameState.botTimer);
      gameState.botTimer = setTimeout(()=>{
        if(!gameState.gameRunning || gameState.turn===0) return;
        const hand = gameState.players[gameState.turn];
        const idx = hand.findIndex(c=>canPlay(c));
        if(idx!==-1){
          applyCard(hand[idx]);
          hand.splice(idx,1);
        } else {
          hand.push(drawFromDeck());
        }
        renderGame();
        nextTurn();
      }, 1200);
    }

    function scheduleBotTurn(){
      clearTimeout(gameState.botTimer);
      gameState.botTimer = setTimeout(resolveTurn, 160);
    }

    function checkWin(){
      for(let i=0;i<4;i++){
        if(gameState.players[i].length===0){
          gameState.gameRunning=false;
          document.getElementById("table").style.display="none";
          document.getElementById("endScreen").style.display="flex";
          document.getElementById("winnerText").textContent = i===0 ? "Você venceu!" : `${getPlayerName(i)} venceu!`;
          return true;
        }
      }
      return false;
    }

    function getPlayerName(idx){
      if(idx===0) return gameState.myName;
      if(gameState.roomMode && gameState.roomMembers[idx-1]) return gameState.roomMembers[idx-1].name;
      return `Robô ${idx}`;
    }

    function renderGame(){
      const discardDiv = document.getElementById("discardPile");
      discardDiv.innerHTML = gameState.topCard ? `<div class="card" data-value="${gameState.topCard.value}" style="background-image:url('${gameState.topCard.img}'); border-color:${colorMap[gameState.topCard.color]}"></div>` : '';
      document.getElementById("hudTurn").querySelector('span:last-child').textContent = gameState.turn===0 ? "Sua vez" : `Vez de ${getPlayerName(gameState.turn)}`;
      // Jogador atual (p1)
      const p1Div = document.getElementById("p1");
      p1Div.querySelector('.info').innerHTML = `<span>${getPlayerName(0)}</span><small>${gameState.players[0].length}</small>`;
      p1Div.querySelector('.cards').innerHTML = gameState.players[0].map((c,i)=>`<div class="card ${canPlay(c) ? 'playable' : ''}" data-value="${c.value}" style="background-image:url('${c.img}'); border-color:${colorMap[c.color]}" onclick="playCard(${i})"></div>`).join('');
      // Outros jogadores (costas das cartas)
      for(let i=1;i<=3;i++){
        const handDiv = document.getElementById(`p${i+1}`);
        handDiv.querySelector('.info').innerHTML = `<span>${getPlayerName(i)}</span><small>${gameState.players[i].length}</small>`;
        handDiv.querySelector('.cards').innerHTML = Array(gameState.players[i].length).fill('<div class="card back"></div>').join('');
      }
    }

    // ========== CHAT SIMPLES E FUNCIONAL ==========
    let chatUnsubscribe = null;
    let currentChatUserName = "Anônimo";

    function updateChatUserName(){
      let newName = document.getElementById("chatUserName").value.trim();
      if(newName === "") newName = "Anônimo";
      currentChatUserName = newName.slice(0,20);
      document.getElementById("chatUserName").value = currentChatUserName;
    }

    function initRoomChat(roomId){
      detachChatListener();
      const q = db.collection('chat').where('roomId', '==', roomId).orderBy('timestamp', 'asc');
      chatUnsubscribe = q.onSnapshot(snapshot => {
        const messages = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          messages.push({
            id: doc.id,
            author: data.author || "Anônimo",
            message: data.message || "",
            timestamp: data.timestamp?.toDate?.() || new Date()
          });
        });
        renderChatMessages(messages);
      }, err => console.error("Erro no chat:", err));
    }

    function initOfflineChat(){
      detachChatListener();
      // Modo offline: usa localStorage, mas mantemos o mesmo visual
      loadOfflineMessages();
    }

    function loadOfflineMessages(){
      const stored = localStorage.getItem("cartas_offline_chat");
      let messages = stored ? JSON.parse(stored) : [];
      renderChatMessages(messages);
    }

    function saveOfflineMessage(author, message){
      const stored = localStorage.getItem("cartas_offline_chat");
      let messages = stored ? JSON.parse(stored) : [];
      messages.push({ id: Date.now().toString(), author, message, timestamp: new Date() });
      if(messages.length > 50) messages = messages.slice(-50);
      localStorage.setItem("cartas_offline_chat", JSON.stringify(messages));
      loadOfflineMessages();
    }

    async function sendMessage(){
      let message = document.getElementById("chatMessageInput").value.trim();
      if(!message) return;
      let author = currentChatUserName;
      if(author === "Anônimo" && gameState.myName !== "Você") author = gameState.myName;
      if(author === "Anônimo"){
        alert("Por favor, defina seu nome no campo acima.");
        return;
      }
      if(gameState.roomMode && gameState.roomId){
        try {
          await db.collection('chat').add({
            roomId: gameState.roomId,
            author: author,
            message: message,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch(e){
          console.error(e);
          alert("Erro ao enviar mensagem. Verifique sua conexão.");
        }
      } else {
        saveOfflineMessage(author, message);
      }
      document.getElementById("chatMessageInput").value = "";
    }

    function renderChatMessages(messages){
      const container = document.getElementById("chatMessagesList");
      if(!container) return;
      if(messages.length === 0){
        container.innerHTML = '<div style="text-align:center; color:var(--muted);">Nenhuma mensagem ainda.</div>';
        return;
      }
      container.innerHTML = "";
      messages.forEach(msg => {
        const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const msgDiv = document.createElement("div");
        msgDiv.className = "chat-message";
        msgDiv.innerHTML = `
          <div class="message-author">
            <strong>${escapeHtml(msg.author)}</strong>
            <span class="message-time">${time}</span>
          </div>
          <div class="message-text">${escapeHtml(msg.message)}</div>
        `;
        container.appendChild(msgDiv);
      });
      container.scrollTop = container.scrollHeight;
    }

    function detachChatListener(){
      if(chatUnsubscribe){
        chatUnsubscribe();
        chatUnsubscribe = null;
      }
    }

    function toggleChatPanel(){
      const panel = document.getElementById("chatPanel");
      panel.classList.toggle("collapsed");
      const btn = panel.querySelector(".chat-collapse-btn");
      btn.textContent = panel.classList.contains("collapsed") ? "+" : "−";
    }

    // ========== UTILITÁRIOS ==========
    function escapeHtml(str){
      if(!str) return "";
      return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
    }

    function toggleTheme(){
      const isDark = document.getElementById("themeToggle").checked;
      document.body.setAttribute("data-theme", isDark ? "dark" : "light");
      localStorage.setItem("cartas_theme", isDark ? "dark" : "light");
    }

    function loadTheme(){
      const saved = localStorage.getItem("cartas_theme") || "light";
      document.body.setAttribute("data-theme", saved);
      document.getElementById("themeToggle").checked = saved === "dark";
    }

    // Eventos do chat
    document.getElementById("sendChatBtn").addEventListener("click", sendMessage);
    document.getElementById("chatMessageInput").addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });
    document.getElementById("setNameBtn").addEventListener("click", updateChatUserName);

    // Inicialização
    window.addEventListener("DOMContentLoaded", () => {
      loadTheme();
      renderLobbyRooms();
      // Garante nome padrão no chat
      if(gameState.myName !== "Você") currentChatUserName = gameState.myName;
      document.getElementById("chatUserName").value = currentChatUserName;
    });
  </script>
</body>
</html>
