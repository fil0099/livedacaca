<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartas - Multiplayer Corrigido</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg1:#eef2ff;--bg2:#f8fafc;--panel:rgba(255,255,255,0.85);--stroke:rgba(15,23,42,0.1);--text:#0f172a;--muted:#64748b;--accent:#16a34a;--accent-2:#0ea5e9;--shadow:0 20px 60px rgba(15,23,42,.12);--card-w:clamp(58px,7vw,88px);--card-h:calc(var(--card-w)*1.42)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);min-height:100vh}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(248,250,252,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20}
#lobbyScreen{align-items:flex-start;overflow:auto}
.panel{width:min(960px,100%);background:var(--panel);border:1px solid var(--stroke);border-radius:24px;padding:28px;box-shadow:var(--shadow)}
h1{margin:0 0 8px;font-size:clamp(2rem,5vw,3.5rem);font-weight:900;letter-spacing:-.02em}h1 span{background:linear-gradient(135deg,rgba(14,165,233,.18),rgba(34,197,94,.18));padding:0 .3em;border-radius:99px;border:1px solid var(--stroke)}
.btn{border:none;padding:12px 20px;border-radius:99px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#22c55e,#0ea5e9);color:white;box-shadow:0 10px 20px rgba(14,165,233,.22);transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(14,165,233,.28)}
.btn.secondary{background:white;color:var(--text);border:1px solid var(--stroke);box-shadow:none}
.btn.secondary:hover{background:#f8fafc}
input{padding:12px 16px;border-radius:12px;border:1px solid var(--stroke);font-size:16px;width:100%;background:white;outline:none}
input:focus{border-color:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.name-row{display:flex;gap:10px;margin:14px 0}
.rooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.room-card{background:white;border:1px solid var(--stroke);padding:16px;border-radius:16px;transition:.2s}
.room-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
#table{position:fixed;inset:0;display:none;background:radial-gradient(circle at 50% 30%,rgba(14,165,233,.12),transparent 45%),radial-gradient(circle at 80% 70%,rgba(34,197,94,.1),transparent 40%)}
.table-shell{height:100%;display:grid;grid-template-rows:auto 1fr;gap:12px;padding:14px;max-width:1400px;margin:0 auto}
.hud{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:10px 14px;border-radius:16px;border:1px solid var(--stroke);backdrop-filter:blur(8px)}
.board{display:grid;grid-template-columns:1fr minmax(280px,1.4fr) 1fr;grid-template-rows:1fr auto 1fr;gap:10px;height:100%;min-height:0}
.hand{display:flex;flex-direction:column;gap:6px;padding:10px;background:rgba(255,255,255,.7);border-radius:18px;border:1px solid var(--stroke);overflow:hidden;backdrop-filter:blur(6px)}
.hand .info{display:flex;gap:8px;align-items:center;font-weight:800;font-size:.9rem}.hand .info small{color:var(--muted);font-weight:700;background:rgba(0,0,0,.06);padding:2px 8px;border-radius:99px}
.cards{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;overflow:auto;max-height:100%;padding:2px}
.player-top{grid-column:1/4;grid-row:1}.player-left{grid-column:1;grid-row:2}.player-right{grid-column:3;grid-row:2}.center-area{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:10px}.player-bottom{grid-column:1/4;grid-row:3}
.pile{width:var(--card-w);height:var(--card-h);border-radius:14px;border:2px solid var(--stroke);background:white;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pile.draw{background:linear-gradient(135deg,#0f172a,#334155);cursor:pointer;transition:.2s}
.pile.draw:hover{transform:translateY(-2px) scale(1.02)}
.pile.draw::after{content:"↑";color:white;font-size:1.5rem;font-weight:900;opacity:.8}
.card{width:var(--card-w);height:var(--card-h);border-radius:12px;border:2px solid rgba(255,255,255,.4);background-size:cover;background-position:center;box-shadow:0 6px 16px rgba(0,0,0,.15);position:relative;transition:.18s cubic-bezier(.2,.8,.2,1);cursor:pointer;flex-shrink:0;background:linear-gradient(165deg,var(--c1),var(--c2))}
.card::after{content:attr(data-value);position:absolute;top:5px;left:5px;background:rgba(0,0,0,.72);color:white;padding:2px 7px;border-radius:99px;font-size:.7rem;font-weight:900;letter-spacing:.02em;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.card:hover{transform:translateY(-4px) rotate(-1deg)}.card.playable{transform:translateY(-8px);box-shadow:0 14px 28px rgba(0,0,0,.22),0 0 0 3px #22c55e;z-index:2}
.card.back{background:linear-gradient(135deg,#0f172a,#475569);border-color:rgba(255,255,255,.15)}.card.back::after{content:"";display:none}
.card.back::before{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.25);font-size:1.8rem}
.turn-badge{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);border-radius:99px;font-weight:800;font-size:.9rem}
.dot{width:8px;height:8px;background:#22c55e;border-radius:50%;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.2)}}
#chat{position:fixed;right:16px;bottom:16px;width:min(340px,92vw);max-height:42vh;background:var(--panel);border:1px solid var(--stroke);border-radius:18px;display:none;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);z-index:30;backdrop-filter:blur(10px)}
#chatHead{padding:10px 14px;border-bottom:1px solid var(--stroke);font-weight:800;display:flex;justify-content:space-between;align-items:center}
#chatMsgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.msg{background:rgba(0,0,0,.04);padding:7px 10px;border-radius:12px;border-left:3px solid var(--accent-2);word-break:break-word}
#chatIn{display:flex;gap:6px;padding:8px;border-top:1px solid var(--stroke);background:rgba(255,255,255,.6)}#chatIn input{flex:1;padding:9px 12px;font-size:.9rem}
#status{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:9px 16px;border-radius:99px;font-size:.85rem;font-weight:700;display:none;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.3)}
@media(max-width:860px){.board{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto auto}.player-left,.player-right{display:none}.center-area{grid-column:1/3;grid-row:2}.player-top{grid-row:1}.player-bottom{grid-row:3}.cards{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}.card{scroll-snap-align:start} :root{--card-w:clamp(56px,18vw,78px)}}
</style>
</head>
<body>
<div id="status"></div>

<div id="lobbyScreen" class="screen">
  <div class="panel">
    <h1><span>Cartas</span> Multiplayer</h1>
    <p style="color:var(--muted);margin:6px 0 18px">Jogue solo contra robôs ou entre em salas online em tempo real.</p>
    <div class="name-row">
      <input id="playerName" placeholder="Seu nome" maxlength="16" value="">
      <button class="btn" onclick="joinRobots()">Jogar Solo</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:18px"><h3 style="margin:0;font-size:1.1rem;font-weight:800">Salas Online</h3><span style="font-size:.8rem;color:var(--muted)">Firebase ativo</span></div>
    <div class="rooms" id="roomsList"></div>
  </div>
</div>

<div id="endScreen" class="screen" style="display:none;z-index:40">
  <div class="panel" style="text-align:center;max-width:520px">
    <h1 id="winnerText" style="font-size:clamp(2rem,6vw,3rem)"></h1>
    <p style="color:var(--muted);margin:10px 0 20px">Partida encerrada</p>
    <button class="btn" onclick="backToLobby()">Voltar ao Lobby</button>
  </div>
</div>

<div id="table">
  <div class="table-shell">
    <div class="hud">
      <div style="display:flex;align-items:center;gap:8px"><button class="btn secondary" onclick="backToLobby()">← Sair</button> <strong style="margin-left:6px" class="hidden sm:inline">Mesa: <span id="roomLabel">Solo</span></strong></div>
      <div class="turn-badge"><span class="dot"></span><span id="turnText">Aguardando</span></div>
      <button class="btn secondary" onclick="toggleChat()" style="padding:8px 14px">💬</button>
    </div>
    <div class="board">
      <div id="p2" class="hand player-top"><div class="info"></div><div class="cards"></div></div>
      <div id="p3" class="hand player-left"><div class="info"></div><div class="cards"></div></div>
      <div class="center-area">
        <div style="display:flex;gap:18px;align-items:center">
          <div class="pile draw" onclick="drawCard()" title="Comprar carta"></div>
          <div id="discard" class="pile"></div>
        </div>
        <button class="btn" onclick="drawCard()" style="padding:10px 18px">Comprar carta</button>
        <div id="note" style="color:var(--muted);font-size:.9rem;font-weight:600;text-align:center;min-height:1.2em">Combine cor ou valor</div>
      </div>
      <div id="p4" class="hand player-right"><div class="info"></div><div class="cards"></div></div>
      <div id="p1" class="hand player-bottom"><div class="info"></div><div class="cards"></div></div>
    </div>
  </div>
</div>

<div id="chat">
  <div id="chatHead"><span>💬 Chat da Sala</span><button onclick="toggleChat()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted)">×</button></div>
  <div id="chatMsgs"></div>
  <div id="chatIn"><input id="chatInput" placeholder="Mensagem..." maxlength="180"><button class="btn" style="padding:8px 12px" onclick="sendChat()">Enviar</button></div>
</div>

<!-- Preload images for stable URLs -->
<img id="img1" src="https://picsum.photos/seed/carta1/200/280" hidden alt="">
<img id="img2" src="https://picsum.photos/seed/carta2/200/280" hidden alt="">
<img id="img3" src="https://picsum.photos/seed/carta3/200/280" hidden alt="">
<img id="img4" src="https://picsum.photos/seed/carta4/200/280" hidden alt="">

<script>
const firebaseConfig={apiKey:"AIzaSyBcSfnaRwXZPJ2Z6MUoednrqZug2YJwzEc",authDomain:"testbotao.firebaseapp.com",projectId:"testbotao",storageBucket:"testbotao.firebasestorage.app",messagingSenderId:"940068631746",appId:"1:940068631746:web:2df2dee1d918a0f55bb75b"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();

const imgs=()=> [document.getElementById('img1').src,document.getElementById('img2').src,document.getElementById('img3').src,document.getElementById('img4').src];
const colors=["red","blue","green","yellow"];
const colorMap={red:"#ef4444",blue:"#3b82f6",green:"#22c55e",yellow:"#eab308"};
const colorGrad={red:['#dc2626','#f87171'],blue:['#2563eb','#60a5fa'],green:['#16a34a','#4ade80'],yellow:['#ca8a04','#facc15']};

let S={roomMode:false,roomId:null,myId:Math.random().toString(36).slice(2,9),myName:"Você",players:[],hands:[[],[],[],[]],deck:[],top:null,turn:0,penalty:0,running:false,ref:null,unsub:null,chatUnsub:null,botTimer:null};

function showStatus(t){const s=document.getElementById('status');s.textContent=t;s.style.display='block';clearTimeout(showStatus._t);showStatus._t=setTimeout(()=>s.style.display='none',2800)}

function createCard(){const r=Math.random();let v=String(Math.floor(Math.random()*10));if(r<0.12)v="+2";else if(r<0.18)v="+4";const c=colors[Math.floor(Math.random()*4)];const im=imgs()[Math.floor(Math.random()*4)];return{color:c,value:v,img:im}}
function canPlay(c){if(!S.top)return true;if(c.value==="+4")return true;if(c.value==="+2")return c.color===S.top.color||S.top.value==="+2";return c.color===S.top.color||c.value===S.top.value}

function renderRooms(){document.getElementById('roomsList').innerHTML=['sala-1','sala-2','sala-3'].map(id=>`<div class="room-card"><div style="display:flex;justify-content:space-between;align-items:center"><div><strong style="text-transform:capitalize">${id.replace('-',' ')}</strong><div style="font-size:.8rem;color:var(--muted);margin-top:2px">até 4 jogadores</div></div><button class="btn secondary" onclick="joinRoom('${id}')">Entrar</button></div></div>`).join('')}

async function joinRoom(id){
  S.myName=document.getElementById('playerName').value.trim()||'Jogador';
  S.roomMode=true;S.roomId=id;S.ref=db.collection('rooms').doc(id);
  document.getElementById('lobbyScreen').style.display='none';
  document.getElementById('table').style.display='block';
  document.getElementById('chat').style.display='flex';
  document.getElementById('roomLabel').textContent=id;
  showStatus('Entrando em '+id+'...');
  
  try{
    await db.runTransaction(async t=>{
      const d=await t.get(S.ref);
      let p=d.exists?(d.data().players||[]):[];
      if(!p.find(x=>x.id===S.myId))p.push({id:S.myId,name:S.myName});
      if(p.length>4)p=p.slice(0,4);
      t.set(S.ref,{players:p,updated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    });
  }catch(e){console.error(e);showStatus('Erro ao entrar');}
  
  if(S.unsub) S.unsub();
  S.unsub=S.ref.onSnapshot(doc=>{
    if(!doc.exists)return;
    const data=doc.data();
    S.players=data.players||[];
    if(data.state){
      const st=data.state;
      S.hands=st.hands||[[],[],[],[]];S.deck=st.deck||[];S.top=st.topCard;S.turn=st.turn||0;S.penalty=st.penalty||0;S.running=st.gameRunning!==false;
      if(st.winner){endGame(st.winner);return}
      render();
    }else{
      if(S.players[0]?.id===S.myId){initGame();}
      else{document.getElementById('turnText').textContent='Aguardando host...';}
    }
  },err=>{console.error(err);showStatus('Erro de conexão')});
  
  if(S.chatUnsub) S.chatUnsub();
  S.chatUnsub=db.collection('chat').where('roomId','==',id).onSnapshot(s=>{
    const msgs=[];s.forEach(d=>msgs.push(d.data()));
    msgs.sort((a,b)=>(a.timestamp?.seconds||0)-(b.timestamp?.seconds||0));
    const box=document.getElementById('chatMsgs');
    box.innerHTML=msgs.slice(-80).map(m=>`<div class="msg"><b>${m.author||'Anon'}:</b> ${m.message||''}</div>`).join('');
    box.scrollTop=box.scrollHeight;
  });
}

async function initGame(){
  showStatus('Criando baralho...');
  const deck=Array(108).fill(0).map(createCard);
  const hands=[[],[],[],[]];
  for(let p=0;p<4;p++)for(let i=0;i<7;i++)hands[p].push(deck.pop());
  const top=deck.pop();
  try{
    await S.ref.set({state:{deck,hands,topCard:top,turn:0,penalty:0,gameRunning:true,winner:null}},{merge:true});
  }catch(e){console.error(e)}
}

function cardHTML(c, playable=false, onclick=''){
  const g=colorGrad[c.color]||['#64748b','#94a3b8'];
  return `<div class="card ${playable?'playable':''}" data-value="${c.value}" style="--c1:${g[0]};--c2:${g[1]};background-image:url('${c.img}');border-color:${colorMap[c.color]}" ${onclick}></div>`
}

function render(){
  try{
    const disc=document.getElementById('discard');
    if(S.top){disc.innerHTML=cardHTML(S.top);disc.style.borderColor=colorMap[S.top.color]||'var(--stroke)'}else{disc.innerHTML='';}
    
    const myIdx=Math.max(0,S.players.findIndex(p=>p.id===S.myId));
    const n=Math.max(1,S.players.length);
    const turnName=S.players[S.turn]?.name||'—';
    document.getElementById('turnText').textContent=S.turn===myIdx?'Sua vez':`Vez de ${turnName}`;
    document.getElementById('note').textContent=S.penalty>0?`⚠️ Compre ${S.penalty} cartas ou jogue +2/+4!`:'Combine cor ou valor. +2 e +4 acumulam.';
    
    const order=[myIdx,(myIdx+1)%n,(myIdx+2)%n,(myIdx+3)%n];
    const ids=['p1','p3','p2','p4'];
    const visible=new Set();
    
    order.forEach((pi,idx)=>{
      const el=document.getElementById(ids[idx]);
      if(!el)return;
      if(pi>=n||!S.players[pi]){el.style.display=idx===0?'flex':'none';return}
      visible.add(pi);
      el.style.display='flex';
      const name=S.players[pi].name+(pi===myIdx?' (você)':'');
      const hand=S.hands[pi]||[];
      el.querySelector('.info').innerHTML=`<span>${name}</span><small>${hand.length} cartas</small>`;
      const cardsWrap=el.querySelector('.cards');
      if(idx===0){
        cardsWrap.innerHTML=hand.map((c,i)=>cardHTML(c, canPlay(c)&&S.turn===myIdx&&S.penalty===0, `onclick="playCard(${i})"`)).join('');
      }else{
        cardsWrap.innerHTML=Array(Math.min(hand.length,12)).fill(0).map(()=>' <div class="card back"></div>').join('')+(hand.length>12?`<div style="align-self:center;font-size:.8rem;color:var(--muted);margin-left:4px">+${hand.length-12}</div>`:'');
      }
    });
    // hide unused
    ['p1','p2','p3','p4'].forEach(id=>{if(!document.getElementById(id).style.display)document.getElementById(id).style.display='none'})
  }catch(e){console.error('render',e)}
}

async function playCard(i){
  if(!S.running)return;
  const myIdx=S.players.findIndex(p=>p.id===S.myId);
  if(myIdx===-1)return;
  if(S.turn!==myIdx)return showStatus('Não é sua vez');
  if(S.penalty>0)return showStatus('Você precisa comprar');
  const card=S.hands[myIdx][i];
  if(!card||!canPlay(card))return showStatus('Jogada inválida');
  
  if(S.roomMode){
    try{
      await db.runTransaction(async t=>{
        const d=await t.get(S.ref);if(!d.exists)return;const st=d.data().state;if(!st)return;
        const hands=JSON.parse(JSON.stringify(st.hands||[]));if(!hands[myIdx])return;
        hands[myIdx].splice(i,1);
        let penalty=st.penalty||0;if(card.value==='+2')penalty+=2;if(card.value==='+4')penalty+=4;
        const winner=hands[myIdx].length===0?S.myName:null;
        const next=(st.turn+1)%(S.players.length||1);
        t.update(S.ref,{'state.hands':hands,'state.topCard':card,'state.penalty':penalty,'state.turn':winner?st.turn:next,'state.gameRunning':!winner,'state.winner':winner||null});
      });
    }catch(e){console.error(e);showStatus('Erro ao jogar')}
  }else{
    S.hands[myIdx].splice(i,1);
    S.top=card;
    if(card.value==='+2')S.penalty+=2;
    if(card.value==='+4')S.penalty+=4;
    if(S.hands[myIdx].length===0){endGame(S.myName);return}
    S.turn=(S.turn+1)%S.players.length;
    render();
    scheduleBot();
  }
}

async function drawCard(){
  if(!S.running)return;
  const myIdx=S.players.findIndex(p=>p.id===S.myId);
  if(myIdx===-1)return;
  if(S.turn!==myIdx)return showStatus('Não é sua vez');
  
  if(S.roomMode){
    try{
      await db.runTransaction(async t=>{
        const d=await t.get(S.ref);const st=d.data().state;const hands=JSON.parse(JSON.stringify(st.hands));let deck=st.deck||[];let penalty=st.penalty||0;
        const draw=()=>{if(deck.length<5){for(let k=0;k<20;k++)deck.push(createCard())}return deck.pop()};
        if(penalty>0){for(let i=0;i<penalty;i++)hands[myIdx].push(draw());penalty=0}else{hands[myIdx].push(draw())}
        const next=(st.turn+1)%(S.players.length||1);
        t.update(S.ref,{'state.hands':hands,'state.deck':deck,'state.penalty':penalty,'state.turn':next});
      });
    }catch(e){console.error(e)}
  }else{
    const h=S.hands[myIdx];
    if(S.penalty>0){for(let i=0;i<S.penalty;i++)h.push(S.deck.pop()||createCard());S.penalty=0;showStatus(`Comprou ${S.penalty||'as'} cartas`)}
    else{h.push(S.deck.pop()||createCard())}
    S.turn=(S.turn+1)%S.players.length;
    render();
    scheduleBot();
  }
}

function endGame(winner){
  S.running=false;
  clearTimeout(S.botTimer);
  document.getElementById('table').style.display='none';
  document.getElementById('chat').style.display='none';
  document.getElementById('endScreen').style.display='flex';
  document.getElementById('winnerText').textContent=winner===S.myName?'🎉 Você venceu!':`🏆 ${winner} venceu!`;
  if(S.roomMode&&S.ref){S.ref.update({'state.gameRunning':false,'state.winner':winner}).catch(()=>{});}
}

async function backToLobby(){
  clearTimeout(S.botTimer);
  if(S.unsub){S.unsub();S.unsub=null}
  if(S.chatUnsub){S.chatUnsub();S.chatUnsub=null}
  if(S.ref&&S.roomMode&&S.players.length){try{const d=await S.ref.get();if(d.exists){const p=(d.data().players||[]).filter(x=>x.id!==S.myId);await S.ref.update({players:p})}}catch(e){}}
  S={...S,roomMode:false,roomId:null,players:[],hands:[[],[],[],[]],deck:[],top:null,turn:0,penalty:0,running:false,ref:null};
  document.getElementById('endScreen').style.display='none';
  document.getElementById('table').style.display='none';
  document.getElementById('chat').style.display='none';
  document.getElementById('lobbyScreen').style.display='flex';
  renderRooms();
}

function sendChat(){
  const inp=document.getElementById('chatInput');const txt=inp.value.trim();if(!txt||!S.roomMode)return;
  db.collection('chat').add({roomId:S.roomId,author:S.myName,message:txt,timestamp:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});
  inp.value='';
}
document.getElementById('chatInput')?.addEventListener('keypress',e=>{if(e.key==='Enter')sendChat()});
function toggleChat(){const c=document.getElementById('chat');c.style.display=c.style.display==='none'||!c.style.display?'flex':'none'}

// SOLO
function joinRobots(){
  S.myName=document.getElementById('playerName').value.trim()||'Você';
  S.roomMode=false;S.roomId=null;
  S.players=[{id:S.myId,name:S.myName},{id:'b1',name:'Robô Ana'},{id:'b2',name:'Robô Bruno'},{id:'b3',name:'Robô Carla'}];
  document.getElementById('lobbyScreen').style.display='none';document.getElementById('table').style.display='block';document.getElementById('roomLabel').textContent='Solo';
  const deck=Array(108).fill(0).map(createCard);S.hands=[[],[],[],[]];for(let p=0;p<4;p++)for(let i=0;i<7;i++)S.hands[p].push(deck.pop());S.deck=deck;S.top=deck.pop();S.turn=0;S.penalty=0;S.running=true;render();showStatus('Partida solo iniciada!');
}
function scheduleBot(){if(S.roomMode||!S.running)return;if(S.turn===0)return;clearTimeout(S.botTimer);S.botTimer=setTimeout(botTurn,1100)}
function botTurn(){
  if(!S.running||S.turn===0||S.roomMode)return;
  const idx=S.turn;const h=S.hands[idx]||[];
  if(S.penalty>0){for(let i=0;i<S.penalty;i++)h.push(S.deck.pop()||createCard());S.penalty=0;showStatus(`${S.players[idx].name} comprou`)}
  else{
    const pi=h.findIndex(canPlay);
    if(pi>-1){const c=h.splice(pi,1)[0];S.top=c;if(c.value==='+2')S.penalty+=2;if(c.value==='+4')S.penalty+=4;showStatus(`${S.players[idx].name} jogou ${c.value}`)}
    else{h.push(S.deck.pop()||createCard());showStatus(`${S.players[idx].name} comprou`)}
  }
  if(h.length===0){endGame(S.players[idx].name);return}
  S.turn=(S.turn+1)%S.players.length;
  render();
  scheduleBot();
}

window.onload=()=>{renderRooms();document.getElementById('playerName').value='Jogador'+Math.floor(Math.random()*900+100)};
window.addEventListener('beforeunload',()=>{if(S.roomMode&&S.ref){navigator.sendBeacon&&S.ref.update({players:firebase.firestore.FieldValue.arrayRemove({id:S.myId,name:S.myName})})}});
</script>
