<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Botão Deslizante</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --card: #ffffff;
      --text: #1f2937;
      --off: #cbd5e1;
      --on: #22c55e;
      --knob: #ffffff;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 28px 30px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .label {
      font-size: 18px;
      font-weight: 700;
      min-width: 110px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 72px;
      height: 40px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--off);
      transition: 0.25s;
      border-radius: 999px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.12);
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 30px;
      width: 30px;
      left: 5px;
      top: 5px;
      background-color: var(--knob);
      border-radius: 50%;
      transition: 0.25s;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    input:checked + .slider {
      background-color: var(--on);
    }

    input:checked + .slider::before {
      transform: translateX(32px);
    }

    .ball {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #9ca3af;
      box-shadow: 0 0 0 4px rgba(156, 163, 175, 0.15);
      transition: 0.25s;
      flex: 0 0 auto;
    }

    .ball.on {
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
    }

    .state {
      font-size: 14px;
      color: #6b7280;
      margin-left: 4px;
      min-width: 72px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="label">Ligado / Desligado</div>

    <label class="switch" aria-label="Botão deslizante">
      <input id="toggle" type="checkbox" />
      <span class="slider"></span>
    </label>

    <div id="ball" class="ball" aria-hidden="true"></div>
    <div id="stateText" class="state">Desligado</div>
  </div>

  <script>
    const toggle = document.getElementById('toggle');
    const ball = document.getElementById('ball');
    const stateText = document.getElementById('stateText');

    function updateUI() {
      const on = toggle.checked;
      ball.classList.toggle('on', on);
      stateText.textContent = on ? 'Ligado' : 'Desligado';
    }

    // Estado inicial: desligado
    toggle.checked = false;
    updateUI();

    toggle.addEventListener('change', updateUI);
  </script>
