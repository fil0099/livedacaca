  function checkWinOffline(){
    for(let i = 0; i < 4; i++){
      if(gameState.players[i].length === 0){
        gameState.gameRunning = false;
        document.getElementById("table").style.display = "none";
        document.getElementById("endScreen").style.display = "flex";
        const label = i === 0 ? getPlayerLabelOffline(1) : getPlayerLabelOffline(i + 1);
        document.getElementById("winnerText").innerHTML = i === 0 ? `${gameState.myName} ${formatIdChip(gameState.myId)} venceu!` : `${label} venceu!`;
        return true;
      }
    }
    return false;
  }

  function renderGame(){
    if(gameState.roomMode){
      const state = gameState.roomState;
      if(!state){
        document.getElementById("statusNote").textContent = "Entrando na sala...";
        updateSeatControls(null);
        return;
      }

      if(checkWinRoom(state)){
        document.getElementById("table").style.display = "none";
        document.getElementById("endScreen").style.display = "flex";
        const winner = getSlotMember(state, state.winnerSlot);
        document.getElementById("winnerText").innerHTML = winner ? `${formatLabelHtml(winner.name, winner.id)} venceu!` : "Partida encerrada";
        return;
      }

      document.getElementById("table").style.display = "block";
      document.getElementById("endScreen").style.display = "none";

      updateSeatControls(state);
      const currentTurn = normalizeTurn(state);
      const turnMember = getSlotMember(state, currentTurn);
      const hudTurn = document.getElementById("hudTurn");
      if(hudTurn){
        hudTurn.querySelector("span:last-child").textContent = currentTurn === gameState.mySlot ? "Sua vez" : `Vez de ${turnMember ? turnMember.name : `Jogador ${currentTurn}`}`;
      }

      document.getElementById("discardPile").innerHTML = state.topCard ? `<div class="card" data-value="${state.topCard.value}" style="background-image:url('${state.topCard.img}'); border-color:${colorMap[state.topCard.color]}"></div>` : "";
      document.getElementById("statusNote").textContent = state.penalty > 0 ? `Punição ativa: compre ${state.penalty} carta(s)` : "Escolha uma carta da sua mão ou compre";

      const displayOrder = [];
      const usedSlots = new Set();
      const pushSlot = slot => {
        if(!slot || usedSlots.has(slot) || !state.slots[slot]) return;
        usedSlots.add(slot);
        displayOrder.push(slot);
      };
      if(gameState.mySlot){
        pushSlot(gameState.mySlot);
        for(let step = 1; step <= 4; step++){
          const slot = ((gameState.mySlot - 1 + step) % 4) + 1;
          pushSlot(slot);
        }
      }else{
        for(let slot = 1; slot <= 4; slot++) pushSlot(slot);
      }

      const displayIds = ["p1", "p2", "p4", "p3"];
      displayIds.forEach((id, idx) => {
        const h = document.getElementById(id);
        if(!h) return;
        const actualSlot = displayOrder[idx];
        const info = h.querySelector(".info");
        const cardsEl = h.querySelector(".cards");

        if(!actualSlot){
          info.innerHTML = "";
          cardsEl.innerHTML = "";
          return;
        }

        const slotName = state.slots[actualSlot]?.name || `Jogador ${actualSlot}`;
        const slotId = String(state.slots[actualSlot]?.id || "").toUpperCase().slice(0,4);
        const hand = state.hands[actualSlot] || [];
        info.innerHTML = `<span>${formatLabelHtml(slotName, slotId, gameState.mySlot === actualSlot ? "(você)" : "")}</span><small>${hand.length}</small>`;

        if(gameState.mySlot === actualSlot){
          cardsEl.innerHTML = hand.map((c, i) => `<div class="card ${canPlay(c, state.topCard) ? "playable" : ""}" data-value="${c.value}" style="background-image:url('${c.img}'); border-color:${colorMap[c.color]}" onclick="playCard(${i})"></div>`).join("");
        }else{
          cardsEl.innerHTML = Array(hand.length).fill('<div class="card back"></div>').join("");
        }
      });
      renderPeopleModal();
      return;
    }

    if(!gameState.gameRunning) return;
    document.getElementById("discardPile").innerHTML = gameState.topCard ? `<div class="card" data-value="${gameState.topCard.value}" style="background-image:url('${gameState.topCard.img}'); border-color:${colorMap[gameState.topCard.color]}"></div>` : "";
    document.getElementById("hudTurn").querySelector("span:last-child").textContent = gameState.turn === 0 ? "Sua vez" : `Vez de ${getPlayerLabelOffline(gameState.turn + 1).replace(/<[^>]*>/g, "")}`;
    const p1 = document.getElementById("p1");
    p1.querySelector(".info").innerHTML = `<span>${getPlayerLabelOffline(1)}</span><small>${gameState.players[0].length}</small>`;
    p1.querySelector(".cards").innerHTML = gameState.players[0].map((c, i) => `<div class="card ${canPlayOffline(c) ? "playable" : ""}" data-value="${c.value}" style="background-image:url('${c.img}'); border-color:${colorMap[c.color]}" onclick="playCard(${i})"></div>`).join("");
    for(let i = 1; i <= 3; i++){
      const h = document.getElementById(`p${i + 1}`);
      h.querySelector(".info").innerHTML = `<span>${getPlayerLabelOffline(i + 1)}</span><small>${gameState.players[i].length}</small>`;
      h.querySelector(".cards").innerHTML = Array(gameState.players[i].length).fill('<div class="card back"></div>').join("");
    }
    document.getElementById("statusNote").textContent = gameState.penalty > 0 ? `Punição ativa: compre ${gameState.penalty} carta(s)` : "Escolha uma carta da sua mão ou compre";
  }

    gameState.masterVolume = v / 100;

  function toggleAudio(){

  }

  async function toggleMic(){
    gameState.micEnabled = !gameState.micEnabled;
    const btn = document.getElementById("micBtn");
    if(btn) btn.textContent = gameState.micEnabled ? "Mic: ligado" : "Mic: desligado";
    if(gameState.micEnabled){
      try{
        gameState.micStream = await navigator.mediaDevices.getUserMedia({audio:true});
        gameState.micAudioContext = new (window.AudioContext||window.webkitAudioContext)();
        const src = gameState.micAudioContext.createMediaStreamSource(gameState.micStream);
        gameState.micGain = gameState.micAudioContext.createGain();
        const mon = gameState.micAudioContext.createGain();
        src.connect(gameState.micGain).connect(mon).connect(gameState.micAudioContext.destination);
        gameState.micGain.gain.value = gameState.micVolume;
        mon.gain.value = gameState.audioEnabled ? gameState.masterVolume : 0;
      }catch(e){
        alert("Microfone não disponível");
        gameState.micEnabled = false;
      }
    }else{
      if(gameState.micStream) gameState.micStream.getTracks().forEach(t => t.stop());
      if(gameState.micAudioContext) gameState.micAudioContext.close();
      gameState.micStream = null;
    }
  }

  function setupMusic(){
    if(!gameState.musicAudio){
      gameState.musicAudio = new Audio();
      gameState.musicAudio.loop = false;
      gameState.musicAudio.addEventListener("ended", () => nextTrack(true));
    }
    const pl = gameState.roomMode ? (gameState.roomPlaylist && gameState.roomPlaylist.length ? gameState.roomPlaylist : getRoomPlaylist(gameState.roomId || "")) : (gameState.robotPlaylist && gameState.robotPlaylist.length ? gameState.robotPlaylist : ADMIN_DEFAULT_PLAYLIST);
    if(pl.length) gameState.musicAudio.src = pl[gameState.trackIndex % pl.length];
    gameState.musicAudio.volume = gameState.musicVolume * gameState.masterVolume;
    document.getElementById("musicDisc")?.classList.remove("playing");
  }

  function openPeopleModal(){ openPeopleModal.__open = true; const modal = document.getElementById("peopleModal"); if(modal){ modal.style.display = "flex"; renderPeopleModal(); } }
  function closePeopleModal(){ const modal = document.getElementById("peopleModal"); if(modal) modal.style.display = "none"; }

  function performRoomAction(action){
    if(!gameState.roomMode || !gameState.roomId || !gameState.mySlot) return;
    const roomRef = db.collection("rooms").doc(gameState.roomId);
    db.runTransaction(async tx => {
      const snap = await tx.get(roomRef);
      if(!snap.exists) throw new Error("Sala não encontrada");
      const data = snap.data() || {};
      let state = cleanupStaleSlots(normalizeSharedState(data.state));

      if(!state.slots[gameState.mySlot] || String(state.slots[gameState.mySlot].id || "").toUpperCase().slice(0,4) !== gameState.myId){
        throw new Error("Você não está mais nessa sala");
      }

      state.turn = normalizeTurn(state);
      if(state.turn !== gameState.mySlot) throw new Error("Não é sua vez");
      if(!state.gameRunning) throw new Error("A partida já terminou");

      const hand = state.hands[gameState.mySlot] || (state.hands[gameState.mySlot] = []);

      if(action.type === "draw"){
        if(state.penalty > 0){
          for(let i = 0; i < state.penalty; i++) hand.push(drawFromDeckShared(state));
          state.penalty = 0;
        }else{
          hand.push(drawFromDeckShared(state));
        }
        state.turn = nextOccupiedSlot(state, gameState.mySlot);
      }

      if(action.type === "play"){
        const card = hand[action.index];
        if(!card) throw new Error("Carta inválida");
        if(!canPlay(card, state.topCard)) throw new Error("Essa carta não pode ser jogada agora");
        state.topCard = card;
        hand.splice(action.index, 1);
        if(card.value === "+2") state.penalty += 2;
        if(card.value === "+4") state.penalty += 4;
        if(hand.length === 0){
          state.gameRunning = false;
          state.winnerSlot = gameState.mySlot;
        }else{
          state.turn = nextOccupiedSlot(state, gameState.mySlot);
        }
      }

      const myMember = state.members?.[gameState.myId];
      if(myMember){
        myMember.lastSeen = Date.now();
        myMember.name = gameState.myName;
        myMember.slot = gameState.mySlot;
      }

      state.updatedAt = Date.now();
      tx.update(roomRef, { state, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }).catch(err => {
      console.error(err);
      alert(err.message || "Não foi possível atualizar a sala.");
    });
  }

  function checkWinRoom(state){
    if(!state || state.gameRunning) return false;
    return state.winnerSlot !== null;
  }

  function updateSeatControls(state){
    const downBtn = document.getElementById("seatDownBtn");
    const upBtn = document.getElementById("seatUpBtn");
    if(!downBtn || !upBtn) return;
    if(!gameState.roomMode || !state){
      downBtn.style.display = "none";
      upBtn.style.display = "none";
      return;
    }
    const hasVacancy = anyVacantSlot(state);
    const seated = !!gameState.mySlot;
    downBtn.style.display = seated ? "" : "none";
    upBtn.style.display = !seated && hasVacancy ? "" : "none";
  }

  function renderPeopleButtonState(){
    const btn = document.getElementById("peopleBtn");
    if(btn) btn.classList.toggle("people-btn-active", !!gameState.roomMode);
  }

  function toggleChatPanel(){
    const p = document.getElementById("chatPanel");
    p.classList.toggle("collapsed");
    p.querySelector(".chat-collapse-btn").textContent = p.classList.contains("collapsed") ? "+" : "−";
  }

  function toggleTheme(){
    const isDark = document.getElementById("themeToggle")?.checked;
    document.body.setAttribute("data-theme", isDark ? "dark" : "light");
    localStorage.setItem("cartas_theme", isDark ? "dark" : "light");
  }

  function loadTheme(){
    const saved = localStorage.getItem("cartas_theme") || "light";
    document.body.setAttribute("data-theme", saved);
    const toggle = document.getElementById("themeToggle");
    if(toggle) toggle.checked = saved === "dark";
    if(typeof window.renderThemeDots === "function") window.renderThemeDots();
  }

  function renderAdminModal(){
    renderAdminModalState();
    renderAdminRoomsList();
    renderAdminRoomSelector();
    renderAdminRoomDetails();
    renderDelegationCandidates();
    renderDelegationList();
  }

  async function syncRoomMusicIfNeeded(roomId){
    if(gameState.roomMode && gameState.roomId === roomId){
      gameState.roomPlaylist = getRoomPlaylist(roomId).slice();
      setupMusic();
      if(getRoomAutoplay(roomId)) playMusic();
    }
  }

  function renderAdminModalIfOpen(){
    if(document.getElementById("adminModal")?.style.display === "flex"){
      renderAdminModal();
    }
  }

  function saveDelegation(){
    if(!canAccess("delegate")) return;
    const targetId = adminUI.selectedDelegationId;
    if(!targetId) return alert("Selecione uma pessoa.");
    const payload = {};
    Object.keys(PERMISSIONS).forEach(key => {
      payload[key] = !!document.getElementById(`perm_${key}`)?.checked;
    });
    adminUI.settings.delegations[targetId] = payload;
    addUserToRegistry(findKnownUser(targetId) || { id: targetId, name: targetId });
    saveSettings();
    renderDelegationList();
    alert("Função delegada.");
  }

  function removeDelegation(userId){
    if(!canAccess("delegate")) return;
    const id = String(userId || "").toUpperCase().slice(0,4);
    delete adminUI.settings.delegations[id];
    saveSettings();
    renderDelegationList();
  }

  function selectAdminRoomByCurrent(){
    renderAdminRoomSelector();
    renderAdminRoomDetails();
  }

  function renderAdminCandidateSelectionState(){
    renderDelegationCandidates();
    renderDelegationList();
  }

  function findKnownUser(userId){
    const id = String(userId || "").toUpperCase().slice(0,4);
    const state = currentRoomState();
    const list = [];
    if(state) list.push(...Object.values(state.members || {}));
    if(Array.isArray(adminUI.settings.userRegistry)) list.push(...adminUI.settings.userRegistry);
    const hit = list.find(u => String(u.id || "").toUpperCase().slice(0,4) === id);
    if(hit) return {
      id,
      name: String(hit.name || "Jogador").slice(0, 18),
      slot: Number.isFinite(hit.slot) ? hit.slot : null,
      watching: !!hit.watching,
      roomId: hit.roomId || ""
    };
    if(gameState.myId === id) return { id, name: gameState.myName, slot: gameState.mySlot, watching: gameState.mySlot === null, roomId: gameState.roomId || "" };
    return null;
  }

  function initEnhancements(){
    ensureStyles();
    ensureModals();
    ensureTopControls();
    if(typeof window.renderThemeDots === "function") window.renderThemeDots();
    if(typeof window.loadTheme === "function") window.loadTheme();
    if(typeof window.refreshThemeForMode === "function") window.refreshThemeForMode();
    if(adminUI.settings.adminPassword == null) adminUI.settings.adminPassword = "123";

    if(adminUI.settings.rooms.length === 0){
      adminUI.settings.rooms = DEFAULT_ROOM_DEFS.map(r => ({ id: r.id, name: r.name }));
    }
    DEFAULT_ROOM_DEFS.forEach(room => {
      if(!adminUI.settings.roomMeta[room.id]){
        adminUI.settings.roomMeta[room.id] = { name: room.name, password: room.password, autoplay: room.autoplay, playlist: room.playlist.slice() };
      }
    });
    saveSettingsLocal();

    try{
      if(adminUI.settingsListener) adminUI.settingsListener();
    }catch(e){}
    adminUI.settingsListener = SETTINGS_DOC_REF.onSnapshot(snap => {
      if(snap && snap.exists){
        mergeRemoteSettings(snap.data() || {});
      }
    }, () => {});
  }

  function renderAdminRoomSummary(){
    renderAdminRoomsList();
    renderAdminRoomSelector();
    renderAdminRoomDetails();
  }

  function renderPeopleModalIfNeeded(){
    if(document.getElementById("peopleModal")?.style.display === "flex"){
      renderPeopleModal();
    }
  }

  function cleanupModalVisibility(){
    const adm = document.getElementById("adminModal");
    const people = document.getElementById("peopleModal");
    if(adm && adm.style.display !== "flex") adm.style.display = "";
    if(people && people.style.display !== "flex") people.style.display = "";
  }

  const originalBeforeUnload = window.onbeforeunload;
  window.addEventListener("beforeunload", () => {
    try{ if(adminUI.settingsListener) adminUI.settingsListener(); }catch(e){}
  });

  window.openAdminModal = openAdminModal;
  window.closeAdminModal = closeAdminModal;
  window.loginAdmin = loginAdmin;
  window.logoutAdmin = logoutAdmin;
  window.saveAdminPassword = saveAdminPassword;
  window.createRoom = createRoom;
  window.deleteRoom = deleteRoom;
  window.saveRoomPassword = saveRoomPassword;
  window.selectAdminRoom = selectAdminRoom;
  window.renderAdminRoomDetails = renderAdminRoomDetails;
  window.saveRoomMusicUrls = saveRoomMusicUrls;
  window.clearRoomMusicUrls = clearRoomMusicUrls;
  window.saveRoomAutoplay = saveRoomAutoplay;
  window.renderDelegationCandidates = renderDelegationCandidates;
  window.selectDelegationUser = selectDelegationUser;
  window.clearDelegationSelection = clearDelegationSelection;
  window.saveDelegation = saveDelegation;
  window.removeDelegation = removeDelegation;
  window.openPeopleModal = openPeopleModal;
  window.closePeopleModal = closePeopleModal;
  window.renderPeopleModal = renderPeopleModal;
  window.joinRoom = joinRoom;
  window.bootstrapLobbyRooms = bootstrapLobbyRooms;
  window.renderLobbyRooms = renderLobbyRooms;
  window.renderGame = renderGame;
  window.initGame = initGame;
  window.initRoomChat = initRoomChat;
  window.initOfflineChat = initOfflineChat;
  window.saveOfflineMessage = saveOfflineMessage;
  window.sendMessage = sendMessage;
  window.renderChatMessages = renderChatMessages;
  window.leaveCurrentRoom = leaveCurrentRoom;
  window.leaveSeat = leaveSeat;
  window.takeSeat = takeSeat;
  window.startRoomHeartbeat = startRoomHeartbeat;
  window.subscribeRoom = subscribeRoom;
  window.performRoomAction = performRoomAction;
  window.checkWinOffline = checkWinOffline;
  window.toggleChatPanel = toggleChatPanel;
  window.toggleTheme = toggleTheme;
  window.loadTheme = loadTheme;
  window.backToLobby = backToLobby;
  window.ensureRoomDoc = ensureRoomDoc;
  window.closeRoomSession = closeRoomSession;
  window.refreshCurrentRoomMusic = refreshCurrentRoomMusic;
  window.renderAdminModal = renderAdminModal;
  window.renderAdminRoomSelector = renderAdminRoomSelector;
  window.renderAdminRoomsList = renderAdminRoomsList;
  window.renderAdminModalState = renderAdminModalState;
  window.renderAdminCandidateSelectionState = renderAdminCandidateSelectionState;

  window.__originalRefreshThemeForMode = window.refreshThemeForMode;
  window.refreshThemeForMode = function(){
    if(typeof window.__originalRefreshThemeForMode === "function") window.__originalRefreshThemeForMode();
    ensureTopControls();
    renderAdminModalIfOpen();
    renderPeopleModalIfNeeded();
  };

  initEnhancements();

  window.addEventListener("load", () => {
    ensureTopControls();
    renderAdminModal();
    renderPeopleModal();
    renderPeopleButtonState();
    refreshCurrentRoomMusic();
  });
})();
</script>
