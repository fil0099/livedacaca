<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>App xompleto</title>

<style>
body {
  font-family: Arial;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 20px;
  background: #f3f4f6;
}

/* BOTÃO */
.container {
  display: flex;
  align-items: center;
  gap: 15px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

.switch { position: relative; width: 60px; height: 34px; }
.switch input { opacity: 0; }

.slider {
  position: absolute;
  inset: 0;
  background: #ccc;
  border-radius: 34px;
  cursor: pointer;
}

.slider:before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  left: 4px;
  top: 4px;
  background: white;
  border-radius: 50%;
  transition: .3s;
}

input:checked + .slider { background: #22c55e; }
input:checked + .slider:before { transform: translateX(26px); }

.bola { width: 20px; height: 20px; border-radius: 50%; background: gray; }
.bola.on { background: #22c55e; }

/* CHAT */
.chat, .game {
  width: 300px;
  background: white;
  padding: 15px;
  border-radius: 15px;
}

.messages {
  height: 150px;
  overflow-y: auto;
  border: 1px solid #ddd;
  padding: 10px;
}

.input-area { display: flex; gap: 5px; margin-top: 10px; }

/* JOGO */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-top: 10px;
}

.cell {
  width: 80px;
  height: 80px;
  background: #eee;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- BOTÃO -->
<div class="container">
  <label class="switch">
    <input id="toggle" type="checkbox">
    <span class="slider"></span>
  </label>
  <div id="bola" class="bola"></div>
</div>

<!-- CHAT -->
<div class="chat">
  <div id="messages" class="messages"></div>
  <div class="input-area">
    <input id="msgInput" type="text">
    <button id="sendBtn">Enviar</button>
  </div>
</div>

<!-- JOGO -->
<div class="game">
  <div id="grid" class="grid"></div>
  <button id="reset">Reiniciar</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, getDoc, collection, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcSfnaRwXZPJ2Z6MUoednrqZug2YJwzEc",
  authDomain: "testbotao.firebaseapp.com",
  projectId: "testbotao"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

//
// 🔘 BOTÃO
//
const toggle = document.getElementById("toggle");
const bola = document.getElementById("bola");
const toggleRef = doc(db, "toggle", "estado");

onSnapshot(toggleRef, (snap) => {
  if (snap.exists()) {
    const v = snap.data().ativo;
    toggle.checked = v;
    bola.classList.toggle("on", v);
  }
});

toggle.addEventListener("change", async () => {
  await setDoc(toggleRef, { ativo: toggle.checked });
});

//
// 💬 CHAT
//
const chatRef = collection(db, "chat");
const messagesDiv = document.getElementById("messages");

onSnapshot(query(chatRef, orderBy("time")), (snap) => {
  messagesDiv.innerHTML = "";
  snap.forEach(doc => {
    const div = document.createElement("div");
    div.textContent = doc.data().text;
    messagesDiv.appendChild(div);
  });
});

document.getElementById("sendBtn").onclick = async () => {
  const input = document.getElementById("msgInput");
  if (!input.value.trim()) return;

  await addDoc(chatRef, {
    text: input.value,
    time: Date.now()
  });

  input.value = "";
};

//
// 🎮 JOGO DA VELHA (FINAL CORRIGIDO)
//
const gameRef = doc(db, "game", "velha");
const grid = document.getElementById("grid");

// criar células
for (let i = 0; i < 9; i++) {
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.index = i;
  grid.appendChild(cell);
}

// garantir que existe
async function initGame() {
  const snap = await getDoc(gameRef);

  if (!snap.exists()) {
    await setDoc(gameRef, {
      board: Array(9).fill(""),
      turn: "X"
    });
  }
}

await initGame();

// clique
grid.addEventListener("click", async (e) => {
  const cell = e.target;
  if (!cell.classList.contains("cell")) return;

  const i = cell.dataset.index;

  const snap = await getDoc(gameRef);
  const data = snap.data();

  if (!data) return;
  if (data.board[i]) return;

  data.board[i] = data.turn;
  data.turn = data.turn === "X" ? "O" : "X";

  await setDoc(gameRef, data);
});

// tempo real
onSnapshot(gameRef, (snap) => {
  const data = snap.data();
  if (!data) return;

  document.querySelectorAll(".cell").forEach((c, i) => {
    c.textContent = data.board[i] || "";
  });
});

// reset
document.getElementById("reset").onclick = async () => {
  await setDoc(gameRef, {
    board: Array(9).fill(""),
    turn: "X"
  });
};
</script>

</body>
</html>
