    ];
    gameState.roomPlaylist = [...DEFAULT_PLAYLIST];
    gameState.robotPlaylist = [...DEFAULT_PLAYLIST];

    let lobbyRoomUnsubs = [];
    let activeRoomUnsubs = [];
    const OFFLINE_THEME_KEY = "cartas_theme_offline";
    const ROOM_THEME_KEY = "cartas_theme_room";
    const THEME_KEY = "cartas_theme_selected";

    function getThemeStorageKey(){
      return gameState.roomMode ? ROOM_THEME_KEY : OFFLINE_THEME_KEY;
    }

    function applyTheme(themeId){
      const theme = THEME_OPTIONS.find(t => t.id === themeId) || THEME_OPTIONS[0];
      document.body.style.setProperty("--bg1", theme.bg1);
      document.body.style.setProperty("--bg2", theme.bg2);
      document.body.style.setProperty("--board-glow", theme.glow1);
      document.body.style.setProperty("--board-glow-2", theme.glow2);
      localStorage.setItem(getThemeStorageKey(), theme.id);
      localStorage.setItem(THEME_KEY, theme.id);
      renderThemeDots();
    }

    function renderThemeDots(){
      const container = document.getElementById("themeDots");
      if(!container) return;
      const saved = localStorage.getItem(getThemeStorageKey()) || localStorage.getItem(THEME_KEY) || THEME_OPTIONS[0].id;
      container.innerHTML = THEME_OPTIONS.map(theme => {
        const active = theme.id === saved ? "active" : "";
        return `<button type="button" class="theme-dot ${active}" title="${theme.label}" aria-label="${theme.label}" onclick="applyTheme('${theme.id}')" style="background:${theme.bg1}"></button>`;
      }).join("");
    }

    function loadTheme(){
      const saved = localStorage.getItem(getThemeStorageKey()) || localStorage.getItem(THEME_KEY) || THEME_OPTIONS[0].id;
      applyTheme(saved);
    }

    function refreshThemeForMode(){
      const saved = localStorage.getItem(getThemeStorageKey()) || localStorage.getItem(THEME_KEY) || THEME_OPTIONS[0].id;
      applyTheme(saved);
    }

    function shuffle(array){
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createCard(){
      const r = Math.random();
      let value = Math.floor(Math.random() * 10).toString();
      if(r < 0.12) value = "+2";
      else if(r < 0.18) value = "+4";
      return {
        color: colors[Math.floor(Math.random() * colors.length)],
        value,
        img: imgs[Math.floor(Math.random() * imgs.length)]
      };
    }

    function createFreshDeck(){
      const deck = [];
      for(let i = 0; i < 100; i++) deck.push(createCard());
      return shuffle(deck);
    }

    function emptyRoomSlots(){
      return { 1: null, 2: null, 3: null, 4: null };
    }

    function emptyRoomHands(){
      return { 1: [], 2: [], 3: [], 4: [] };
    }

    function createFreshRoomState(){
      const deck = createFreshDeck();
      const hands = emptyRoomHands();
      for(let slot = 1; slot <= 4; slot++){
        for(let i = 0; i < 7; i++) hands[slot].push(deck.pop());
      }
      return {
        slots: emptyRoomSlots(),
        hands,
        deck,
        topCard: deck.pop(),
        turn: 1,
        penalty: 0,
        gameRunning: true,
        seatingOpen: true,
        winnerSlot: null,
        startedAt: Date.now(),
        updatedAt: Date.now()
      };
    }

    function normalizeSharedState(raw){
      const state = raw && typeof raw === 'object' ? JSON.parse(JSON.stringify(raw)) : {};
      const slots = emptyRoomSlots();
      const hands = emptyRoomHands();

      if(state.slots && typeof state.slots === 'object'){
        for(let slot = 1; slot <= 4; slot++) slots[slot] = state.slots[slot] ?? null;
      }
      if(Array.isArray(state.players)){
        for(let slot = 1; slot <= 4; slot++) slots[slot] = state.players[slot - 1] ?? slots[slot];
      }
      if(state.hands && typeof state.hands === 'object'){
        for(let slot = 1; slot <= 4; slot++){
          if(Array.isArray(state.hands[slot])) hands[slot] = state.hands[slot].slice();
        }
      }
      if(Array.isArray(state.playersHands)){
        for(let slot = 1; slot <= 4; slot++){
          if(Array.isArray(state.playersHands[slot - 1])) hands[slot] = state.playersHands[slot - 1].slice();
        }
      }

      return {
        slots,
        hands,
        deck: Array.isArray(state.deck) ? state.deck.slice() : [],
        topCard: state.topCard || null,
        turn: Number.isFinite(state.turn) ? state.turn : 1,
        penalty: Number.isFinite(state.penalty) ? state.penalty : 0,
        gameRunning: state.gameRunning !== undefined ? !!state.gameRunning : false,
        seatingOpen: state.seatingOpen !== undefined ? !!state.seatingOpen : true,
        winnerSlot: Number.isFinite(state.winnerSlot) ? state.winnerSlot : null,
        startedAt: state.startedAt || null,
        updatedAt: state.updatedAt || null
      };
    }

    function slotIsActive(slotData){
      if(!slotData || !slotData.id) return false;
      if(!slotData.lastSeen) return true;
      return (Date.now() - slotData.lastSeen) < STALE_SLOT_MS;
    }

    function cleanupStaleSlots(state){
      for(let slot = 1; slot <= 4; slot++){
        if(state.slots[slot] && !slotIsActive(state.slots[slot])){
          state.slots[slot] = null;
        }
      }
      return state;
    }

    function firstOccupiedSlot(state){
      for(let slot = 1; slot <= 4; slot++) if(state.slots[slot]) return slot;
      return null;
    }

    function nextOccupiedSlot(state, fromSlot){
      for(let step = 1; step <= 4; step++){
        const slot = ((fromSlot - 1 + step) % 4) + 1;
        if(state.slots[slot]) return slot;
      }
      return fromSlot;
    }

    function normalizeTurn(state){
      const current = state.turn || 1;
      if(state.slots[current]) return current;
      const next = nextOccupiedSlot(state, current);
      return next || current;
    }

    function getFirstVacantSlot(state){
      for(let slot = 1; slot <= 4; slot++){
        if(!state.slots[slot]) return slot;
      }
      return null;
    }

    function anyVacantSlot(state){
      return getFirstVacantSlot(state) !== null;
    }

    function drawFromDeckShared(state){
      if(!state.deck || state.deck.length === 0){
        state.deck = createFreshDeck();
      }
      return state.deck.pop();
    }

    function ensureOccupiedHandsHaveSeven(state){
      for(let slot = 1; slot <= 4; slot++){
        if(state.slots[slot]){
          if(!Array.isArray(state.hands[slot])) state.hands[slot] = [];
          while(state.hands[slot].length < 7){
            state.hands[slot].push(drawFromDeckShared(state));
          }
        }
      }
      return state;
    }

    function canPlay(c, topCard){
      if(!topCard) return true;
      if(c.value === "+4") return true;
      if(c.value === "+2") return c.color === topCard.color || topCard.value === "+2";
      return c.color === topCard.color || c.value === topCard.value;
    }

    function getPlayerName(slot){
      if(gameState.roomMode && gameState.roomState && gameState.roomState.slots[slot] && gameState.roomState.slots[slot].name){
        return gameState.roomState.slots[slot].name;
      }
      if(!gameState.roomMode && slot === 1) return gameState.myName;
      return `Jogador ${slot}`;
    }

    function renderLobbyRooms(){
      const container = document.getElementById("roomsList");
      if(!container) return;
      container.innerHTML = "";
      ROOMS.forEach(room => {
        const roomState = room.state ? normalizeSharedState(room.state) : null;
        const occupied = roomState ? Object.values(roomState.slots).filter(Boolean).length : 0;
        const isFull = occupied >= 4;
        const statusText = roomState ? (roomState.gameRunning ? "Partida ativa" : "Sala pronta") : "Aguardando primeiro jogador";
        const joinLabel = roomState && roomState.seatingOpen === false ? "Assistir" : "Entrar";
        const div = document.createElement("div");
        div.className = "room-card";
        div.innerHTML = `
          <div class="room-head">
            <strong>${escapeHtml(room.name)}</strong>
            <span class="room-tag">${occupied}/4</span>
          </div>
          <small>${escapeHtml(statusText)}</small>
          <div class="room-actions">
            <button class="btn secondary" onclick="joinRoom('${room.id}')">${joinLabel}</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function stopRoomSubscriptions(){
      activeRoomUnsubs.forEach(fn => { try { fn(); } catch(e) {} });
      activeRoomUnsubs = [];
    }

    function stopLobbySubscriptions(){
      lobbyRoomUnsubs.forEach(fn => { try { fn(); } catch(e) {} });
      lobbyRoomUnsubs = [];
    }

    function stopRoomHeartbeat(){
      if(gameState.roomHeartbeat){
        clearInterval(gameState.roomHeartbeat);
        gameState.roomHeartbeat = null;
      }
    }

    function closeRoomSession(){
      stopRoomHeartbeat();
      stopRoomSubscriptions();
      gameState.roomState = null;
      gameState.roomId = null;
      gameState.mySlot = null;
    }

    function getOccupiedSlotsCount(state){
      return Object.values(state?.slots || {}).filter(Boolean).length;
    }

    function isRoomEmpty(state){
      return getOccupiedSlotsCount(state) === 0;
    }

    async function deleteRoomChatMessages(roomId){
      try {
        const snap = await db.collection('chat').where('roomId', '==', roomId).get();
        if(snap.empty) return;
        const batch = db.batch();
        snap.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
      } catch(err){
        console.warn("Não foi possível limpar o chat da sala:", err);
      }
    }

    async function resetEmptyRoom(roomId){
      try {
        await db.collection('rooms').doc(roomId).delete();
      } catch(err){
        console.warn("Não foi possível apagar a sala vazia:", err);
      }
      await deleteRoomChatMessages(roomId);
    }

    async function ensureRoomDoc(roomId){
      const ref = db.collection('rooms').doc(roomId);
      const snap = await ref.get();
      if(!snap.exists){
        await ref.set({
          roomId,
          roomName: ROOMS.find(r => r.id === roomId)?.name || roomId,
          state: createFreshRoomState(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    async function joinRoom(roomId){
      let userName = document.getElementById("roomName").value.trim();
      if(!userName) userName = document.getElementById("playerName").value.trim();
      if(!userName) userName = "Jogador";
      userName = userName.slice(0, 18);

      gameState.myName = userName;
      gameState.roomMode = true;
      gameState.roomId = roomId;
      gameState.mySlot = null;

      showGame();
      applyModeUI();
      refreshThemeForMode();
      renderGame();

      try {
        await ensureRoomDoc(roomId);
        const roomRef = db.collection('rooms').doc(roomId);
        const joined = await db.runTransaction(async (tx) => {
          const snap = await tx.get(roomRef);
          if(!snap.exists) throw new Error("Sala não encontrada");
          const data = snap.data() || {};
          let state = normalizeSharedState(data.state);
          state = cleanupStaleSlots(state);
          const wasEmpty = isRoomEmpty(state);

          if(wasEmpty){
            state = createFreshRoomState();
          }

          let existingSlot = null;
          for(let slot = 1; slot <= 4; slot++){
            const s = state.slots[slot];
            if(s && s.id === gameState.myId){
              existingSlot = slot;
              break;
            }
          }

          let chosenSlot = existingSlot;
          if(chosenSlot === null && state.seatingOpen !== false){
            chosenSlot = getFirstVacantSlot(state);
          }
          if(chosenSlot !== null){
            state.slots[chosenSlot] = {
              id: gameState.myId,
              name: userName,
              joinedAt: Date.now(),
              lastSeen: Date.now()
            };
          }

          const occupiedAfterJoin = getOccupiedSlotsCount(state);
          if(occupiedAfterJoin >= 4){
            state.seatingOpen = false;
          }

          state.turn = normalizeTurn(state);
          state.gameRunning = state.gameRunning !== undefined ? !!state.gameRunning : true;
          if(!state.topCard && chosenSlot !== null && !wasEmpty){
            state = createFreshRoomState();
            state.slots[chosenSlot] = {
              id: gameState.myId,
              name: userName,
              joinedAt: Date.now(),
              lastSeen: Date.now()
            };
          }

          state = ensureOccupiedHandsHaveSeven(state);

          tx.set(roomRef, {
            roomId,
            roomName: ROOMS.find(r => r.id === roomId)?.name || roomId,
            state,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          return { slot: chosenSlot, wasEmpty };
        });

        gameState.mySlot = joined.slot;
        subscribeRoom(roomId);
        startRoomHeartbeat();
        if(joined.wasEmpty) await deleteRoomChatMessages(roomId);
        initRoomChat(roomId);
        renderGame();
      } catch(err){
        console.error(err);
        alert(err.message || "Não foi possível entrar na sala.");
        backToLobby();
      }
    }

    function subscribeRoom(roomId){
      stopRoomSubscriptions();
      const roomRef = db.collection('rooms').doc(roomId);
      const unsub = roomRef.onSnapshot(snapshot => {
        if(!snapshot.exists) return;
        const data = snapshot.data() || {};
        const state = cleanupStaleSlots(normalizeSharedState(data.state));
        gameState.roomState = state;
        const needsRefill = Object.keys(state.slots).some(slot => state.slots[slot] && (!Array.isArray(state.hands[slot]) || state.hands[slot].length < 7));
        if(needsRefill){
          db.runTransaction(async (tx) => {
            const freshSnap = await tx.get(roomRef);
            if(!freshSnap.exists) return;
            const freshData = freshSnap.data() || {};
            let freshState = cleanupStaleSlots(normalizeSharedState(freshData.state));
            freshState = ensureOccupiedHandsHaveSeven(freshState);
            tx.update(roomRef, {
              state: freshState,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }).catch(() => {});
        }
        if(gameState.myId){
          for(let slot = 1; slot <= 4; slot++){
            if(state.slots[slot] && state.slots[slot].id === gameState.myId){
              gameState.mySlot = slot;
            }
          }
        }
        renderGame();
      }, err => {
        console.error("Erro ao ouvir sala:", err);
      });
      activeRoomUnsubs.push(unsub);
    }

    function startRoomHeartbeat(){
      stopRoomHeartbeat();
      gameState.roomHeartbeat = setInterval(() => {
        if(!gameState.roomMode || !gameState.roomId || !gameState.mySlot) return;
        const pathBase = `state.slots.${gameState.mySlot}`;
        db.collection('rooms').doc(gameState.roomId).update({
          [`${pathBase}.id`]: gameState.myId,
          [`${pathBase}.name`]: gameState.myName,
          [`${pathBase}.lastSeen`]: Date.now()
        }).catch(() => {});
      }, 7000);
    }

    async function leaveCurrentRoom(){
      if(!gameState.roomMode || !gameState.roomId || !gameState.mySlot) return;
      const roomId = gameState.roomId;
      const mySlot = gameState.mySlot;
      const myId = gameState.myId;
      const roomRef = db.collection('rooms').doc(roomId);
      stopRoomHeartbeat();
      let shouldReset = false;
      try {
        await db.runTransaction(async (tx) => {
          const snap = await tx.get(roomRef);
          if(!snap.exists) return;
          const data = snap.data() || {};
          let state = cleanupStaleSlots(normalizeSharedState(data.state));
          if(state.slots[mySlot] && state.slots[mySlot].id === myId){
            state.slots[mySlot] = null;
            if(state.turn === mySlot) state.turn = normalizeTurn(state);
            shouldReset = isRoomEmpty(state);
            if(shouldReset){
              tx.delete(roomRef);
            } else {
              tx.update(roomRef, {
                state,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            }
          }
        });
        if(shouldReset) await deleteRoomChatMessages(roomId);
      } catch(e) {
        console.warn("Não foi possível liberar a sala imediatamente:", e);
      }
      stopRoomSubscriptions();
    }

    async function leaveSeat(){
      if(!gameState.roomMode || !gameState.roomId || !gameState.mySlot) return;
      const roomId = gameState.roomId;
      const mySlot = gameState.mySlot;
      const myId = gameState.myId;
      const roomRef = db.collection('rooms').doc(roomId);
      stopRoomHeartbeat();
      let shouldReset = false;
      try {
        await db.runTransaction(async (tx) => {
          const snap = await tx.get(roomRef);
          if(!snap.exists) throw new Error("Sala não encontrada");
          const data = snap.data() || {};
          let state = cleanupStaleSlots(normalizeSharedState(data.state));
          if(state.slots[mySlot] && state.slots[mySlot].id === myId){
            state.slots[mySlot] = null;
            if(state.turn === mySlot) state.turn = normalizeTurn(state);
            shouldReset = isRoomEmpty(state);
            if(shouldReset){
              tx.delete(roomRef);
            } else {
              tx.update(roomRef, {
                state,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            }
          }
        });
        if(shouldReset) await deleteRoomChatMessages(roomId);
        gameState.mySlot = null;
        renderGame();
      } catch(e) {
        console.warn("Não foi possível sair da mesa:", e);
        alert(e.message || "Não foi possível sair da mesa.");
      }
    }

    async function takeSeat(){
      if(!gameState.roomMode || !gameState.roomId || gameState.mySlot) return;
      const roomId = gameState.roomId;
      const roomRef = db.collection('rooms').doc(roomId);
      try {
        const result = await db.runTransaction(async (tx) => {
          const snap = await tx.get(roomRef);
          if(!snap.exists) throw new Error("Sala não encontrada");
          const data = snap.data() || {};
          let state = cleanupStaleSlots(normalizeSharedState(data.state));
          const wasEmpty = isRoomEmpty(state);
          if(wasEmpty){
            state = createFreshRoomState();
          }

          let existingSlot = null;
          for(let slot = 1; slot <= 4; slot++){
            const s = state.slots[slot];
            if(s && s.id === gameState.myId){
              existingSlot = slot;
              break;
            }
          }

          let chosenSlot = existingSlot ?? getFirstVacantSlot(state);
          if(chosenSlot === null) throw new Error("Não há lugar vazio na mesa");

          state.slots[chosenSlot] = {
            id: gameState.myId,
            name: gameState.myName,
            joinedAt: Date.now(),
            lastSeen: Date.now()
          };
          if(getOccupiedSlotsCount(state) >= 4){
            state.seatingOpen = false;
          }
          state = ensureOccupiedHandsHaveSeven(state);
          state.turn = normalizeTurn(state);
          tx.set(roomRef, {
            roomId,
            roomName: ROOMS.find(r => r.id === roomId)?.name || roomId,
            state,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
          return { chosenSlot, wasEmpty };
        });
        gameState.mySlot = result.chosenSlot;
        startRoomHeartbeat();
        if(result.wasEmpty) await deleteRoomChatMessages(roomId);
        renderGame();
      } catch(e) {
        console.warn("Não foi possível subir para a mesa:", e);
        alert(e.message || "Não foi possível subir para a mesa.");
      }
    }

    function joinRobots(){
      let userName = document.getElementById("playerName").value.trim();
      if(!userName) userName = "Você";
      gameState.myName = userName.slice(0,18);
      gameState.roomMode = false;
      closeRoomSession();
      showGame();
      initGame();
      initOfflineChat();
      applyModeUI();
      refreshThemeForMode();
    }

    function applyModeUI(){
      const music = document.getElementById("musicPlayer");
      const voice = document.getElementById("voiceGroup");
      const theme = document.getElementById("themeSwitch");

      if(music) music.style.display = "";
      if(voice) voice.style.display = "";
      if(theme) theme.style.display = "";
    }

    function showGame(){
      document.getElementById("lobbyScreen").style.display = "none";
      document.getElementById("endScreen").style.display = "none";
      document.getElementById("table").style.display = "block";
      document.getElementById("chatPanel").style.display = "flex";
    }

    async function backToLobby(){
      clearTimeout(gameState.botTimer);
      await leaveCurrentRoom();
      gameState.roomMode = false;
      document.getElementById("table").style.display = "none";
      document.getElementById("endScreen").style.display = "none";
      document.getElementById("lobbyScreen").style.display = "flex";
      document.getElementById("chatPanel").style.display = "none";
      closeRoomSession();
      refreshThemeForMode();
      renderLobbyRooms();
      bootstrapLobbyRooms();
      renderThemeDots();
    }

    function initGame(){
      clearTimeout(gameState.botTimer);
      gameState.deck = [];
      gameState.players = [[],[],[],[]];
      gameState.penalty = 0;
      gameState.turn = 0;
      gameState.gameRunning = true;
      for(let i = 0; i < 100; i++) gameState.deck.push(createCard());
      for(let p = 0; p < 4; p++) for(let i = 0; i < 7; i++) gameState.players[p].push(drawFromDeckOffline());
      gameState.topCard = drawFromDeckOffline();
      renderGame();
      scheduleBotTurn();
    }

    function drawFromDeckOffline(){
      if(gameState.deck.length === 0) for(let i = 0; i < 60; i++) gameState.deck.push(createCard());
      return gameState.deck.pop();
    }

    function drawFromDeck(){
      return gameState.roomMode ? null : drawFromDeckOffline();
    }

    function canPlayOffline(c){
      if(!gameState.topCard) return true;
      if(c.value === "+4") return true;
      if(c.value === "+2") return c.color === gameState.topCard.color || gameState.topCard.value === "+2";
      return c.color === gameState.topCard.color || c.value === gameState.topCard.value;
    }

    function playCard(i){
      if(gameState.roomMode) return playRoomCard(i);
      if(!gameState.gameRunning || gameState.turn !== 0 || gameState.penalty > 0) return;
      const c = gameState.players[0][i];
      if(!canPlayOffline(c)) return;
      applyCardOffline(c);
      gameState.players[0].splice(i, 1);
      renderGame();
      nextTurnOffline();
    }

    function playRoomCard(i){
      if(!gameState.roomMode || !gameState.roomId || !gameState.mySlot) return;
      performRoomAction({ type: 'play', index: i });
    }

    function applyCardOffline(c){
      gameState.topCard = c;
      if(c.value === "+2") gameState.penalty += 2;
      if(c.value === "+4") gameState.penalty += 4;
    }

    function drawCard(){
      if(gameState.roomMode) return drawRoomCard();
      if(!gameState.gameRunning || gameState.turn !== 0 || gameState.penalty > 0) return;
      gameState.players[0].push(drawFromDeckOffline());
      renderGame();
      nextTurnOffline();
    }

    function drawRoomCard(){
      if(!gameState.roomMode || !gameState.roomId || !gameState.mySlot) return;
      performRoomAction({ type: 'draw' });
    }

    function nextTurnOffline(){
      if(checkWinOffline()) return;
      gameState.turn = (gameState.turn + 1) % 4;
      renderGame();
      clearTimeout(gameState.botTimer);
      gameState.botTimer = setTimeout(resolveTurnOffline, 220);
    }

    function resolveTurnOffline(){
      if(!gameState.gameRunning) return;
      if(gameState.penalty > 0){
        for(let i = 0; i < gameState.penalty; i++) gameState.players[gameState.turn].push(drawFromDeckOffline());
        gameState.penalty = 0;
        renderGame();
        nextTurnOffline();
        return;
      }
      if(!gameState.roomMode && gameState.turn !== 0) botTurn();
    }

    function botTurn(){
      clearTimeout(gameState.botTimer);
      gameState.botTimer = setTimeout(() => {
        if(!gameState.gameRunning || gameState.turn === 0) return;
        const hand = gameState.players[gameState.turn];
        const idx = hand.findIndex(c => canPlayOffline(c));
        if(idx !== -1){
          applyCardOffline(hand[idx]);
          hand.splice(idx, 1);
        } else {
          hand.push(drawFromDeckOffline());
        }
        renderGame();
        nextTurnOffline();
      }, 1200 + Math.random() * 800);
    }

    function scheduleBotTurn(){
      clearTimeout(gameState.botTimer);
      gameState.botTimer = setTimeout(resolveTurnOffline, 160);
    }

    function checkWinOffline(){
      for(let i = 0; i < 4; i++){
        if(gameState.players[i].length === 0){
          gameState.gameRunning = false;
          document.getElementById("table").style.display = "none";
          document.getElementById("endScreen").style.display = "flex";
          document.getElementById("winnerText").innerHTML = i === 0 ? "Você venceu!" : `${getPlayerName(i + 1)} venceu!`;
          return true;
        }
      }
      return false;
    }

    function performRoomAction(action){
      if(!gameState.roomMode || !gameState.roomId || !gameState.mySlot) return;
      const roomRef = db.collection('rooms').doc(gameState.roomId);
      db.runTransaction(async (tx) => {
        const snap = await tx.get(roomRef);
        if(!snap.exists) throw new Error("Sala não encontrada");
        const data = snap.data() || {};
        let state = cleanupStaleSlots(normalizeSharedState(data.state));

        if(!state.slots[gameState.mySlot] || state.slots[gameState.mySlot].id !== gameState.myId){
          throw new Error("Você não está mais nessa sala");
        }

        state.turn = normalizeTurn(state);
        if(state.turn !== gameState.mySlot) throw new Error("Não é sua vez");
        if(!state.gameRunning) throw new Error("A partida já terminou");

        const hand = state.hands[gameState.mySlot] || (state.hands[gameState.mySlot] = []);

        if(action.type === 'draw'){
          if(state.penalty > 0){
            for(let i = 0; i < state.penalty; i++) hand.push(drawFromDeckShared(state));
            state.penalty = 0;
          } else {
            hand.push(drawFromDeckShared(state));
          }
          state.turn = nextOccupiedSlot(state, gameState.mySlot);
        }

        if(action.type === 'play'){
          const card = hand[action.index];
          if(!card) throw new Error("Carta inválida");
          if(!canPlay(card, state.topCard)) throw new Error("Essa carta não pode ser jogada agora");
          state.topCard = card;
          hand.splice(action.index, 1);
          if(card.value === "+2") state.penalty += 2;
          if(card.value === "+4") state.penalty += 4;
          if(hand.length === 0){
            state.gameRunning = false;
            state.winnerSlot = gameState.mySlot;
          } else {
            state.turn = nextOccupiedSlot(state, gameState.mySlot);
          }
        }

        state.updatedAt = Date.now();
        tx.update(roomRef, {
          state,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }).catch(err => {
        console.error(err);
        alert(err.message || "Não foi possível atualizar a sala.");
      });
    }

    function checkWinRoom(state){
      if(!state) return false;
      if(state.gameRunning) return false;
      return state.winnerSlot !== null;
    }

    function updateSeatControls(state){
      const downBtn = document.getElementById("seatDownBtn");
      const upBtn = document.getElementById("seatUpBtn");
      if(!downBtn || !upBtn) return;

      if(!gameState.roomMode || !state){
        downBtn.style.display = "none";
        upBtn.style.display = "none";
        return;
      }

      const hasVacancy = anyVacantSlot(state);
      const seated = !!gameState.mySlot;

      downBtn.style.display = seated ? "" : "none";
      upBtn.style.display = !seated && hasVacancy ? "" : "none";
    }

    function renderGame(){
      if(gameState.roomMode){
        const state = gameState.roomState;
        if(!state){
          document.getElementById("statusNote").textContent = "Entrando na sala...";
          updateSeatControls(null);
          return;
        }

        if(checkWinRoom(state)){
          document.getElementById("table").style.display = "none";
          document.getElementById("endScreen").style.display = "flex";
          document.getElementById("winnerText").innerHTML = `${getPlayerName(state.winnerSlot)} venceu!`;
          return;
        }

        document.getElementById("table").style.display = "block";
        document.getElementById("endScreen").style.display = "none";

        updateSeatControls(state);
        const currentTurn = normalizeTurn(state);
        const turnName = getPlayerName(currentTurn);
        const hudTurn = document.getElementById("hudTurn");
        hudTurn.querySelector('span:last-child').textContent = currentTurn === gameState.mySlot ? "Sua vez" : `Vez de ${turnName}`;

        document.getElementById("discardPile").innerHTML = state.topCard ? `<div class="card" data-value="${state.topCard.value}" style="background-image:url('${state.topCard.img}'); border-color:${colorMap[state.topCard.color]}"></div>` : '';
        document.getElementById("statusNote").textContent = state.penalty > 0 ? `Punição ativa: compre ${state.penalty} carta(s)` : "Escolha uma carta da sua mão ou compre";

        const displayOrder = [];
        const usedSlots = new Set();
        const pushSlot = (slot) => {
          if(!slot || usedSlots.has(slot) || !state.slots[slot]) return;
          usedSlots.add(slot);
          displayOrder.push(slot);
        };
        if(gameState.mySlot){
          pushSlot(gameState.mySlot);
          for(let step = 1; step <= 4; step++){
            const slot = ((gameState.mySlot - 1 + step) % 4) + 1;
            pushSlot(slot);
          }
        } else {
          for(let slot = 1; slot <= 4; slot++) pushSlot(slot);
        }

        const displayIds = ["p1", "p2", "p4", "p3"]; // baixo, direita, topo, esquerda
        displayIds.forEach((id, idx) => {
          const h = document.getElementById(id);
          if(!h) return;
          const actualSlot = displayOrder[idx];
          const info = h.querySelector('.info');
          const cardsEl = h.querySelector('.cards');

          if(!actualSlot){
            info.innerHTML = '';
            cardsEl.innerHTML = '';
            return;
          }

          const slotName = getPlayerName(actualSlot);
          const hand = state.hands[actualSlot] || [];
          info.innerHTML = `<span>${escapeHtml(slotName)}${gameState.mySlot === actualSlot ? ' (você)' : ''}</span><small>${hand.length}</small>`;

          if(gameState.mySlot === actualSlot){
            cardsEl.innerHTML = hand.map((c, i) => `<div class="card ${canPlay(c, state.topCard) ? 'playable' : ''}" data-value="${c.value}" style="background-image:url('${c.img}'); border-color:${colorMap[c.color]}" onclick="playCard(${i})"></div>`).join('');
          } else {
            cardsEl.innerHTML = Array(hand.length).fill('<div class="card back"></div>').join('');
          }
        });
        return;
      }

      if(!gameState.gameRunning) return;
      document.getElementById("discardPile").innerHTML = gameState.topCard ? `<div class="card" data-value="${gameState.topCard.value}" style="background-image:url('${gameState.topCard.img}'); border-color:${colorMap[gameState.topCard.color]}"></div>` : '';
      document.getElementById("hudTurn").querySelector('span:last-child').textContent = gameState.turn === 0 ? "Sua vez" : `Vez de ${getPlayerName(gameState.turn + 1)}`;
      const p1 = document.getElementById("p1");
      p1.querySelector('.info').innerHTML = `<span>${getPlayerName(1)}</span><small>${gameState.players[0].length}</small>`;
      p1.querySelector('.cards').innerHTML = gameState.players[0].map((c, i) => `<div class="card ${canPlayOffline(c) ? 'playable' : ''}" data-value="${c.value}" style="background-image:url('${c.img}'); border-color:${colorMap[c.color]}" onclick="playCard(${i})"></div>`).join('');
      for(let i = 1; i <= 3; i++){
        const h = document.getElementById(`p${i + 1}`);
        h.querySelector('.info').innerHTML = `<span>${getPlayerName(i + 1)}</span><small>${gameState.players[i].length}</small>`;
        h.querySelector('.cards').innerHTML = Array(gameState.players[i].length).fill('<div class="card back"></div>').join('');
      }
      document.getElementById("statusNote").textContent = gameState.penalty > 0 ? `Punição ativa: compre ${gameState.penalty} carta(s)` : "Escolha uma carta da sua mão ou compre";
    }

    // ========== MÚSICA E ÁUDIO ==========
    function setupMusic(){
      if(!gameState.musicAudio){
        gameState.musicAudio = new Audio();
        gameState.musicAudio.loop = false;
        gameState.musicAudio.addEventListener("ended", () => nextTrack(true));
      }
      const pl = gameState.roomMode ? gameState.roomPlaylist : gameState.robotPlaylist;
      if(pl.length) gameState.musicAudio.src = pl[gameState.trackIndex % pl.length];
      gameState.musicAudio.volume = gameState.musicVolume * gameState.masterVolume;
      document.getElementById("musicDisc").classList.remove("playing");
    }
    function playMusic(){ if(!gameState.musicAudio) setupMusic(); if(gameState.musicAudio && gameState.musicAudio.src){ gameState.musicPlaying = true; document.getElementById("musicDisc").classList.add("playing"); gameState.musicAudio.play().catch(()=>{}); } }
    function pauseMusic(){ if(gameState.musicAudio){ gameState.musicPlaying = false; gameState.musicAudio.pause(); document.getElementById("musicDisc").classList.remove("playing"); } }
    function toggleMusic(){ gameState.musicPlaying ? pauseMusic() : playMusic(); }
    function nextTrack(auto=false){ const pl = gameState.roomMode ? gameState.roomPlaylist : gameState.robotPlaylist; if(!pl.length) return; gameState.trackIndex = (gameState.trackIndex + 1) % pl.length; setupMusic(); if(gameState.musicPlaying || auto) playMusic(); }
    function prevTrack(){ const pl = gameState.roomMode ? gameState.roomPlaylist : gameState.robotPlaylist; if(!pl.length) return; gameState.trackIndex = (gameState.trackIndex - 1 + pl.length) % pl.length; setupMusic(); if(gameState.musicPlaying) playMusic(); }
    function setMusicVolume(v){ gameState.musicVolume = v / 100; if(gameState.musicAudio) gameState.musicAudio.volume = gameState.musicVolume * gameState.masterVolume; }
    function setMasterVolume(v){ gameState.masterVolume = v / 100; if(gameState.musicAudio) gameState.musicAudio.volume = gameState.musicVolume * gameState.masterVolume; if(gameState.micGain) gameState.micGain.gain.value = gameState.micVolume; }
    function setMicVolume(v){ gameState.micVolume = v / 100; if(gameState.micGain) gameState.micGain.gain.value = gameState.micVolume; }
    async function toggleMic(){
      gameState.micEnabled = !gameState.micEnabled; document.getElementById("micBtn").textContent = gameState.micEnabled ? "Mic: ligado" : "Mic: desligado";
      if(gameState.micEnabled){ try{ gameState.micStream = await navigator.mediaDevices.getUserMedia({audio:true}); gameState.micAudioContext = new (window.AudioContext||window.webkitAudioContext)(); const src = gameState.micAudioContext.createMediaStreamSource(gameState.micStream); gameState.micGain = gameState.micAudioContext.createGain(); const mon = gameState.micAudioContext.createGain(); src.connect(gameState.micGain).connect(mon).connect(gameState.micAudioContext.destination); gameState.micGain.gain.value = gameState.micVolume; mon.gain.value = gameState.audioEnabled ? gameState.masterVolume : 0; }catch(e){ alert("Microfone não disponível"); gameState.micEnabled = false; } } else { if(gameState.micStream) gameState.micStream.getTracks().forEach(t=>t.stop()); if(gameState.micAudioContext) gameState.micAudioContext.close(); gameState.micStream = null; } }
    function toggleAudio(){ gameState.audioEnabled = !gameState.audioEnabled; document.getElementById("audioBtn").textContent = gameState.audioEnabled ? "Áudio: ligado" : "Áudio: desligado"; }

    // ========== CHAT ==========
    function initRoomChat(roomId){
      if(window.chatUnsubscribe) window.chatUnsubscribe();
      const q = db.collection('chat').where('roomId', '==', roomId);
      window.chatUnsubscribe = q.onSnapshot(snapshot => {
        const msgs = [];
        snapshot.forEach(doc => {
          const d = doc.data();
          msgs.push({
            id: doc.id,
            author: d.author || "Anônimo",
            message: d.message || "",
            timestamp: d.timestamp?.toDate?.() || new Date()
          });
        });
        msgs.sort((a,b) => a.timestamp - b.timestamp);
        renderChatMessages(msgs);
      }, err => {
        console.error("Erro no chat:", err);
        document.getElementById("chatMessagesList").innerHTML = `<div style="text-align:center;color:red;">Erro no chat: ${err.message}</div>`;
      });
    }

    function initOfflineChat(){
      if(window.chatUnsubscribe) window.chatUnsubscribe();
      const stored = localStorage.getItem("cartas_offline_chat");
      let msgs = stored ? JSON.parse(stored) : [];
      msgs.sort((a,b) => a.timestamp - b.timestamp);
      renderChatMessages(msgs);
    }

    function saveOfflineMessage(author, message){
      const stored = localStorage.getItem("cartas_offline_chat");
      let msgs = stored ? JSON.parse(stored) : [];
      msgs.push({ id:Date.now().toString(), author, message, timestamp:new Date() });
      if(msgs.length > 50) msgs = msgs.slice(-50);
      localStorage.setItem("cartas_offline_chat", JSON.stringify(msgs));
      msgs.sort((a,b) => a.timestamp - b.timestamp);
      renderChatMessages(msgs);
    }

    async function sendMessage(){
      let msg = document.getElementById("chatMessageInput").value.trim();
      if(!msg) return;
      let author = gameState.myName;
      if(author === "Você" || author === "Jogador" || author === ""){
        alert("Por favor, defina seu nome na lobby antes de enviar mensagem.");
        return;
      }
      if(gameState.roomMode && gameState.roomId){
        try {
          await db.collection('chat').add({
            roomId: gameState.roomId,
            author: author,
            message: msg,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch(e){
          console.error(e);
          alert("Erro ao enviar mensagem: " + e.message);
        }
      } else {
        saveOfflineMessage(author, msg);
      }
      document.getElementById("chatMessageInput").value = "";
    }

    function renderChatMessages(messages){
      const container = document.getElementById("chatMessagesList");
      if(!container) return;
      if(messages.length === 0){ container.innerHTML = '<div style="text-align:center; color:var(--muted);">Nenhuma mensagem ainda.</div>'; return; }
      container.innerHTML = "";
      messages.forEach(msg => {
        const time = new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        const div = document.createElement("div");
        div.className = "chat-message";
        div.innerHTML = `
          <div class="message-header"><span class="message-author">${escapeHtml(msg.author)}</span><span class="message-time">${time}</span></div>
          <div class="message-text">${escapeHtml(msg.message)}</div>
        `;
        container.appendChild(div);
      });
      container.scrollTop = container.scrollHeight;
    }

    function toggleChatPanel(){
      const p = document.getElementById("chatPanel");
      p.classList.toggle("collapsed");
      p.querySelector(".chat-collapse-btn").textContent = p.classList.contains("collapsed") ? "+" : "−";
    }

    function toggleTheme(){ }
    function loadTheme(){
      refreshThemeForMode();
    }
    function escapeHtml(s){ if(!s) return ""; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }

    document.getElementById("sendChatBtn")?.addEventListener("click", sendMessage);
    document.getElementById("chatMessageInput")?.addEventListener("keypress", e => { if(e.key === "Enter") sendMessage(); });

    window.addEventListener('beforeunload', () => {
      stopRoomHeartbeat();
      if(gameState.roomMode) leaveCurrentRoom();
    });

    async function bootstrapLobbyRooms(){
      stopLobbySubscriptions();
      lobbyRoomUnsubs = ROOMS.map(room => db.collection('rooms').doc(room.id).onSnapshot(snapshot => {
        room.state = snapshot.exists ? snapshot.data().state : null;
        renderLobbyRooms();
      }, () => {
        room.state = null;
        renderLobbyRooms();
      }));
    }

    window.onload = async () => {
      loadTheme();
      renderLobbyRooms();
      bootstrapLobbyRooms();
    };
  </script>


<script>
(() => {
  const ADMIN_DEFAULT_PLAYLIST = [
    "https://raw.githubusercontent.com/fil0099/livedacaca/main/music_for_video-just-relax-11157.mp3",
    "https://raw.githubusercontent.com/fil0099/livedacaca/main/sigmamusicart-jazz-lounge-relaxing-background-music-514554.mp3",
    "https://raw.githubusercontent.com/fil0099/livedacaca/main/sonican-lo-fi-music-loop-sentimental-jazzy-love-473154.mp3"
  ];

  const DEFAULT_ROOM_DEFS = [
    { id: "sala1", name: "Sala 1", password: "", autoplay: true, playlist: ADMIN_DEFAULT_PLAYLIST.slice() },
    { id: "sala2", name: "Sala 2", password: "", autoplay: true, playlist: ADMIN_DEFAULT_PLAYLIST.slice() },
    { id: "sala3", name: "Sala 3", password: "", autoplay: true, playlist: ADMIN_DEFAULT_PLAYLIST.slice() }
  ];

  const PERMISSIONS = {
    password: "Trocar senha",
    rooms: "Criar/deletar salas",
    music: "Músicas da sala",
    autoplay: "Autoplay",
    delegate: "Delegar função"
  };

  const SETTINGS_LS_KEY = "cartas_admin_settings_v3";
  const USER_ID_LS_KEY = "cartas_user_id_v3";
  const USER_REGISTRY_LS_KEY = "cartas_user_registry_v3";
  const CHAT_PREFIX_LS_KEY = "cartas_chat_room_v3:";
  const SETTINGS_DOC_REF = db.collection("appMeta").doc("global");

  const adminUI = {
    roomListeners: [],
    settingsListener: null,
    roomCache: {},
    settings: loadSettings(),
    selectedAdminRoomId: DEFAULT_ROOM_DEFS[0].id,
    selectedDelegationId: "",
    selectedPresenceRoomId: "",
    adminMode: "none", // none | password | delegated
    adminPermissions: {},
    currentPasswordAttemptRoomId: null
  };

  function randomId4(){
    return Math.random().toString(16).toUpperCase().padStart(4, "0").slice(-4);
  }

  function getOrCreateUserId(){
    let id = localStorage.getItem(USER_ID_LS_KEY);
    if(!id){
      id = randomId4();
      localStorage.setItem(USER_ID_LS_KEY, id);
    }
    return String(id).toUpperCase().slice(0, 4).padStart(4, "0");
  }

  function ensureCurrentUserId(){
    gameState.myId = getOrCreateUserId();
    if(!Array.isArray(gameState.botIds) || gameState.botIds.length !== 3){
      gameState.botIds = [randomId4(), randomId4(), randomId4()];
    }
    return gameState.myId;
  }

  ensureCurrentUserId();

  function loadSettings(){
    let local = null;
    try{
      local = JSON.parse(localStorage.getItem(SETTINGS_LS_KEY) || "null");
    }catch(e){
      local = null;
    }
    const base = {
      adminPassword: "123",
      rooms: DEFAULT_ROOM_DEFS.map(r => ({ id: r.id, name: r.name })),
      roomMeta: DEFAULT_ROOM_DEFS.reduce((acc, r) => {
        acc[r.id] = { name: r.name, password: r.password, autoplay: r.autoplay, playlist: r.playlist.slice() };
        return acc;
      }, {}),
      delegations: {},
      userRegistry: []
    };
    if(!local) return base;

    const merged = {
      ...base,
      ...local,
      rooms: Array.isArray(local.rooms) && local.rooms.length ? local.rooms.map(r => ({ id: String(r.id || "").trim(), name: String(r.name || "").trim() || String(r.id || "").trim() })).filter(r => r.id) : base.rooms.slice(),
      roomMeta: { ...base.roomMeta, ...(local.roomMeta || {}) },
      delegations: local.delegations && typeof local.delegations === "object" ? local.delegations : {},
      userRegistry: Array.isArray(local.userRegistry) ? local.userRegistry : []
    };
    merged.rooms = merged.rooms.filter((r, idx, arr) => r.id && arr.findIndex(x => x.id === r.id) === idx);
    merged.rooms.forEach(room => {
      if(!merged.roomMeta[room.id]) merged.roomMeta[room.id] = { name: room.name, password: "", autoplay: true, playlist: ADMIN_DEFAULT_PLAYLIST.slice() };
      merged.roomMeta[room.id].name = merged.roomMeta[room.id].name || room.name;
      if(!Array.isArray(merged.roomMeta[room.id].playlist)) merged.roomMeta[room.id].playlist = ADMIN_DEFAULT_PLAYLIST.slice();
      if(typeof merged.roomMeta[room.id].autoplay !== "boolean") merged.roomMeta[room.id].autoplay = true;
      if(typeof merged.roomMeta[room.id].password !== "string") merged.roomMeta[room.id].password = "";
    });
    return merged;
  }

  function saveSettingsLocal(){
    try{
      localStorage.setItem(SETTINGS_LS_KEY, JSON.stringify(adminUI.settings));
    }catch(e){}
  }

  function persistSettingsRemote(){
    try{
      SETTINGS_DOC_REF.set(adminUI.settings, { merge: true }).catch(() => {});
    }catch(e){}
  }

  function mergeRemoteSettings(remote){
    if(!remote || typeof remote !== "object") return;
    const next = loadSettings();
    if(typeof remote.adminPassword === "string") next.adminPassword = remote.adminPassword;
    if(Array.isArray(remote.rooms)) next.rooms = remote.rooms.map(r => ({ id: String(r.id || "").trim(), name: String(r.name || "").trim() || String(r.id || "").trim() })).filter(r => r.id);
    if(remote.roomMeta && typeof remote.roomMeta === "object") next.roomMeta = { ...next.roomMeta, ...remote.roomMeta };
    if(remote.delegations && typeof remote.delegations === "object") next.delegations = remote.delegations;
    if(Array.isArray(remote.userRegistry)) next.userRegistry = remote.userRegistry;
    next.rooms.forEach(room => {
      if(!next.roomMeta[room.id]) next.roomMeta[room.id] = { name: room.name, password: "", autoplay: true, playlist: ADMIN_DEFAULT_PLAYLIST.slice() };
      next.roomMeta[room.id].name = next.roomMeta[room.id].name || room.name;
      if(!Array.isArray(next.roomMeta[room.id].playlist)) next.roomMeta[room.id].playlist = ADMIN_DEFAULT_PLAYLIST.slice();
      if(typeof next.roomMeta[room.id].autoplay !== "boolean") next.roomMeta[room.id].autoplay = true;
      if(typeof next.roomMeta[room.id].password !== "string") next.roomMeta[room.id].password = "";
    });
    adminUI.settings = next;
    saveSettingsLocal();
    renderLobbyRooms();
    renderAdminModal();
    renderPeopleModal();
    refreshCurrentRoomMusic();
  }

  function getRooms(){
    const seen = new Set();
    return (adminUI.settings.rooms || []).map(room => {
      const id = String(room.id || "").trim();
      const meta = adminUI.settings.roomMeta?.[id] || {};
      const normalized = {
        id,
        name: String(meta.name || room.name || id).trim() || id,
        password: String(meta.password || ""),
        autoplay: meta.autoplay !== false,
        playlist: Array.isArray(meta.playlist) ? meta.playlist.slice() : ADMIN_DEFAULT_PLAYLIST.slice()
      };
      if(seen.has(normalized.id)) return null;
      seen.add(normalized.id);
      return normalized;
    }).filter(Boolean);
  }

  function getRoomMeta(roomId){
    const room = getRooms().find(r => r.id === roomId);
    if(room) return room;
    return {
      id: roomId,
      name: roomId,
      password: "",
      autoplay: true,
      playlist: ADMIN_DEFAULT_PLAYLIST.slice()
    };
  }

  function getRoomPassword(roomId){ return getRoomMeta(roomId).password || ""; }
  function getRoomPlaylist(roomId){ return getRoomMeta(roomId).playlist || ADMIN_DEFAULT_PLAYLIST.slice(); }
  function getRoomAutoplay(roomId){ return getRoomMeta(roomId).autoplay !== false; }

  function normalizeText(value){
    return String(value || "").trim().toLowerCase();
  }

  function saveSettings(){
    saveSettingsLocal();
    persistSettingsRemote();
    renderLobbyRooms();
    renderAdminModal();
    renderPeopleModal();
  }

  function setRoomMeta(roomId, patch){
    const id = String(roomId || "").trim();
    if(!id) return;
    adminUI.settings.roomMeta[id] = {
      ...(adminUI.settings.roomMeta[id] || { name: id, password: "", autoplay: true, playlist: ADMIN_DEFAULT_PLAYLIST.slice() }),
      ...patch
    };
    if(!adminUI.settings.rooms.some(r => r.id === id)){
      adminUI.settings.rooms.push({ id, name: adminUI.settings.roomMeta[id].name || id });
    }
    adminUI.settings.rooms = adminUI.settings.rooms.filter((room, idx, arr) => room.id && arr.findIndex(x => x.id === room.id) === idx);
    adminUI.settings.rooms = adminUI.settings.rooms.map(room => room.id === id ? { id, name: adminUI.settings.roomMeta[id].name || room.name || id } : room);
    saveSettings();
  }

  function addUserToRegistry(user){
    if(!user || !user.id) return;
    const id = String(user.id).toUpperCase().slice(0, 4);
    const name = String(user.name || "Jogador").slice(0, 18);
    const roomId = user.roomId ? String(user.roomId) : "";
    const slot = Number.isFinite(user.slot) ? user.slot : null;
    const watching = !!user.watching;
    const current = Array.isArray(adminUI.settings.userRegistry) ? adminUI.settings.userRegistry.slice() : [];
    const idx = current.findIndex(u => String(u.id || "").toUpperCase() === id);
    const payload = {
      id,
      name,
      roomId,
      slot,
      watching,
      lastSeen: Date.now()
    };
    if(idx >= 0) current[idx] = { ...current[idx], ...payload };
    else current.push(payload);
    adminUI.settings.userRegistry = current.slice(-200);
    saveSettingsLocal();
    persistSettingsRemote();
  }

  function currentRoomState(){
    return gameState.roomMode ? gameState.roomState : null;
  }

  function slotIsActive(slotData){
    if(!slotData || !slotData.id) return false;
    if(!slotData.lastSeen) return true;
    return (Date.now() - slotData.lastSeen) < STALE_SLOT_MS;
  }

  function memberIsActive(member){
    if(!member || !member.id) return false;
    if(!member.lastSeen) return true;
    return (Date.now() - member.lastSeen) < STALE_SLOT_MS;
  }

  function emptyRoomSlots(){
    return { 1: null, 2: null, 3: null, 4: null };
  }

  function emptyRoomHands(){
    return { 1: [], 2: [], 3: [], 4: [] };
  }

  function freshMembersFromSlots(slots){
    const members = {};
    for(let slot = 1; slot <= 4; slot++){
      const s = slots?.[slot];
      if(s && s.id){
        const id = String(s.id).toUpperCase().slice(0, 4);
        members[id] = {
          id,
          name: String(s.name || `Jogador ${slot}`).slice(0, 18),
          slot,
          joinedAt: s.joinedAt || Date.now(),
          lastSeen: s.lastSeen || Date.now(),
          watching: false
        };
      }
    }
    return members;
  }

  function normalizeSharedState(raw){
    const base = raw && typeof raw === "object" ? JSON.parse(JSON.stringify(raw)) : {};
    const slots = emptyRoomSlots();
    const hands = emptyRoomHands();
    const members = {};
    if(base.slots && typeof base.slots === "object"){
      for(let slot = 1; slot <= 4; slot++){
        slots[slot] = base.slots[slot] ?? null;
      }
    }
    if(Array.isArray(base.players)){
      for(let slot = 1; slot <= 4; slot++){
        slots[slot] = base.players[slot - 1] ?? slots[slot];
      }
    }
    if(base.hands && typeof base.hands === "object"){
      for(let slot = 1; slot <= 4; slot++){
        if(Array.isArray(base.hands[slot])) hands[slot] = base.hands[slot].slice();
      }
    }
    if(Array.isArray(base.playersHands)){
      for(let slot = 1; slot <= 4; slot++){
        if(Array.isArray(base.playersHands[slot - 1])) hands[slot] = base.playersHands[slot - 1].slice();
      }
    }
    if(base.members && typeof base.members === "object"){
      for(const [id, member] of Object.entries(base.members)){
        if(!member) continue;
        const cleanId = String(member.id || id).toUpperCase().slice(0, 4);
        members[cleanId] = {
          id: cleanId,
          name: String(member.name || "Jogador").slice(0, 18),
          slot: Number.isFinite(member.slot) ? member.slot : null,
          joinedAt: member.joinedAt || Date.now(),
          lastSeen: member.lastSeen || Date.now(),
          watching: !!member.watching
        };
      }
    }

    for(let slot = 1; slot <= 4; slot++){
      const s = slots[slot];
      if(s && s.id){
        const id = String(s.id).toUpperCase().slice(0, 4);
        if(!members[id]){
          members[id] = {
            id,
            name: String(s.name || `Jogador ${slot}`).slice(0, 18),
            slot,
            joinedAt: s.joinedAt || Date.now(),
            lastSeen: s.lastSeen || Date.now(),
            watching: false
          };
        } else {
          members[id].slot = slot;
          members[id].name = String(s.name || members[id].name || `Jogador ${slot}`).slice(0, 18);
          members[id].lastSeen = s.lastSeen || members[id].lastSeen || Date.now();
        }
      }
    }

    return {
      slots,
      hands,
      members,
      deck: Array.isArray(base.deck) ? base.deck.slice() : [],
      topCard: base.topCard || null,
      turn: Number.isFinite(base.turn) ? base.turn : 1,
      penalty: Number.isFinite(base.penalty) ? base.penalty : 0,
      gameRunning: base.gameRunning !== undefined ? !!base.gameRunning : false,
      seatingOpen: base.seatingOpen !== undefined ? !!base.seatingOpen : true,
      winnerSlot: Number.isFinite(base.winnerSlot) ? base.winnerSlot : null,
      startedAt: base.startedAt || null,
      updatedAt: base.updatedAt || null
    };
  }

  function createFreshRoomState(){
    const deck = createFreshDeck();
    const hands = emptyRoomHands();
    for(let slot = 1; slot <= 4; slot++){
      for(let i = 0; i < 7; i++) hands[slot].push(deck.pop());
    }
    return {
      slots: emptyRoomSlots(),
      members: {},
      hands,
      deck,
      topCard: deck.pop(),
      turn: 1,
      penalty: 0,
      gameRunning: true,
      seatingOpen: true,
      winnerSlot: null,
      startedAt: Date.now(),
      updatedAt: Date.now()
    };
  }

  function cleanupStaleSlots(state){
    if(!state || typeof state !== "object") return state;
    const next = state;
    if(!next.slots) next.slots = emptyRoomSlots();
    if(!next.members) next.members = {};
    for(let slot = 1; slot <= 4; slot++){
      if(next.slots[slot] && !slotIsActive(next.slots[slot])){
        next.slots[slot] = null;
      }
    }
    for(const [id, member] of Object.entries(next.members)){
      if(!memberIsActive(member) || (member.slot && !next.slots[member.slot])){
        delete next.members[id];
      }
    }
    for(let slot = 1; slot <= 4; slot++){
      const s = next.slots[slot];
      if(s && s.id){
        const id = String(s.id).toUpperCase().slice(0, 4);
        next.members[id] = next.members[id] || {
          id,
          name: String(s.name || `Jogador ${slot}`).slice(0, 18),
          slot,
          joinedAt: s.joinedAt || Date.now(),
          lastSeen: s.lastSeen || Date.now(),
          watching: false
        };
      }
    }
    return next;
  }

  function getOccupiedSlotsCount(state){
    return Object.values(state?.slots || {}).filter(Boolean).length;
  }

  function getActiveMembersCount(state){
    return Object.values(state?.members || {}).filter(memberIsActive).length;
  }

  function isRoomEmpty(state){
    return getOccupiedSlotsCount(state) === 0 && getActiveMembersCount(state) === 0;
  }

  function normalizeTurn(state){
    const current = state.turn || 1;
    if(state.slots && state.slots[current]) return current;
    for(let step = 1; step <= 4; step++){
      const slot = ((current - 1 + step) % 4) + 1;
      if(state.slots && state.slots[slot]) return slot;
    }
    return 1;
  }

  function getFirstVacantSlot(state){
    for(let slot = 1; slot <= 4; slot++){
      if(!state.slots[slot]) return slot;
    }
    return null;
  }

  function anyVacantSlot(state){
    return getFirstVacantSlot(state) !== null;
  }

  function nextOccupiedSlot(state, fromSlot){
    for(let step = 1; step <= 4; step++){
      const slot = ((fromSlot - 1 + step) % 4) + 1;
      if(state.slots[slot]) return slot;
    }
    return fromSlot;
  }

  function drawFromDeckShared(state){
    if(!state.deck || state.deck.length === 0){
      state.deck = createFreshDeck();
    }
    return state.deck.pop();
  }

  function ensureOccupiedHandsHaveSeven(state){
    for(let slot = 1; slot <= 4; slot++){
      if(state.slots[slot]){
        if(!Array.isArray(state.hands[slot])) state.hands[slot] = [];
        while(state.hands[slot].length < 7){
          state.hands[slot].push(drawFromDeckShared(state));
        }
      }
    }
    return state;
  }

  function touchMember(state, id, name, slot, watching){
    const cleanId = String(id || "").toUpperCase().slice(0, 4);
    if(!cleanId) return;
    if(!state.members) state.members = {};
    const prev = state.members[cleanId] || {};
    state.members[cleanId] = {
      id: cleanId,
      name: String(name || prev.name || "Jogador").slice(0, 18),
      slot: Number.isFinite(slot) ? slot : null,
      joinedAt: prev.joinedAt || Date.now(),
      lastSeen: Date.now(),
      watching: watching !== undefined ? !!watching : !(Number.isFinite(slot) && slot > 0)
    };
  }

  function removeMember(state, id){
    if(state.members && state.members[id]) delete state.members[id];
  }

  function setMemberSeat(state, id, name, slot){
    if(Number.isFinite(slot) && slot > 0){
      touchMember(state, id, name, slot, false);
    }else{
      touchMember(state, id, name, null, true);
    }
  }

  function formatIdChip(id){
    return `<span class="id-chip">${escapeHtml(String(id || "").toUpperCase().slice(0, 4))}</span>`;

  function formatLabelHtml(name, id, extra){
    const safeName = escapeHtml(String(name || "Jogador").slice(0, 18));
    const safeExtra = extra ? ` <span class="muted-extra">${escapeHtml(extra)}</span>` : "";
    return `<span class="player-label">${safeName} ${formatIdChip(id)}${safeExtra}</span>`;
  }

  function getSlotMember(state, slot){
    if(!state) return null;
    const s = state.slots?.[slot];
    if(!s || !s.id) return null;
    const id = String(s.id).toUpperCase().slice(0, 4);
    return {
      id,
      name: String(s.name || `Jogador ${slot}`).slice(0, 18),
      slot
    };
  }

  function getCurrentMemberList(state){
    const members = Object.values(state?.members || {}).filter(memberIsActive);
    const seated = members.filter(m => Number.isFinite(m.slot) && m.slot >= 1 && m.slot <= 4);
    const watchers = members.filter(m => !Number.isFinite(m.slot) || !m.slot);
    seated.sort((a, b) => (a.slot - b.slot) || a.name.localeCompare(b.name));
    watchers.sort((a, b) => a.name.localeCompare(b.name));
    return { seated, watchers, all: seated.concat(watchers) };
  }

  function bootstrapLobbyRooms(){
    stopRoomSubscriptionsEnhanced();
    if(adminUI.settingsListener){
      try{ adminUI.settingsListener(); }catch(e){}
      adminUI.settingsListener = null;
    }

    adminUI.settingsListener = SETTINGS_DOC_REF.onSnapshot(snap => {
      if(snap && snap.exists){
        mergeRemoteSettings(snap.data() || {});
      }else{
        saveSettingsLocal();
      }
      const rooms = getRooms();
      stopRoomSubscriptionsEnhanced();
      rooms.forEach(room => {
        const unsub = db.collection("rooms").doc(room.id).onSnapshot(roomSnap => {
          adminUI.roomCache[room.id] = {
            meta: room,
            state: roomSnap.exists ? roomSnap.data().state : null,
            fullDoc: roomSnap.exists ? roomSnap.data() : null
          };
          renderLobbyRooms();
        }, () => {
          adminUI.roomCache[room.id] = { meta: room, state: null, fullDoc: null };
          renderLobbyRooms();
        });
        adminUI.roomListeners.push(unsub);

  function renderDelegationCandidates(){
    const list = document.getElementById("delegateCandidates");
    if(!list) return;
    const term = normalizeText(document.getElementById("delegateSearchInput")?.value || "");
    const currentMembers = currentRoomState() ? Object.values(currentRoomState().members || {}) : [];
    const registry = Array.isArray(adminUI.settings.userRegistry) ? adminUI.settings.userRegistry : [];
    const merged = [];
    const seen = new Set();
    [...currentMembers, ...registry].forEach(user => {
      if(!user || !user.id) return;
      const id = String(user.id).toUpperCase().slice(0, 4);
      if(seen.has(id)) return;
      seen.add(id);
      merged.push({
        id,
        name: String(user.name || "Jogador").slice(0, 18),
        slot: Number.isFinite(user.slot) ? user.slot : null,
        watching: !!user.watching,
        roomId: user.roomId || ""
      });
    });
    const filtered = merged.filter(user => !term || normalizeText(user.name).includes(term) || normalizeText(user.id).includes(term));
    list.innerHTML = filtered.map(user => `
      <div class="admin-user-item ${adminUI.selectedDelegationId === user.id ? "selected" : ""}" onclick="selectDelegationUser('${escapeHtml(user.id)}')">
        <div>
          <strong>${escapeHtml(user.name)}</strong> ${formatIdChip(user.id)}

    const found = [...currentMembers, ...registry].find(u => String(u.id || "").toUpperCase().slice(0,4) === id);

    if(gameState.myId === id) return { id, name: gameState.myName };

  async function deleteRoom(roomId){
    if(!canAccess("rooms")) return;
    const id = String(roomId || "").trim();
    if(!id) return;
    if(!confirm(`Excluir a sala ${id}?`)) return;
    try{
      await db.collection("rooms").doc(id).delete().catch(() => {});
      const chatSnap = await db.collection("chat").where("roomId", "==", id).get().catch(() => null);
      if(chatSnap && !chatSnap.empty){
        const batch = db.batch();
        chatSnap.forEach(doc => batch.delete(doc.ref));
        await batch.commit().catch(() => {});
      }
    }catch(e){}
    adminUI.settings.rooms = adminUI.settings.rooms.filter(r => r.id !== id);
    delete adminUI.settings.roomMeta[id];
    saveSettings();
    if(gameState.roomId === id){
      gameState.roomMode = false;
      closeRoomSession();
      document.getElementById("table").style.display = "none";

  async function ensureRoomDoc(roomId){
    const meta = getCurrentRoomMetaFromSettings(roomId);
    const ref = db.collection("rooms").doc(roomId);
    const snap = await ref.get();
    if(!snap.exists){
      await ref.set({
        roomId,
        roomName: meta.name || roomId,
        roomPassword: meta.password || "",
        roomPlaylist: Array.isArray(meta.playlist) ? meta.playlist : ADMIN_DEFAULT_PLAYLIST.slice(),
        autoplay: !!meta.autoplay,
        state: createFreshRoomState(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }else{
      const data = snap.data() || {};
      await ref.set({
        roomId,
        roomName: meta.name || data.roomName || roomId,
        roomPassword: meta.password || data.roomPassword || "",
        roomPlaylist: Array.isArray(meta.playlist) ? meta.playlist : (Array.isArray(data.roomPlaylist) ? data.roomPlaylist : ADMIN_DEFAULT_PLAYLIST.slice()),
        autoplay: !!meta.autoplay
      }, { merge: true });
    }
  }

  function applyRoomMetaToState(roomId, state){

    return {
      ...state,
      roomId,
      roomName: meta.name || roomId,
      roomPassword: meta.password || "",
      roomPlaylist: Array.isArray(meta.playlist) ? meta.playlist.slice() : ADMIN_DEFAULT_PLAYLIST.slice(),

  async function joinRoom(roomId, providedPassword){
    const roomIdClean = String(roomId || "").trim();
    if(!roomIdClean) return;
    ensureCurrentUserId();

    const meta = getRoomMeta(roomIdClean);
    if(meta.password && String(providedPassword || "") !== meta.password){
      if(providedPassword === undefined){
        const typed = window.prompt(`A sala ${meta.name} está com senha. Digite a senha:`, "");
        if(typed === null) return;
        return joinRoom(roomIdClean, typed);
      }
      alert("Senha incorreta.");
      return;
    }

    let userName = document.getElementById("roomName")?.value.trim();
    if(!userName) userName = document.getElementById("playerName")?.value.trim();
    if(!userName) userName = "Jogador";
    userName = userName.slice(0, 18);

    gameState.myName = userName;
    gameState.roomMode = true;
    gameState.roomId = roomIdClean;
    gameState.mySlot = null;
    showGame();
    applyModeUI();
    renderGame();

    try{
      await ensureRoomDoc(roomIdClean);
      const roomRef = db.collection("rooms").doc(roomIdClean);

      const joined = await db.runTransaction(async tx => {
        const snap = await tx.get(roomRef);
        if(!snap.exists) throw new Error("Sala não encontrada");
        const data = snap.data() || {};
        let state = cleanupStaleSlots(normalizeSharedState(data.state));
        const wasEmpty = isRoomEmpty(state);

        if(wasEmpty){
          state = createFreshRoomState();
        }

        let existingSlot = null;
        for(let slot = 1; slot <= 4; slot++){
          const s = state.slots[slot];
          if(s && String(s.id || "").toUpperCase().slice(0,4) === gameState.myId){
            existingSlot = slot;
            break;
          }
        }

        let chosenSlot = existingSlot;
        if(chosenSlot === null && state.seatingOpen !== false){
          chosenSlot = getFirstVacantSlot(state);
        }

        state.members = state.members || {};
        touchMember(state, gameState.myId, userName, chosenSlot, chosenSlot === null);
        if(chosenSlot !== null){
          state.slots[chosenSlot] = {
            id: gameState.myId,
            name: userName,
            joinedAt: Date.now(),
            lastSeen: Date.now()
          };
        }

        if(getOccupiedSlotsCount(state) >= 4){
          state.seatingOpen = false;
        }

        state.turn = normalizeTurn(state);
        state.gameRunning = state.gameRunning !== undefined ? !!state.gameRunning : true;

        if(!state.topCard){
          state = createFreshRoomState();
          touchMember(state, gameState.myId, userName, chosenSlot, chosenSlot === null);
          if(chosenSlot !== null){
            state.slots[chosenSlot] = {
              id: gameState.myId,
              name: userName,
              joinedAt: Date.now(),
              lastSeen: Date.now()
            };
          }
        }

        state = ensureOccupiedHandsHaveSeven(state);
        state = applyRoomMetaToState(roomIdClean, state);

        tx.set(roomRef, {
          roomId: roomIdClean,
          roomName: meta.name || roomIdClean,
          roomPassword: meta.password || "",
          roomPlaylist: Array.isArray(meta.playlist) ? meta.playlist.slice() : ADMIN_DEFAULT_PLAYLIST.slice(),
          autoplay: !!meta.autoplay,
          state,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        return { slot: chosenSlot, wasEmpty, meta };
      });

      gameState.mySlot = joined.slot;
      gameState.roomPlaylist = (joined.meta.playlist && joined.meta.playlist.length ? joined.meta.playlist : ADMIN_DEFAULT_PLAYLIST).slice();
      subscribeRoom(roomIdClean);
      startRoomHeartbeat();
      initRoomChat(roomIdClean);
      renderGame();
      if(getRoomAutoplay(roomIdClean)){
        playMusic();
      }else{
        pauseMusic();
      }
      addUserToRegistry({ id: gameState.myId, name: gameState.myName, roomId: roomIdClean, slot: gameState.mySlot, watching: gameState.mySlot === null });
    }catch(err){
      console.error(err);
      alert(err.message || "Não foi possível entrar na sala.");
      backToLobby();
    }
  }

  function startRoomHeartbeat(){
    stopRoomHeartbeat();
    gameState.roomHeartbeat = setInterval(() => {
      if(!gameState.roomMode || !gameState.roomId) return;
      const roomId = gameState.roomId;
      const roomRef = db.collection("rooms").doc(roomId);
      const slotPath = gameState.mySlot ? `state.slots.${gameState.mySlot}` : null;
      db.runTransaction(async tx => {
        const snap = await tx.get(roomRef);
        if(!snap.exists) return;
        const data = snap.data() || {};
        let state = cleanupStaleSlots(normalizeSharedState(data.state));
        touchMember(state, gameState.myId, gameState.myName, gameState.mySlot || null, gameState.mySlot === null);
        if(gameState.mySlot){
          state.slots[gameState.mySlot] = {
            id: gameState.myId,
            name: gameState.myName,
            joinedAt: state.slots[gameState.mySlot]?.joinedAt || Date.now(),
            lastSeen: Date.now()
          };
        }
        state.updatedAt = Date.now();
        tx.update(roomRef, { state, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      }).catch(() => {});
    }, 7000);
  }

  async function leaveCurrentRoom(){
    if(!gameState.roomMode || !gameState.roomId) return;
    const roomId = gameState.roomId;
    const roomRef = db.collection("rooms").doc(roomId);
    const myId = gameState.myId;
    stopRoomHeartbeat();
    let shouldReset = false;
    try{
      await db.runTransaction(async tx => {
        const snap = await tx.get(roomRef);
        if(!snap.exists) return;
        const data = snap.data() || {};
        let state = cleanupStaleSlots(normalizeSharedState(data.state));
        if(state.members && state.members[myId]){
          delete state.members[myId];
        }
        if(gameState.mySlot && state.slots[gameState.mySlot] && String(state.slots[gameState.mySlot].id || "").toUpperCase().slice(0,4) === myId){
          state.slots[gameState.mySlot] = null;
        }
        state.turn = normalizeTurn(state);
        shouldReset = isRoomEmpty(state);
        if(shouldReset){
          tx.delete(roomRef);
        }else{
          tx.update(roomRef, { state, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        }
      });
      if(shouldReset){
        await db.collection("chat").where("roomId", "==", roomId).get().then(snap => {
          const batch = db.batch();
          snap.forEach(doc => batch.delete(doc.ref));
          return batch.commit();
        }).catch(() => {});
      }
    }catch(e){
      console.warn("Não foi possível sair da sala:", e);
    }
    stopRoomSubscriptions();
  }

  async function leaveSeat(){
    if(!gameState.roomMode || !gameState.roomId || !gameState.mySlot) return;
    const roomId = gameState.roomId;
    const roomRef = db.collection("rooms").doc(roomId);
    try{
      await db.runTransaction(async tx => {
        const snap = await tx.get(roomRef);
        if(!snap.exists) throw new Error("Sala não encontrada");
        const data = snap.data() || {};
        let state = cleanupStaleSlots(normalizeSharedState(data.state));
        const myId = gameState.myId;
        if(state.slots[gameState.mySlot] && String(state.slots[gameState.mySlot].id || "").toUpperCase().slice(0,4) === myId){
          state.slots[gameState.mySlot] = null;
          setMemberSeat(state, myId, gameState.myName, null);
          if(state.turn === gameState.mySlot) state.turn = normalizeTurn(state);
          tx.update(roomRef, { state, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        }
      });
      gameState.mySlot = null;
      renderGame();
    }catch(e){
      console.warn("Não foi possível sair da mesa:", e);
      alert(e.message || "Não foi possível sair da mesa.");
    }
  }

  async function takeSeat(){
    if(!gameState.roomMode || !gameState.roomId || gameState.mySlot) return;
    const roomId = gameState.roomId;
    const roomRef = db.collection("rooms").doc(roomId);
    try{
      const result = await db.runTransaction(async tx => {
        const snap = await tx.get(roomRef);
        if(!snap.exists) throw new Error("Sala não encontrada");
        const data = snap.data() || {};
        let state = cleanupStaleSlots(normalizeSharedState(data.state));
        let chosenSlot = getFirstVacantSlot(state);
        if(chosenSlot === null) throw new Error("Não há lugar vazio na mesa");
        state.slots[chosenSlot] = {
          id: gameState.myId,
          name: gameState.myName,
          joinedAt: Date.now(),
          lastSeen: Date.now()
        };
        setMemberSeat(state, gameState.myId, gameState.myName, chosenSlot);
        if(getOccupiedSlotsCount(state) >= 4){
          state.seatingOpen = false;
        }
        state = ensureOccupiedHandsHaveSeven(state);
        state.turn = normalizeTurn(state);
        tx.update(roomRef, { state, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        return chosenSlot;
      });
      gameState.mySlot = result;
      startRoomHeartbeat();
      renderGame();
    }catch(e){
      console.warn("Não foi possível subir para a mesa:", e);
      alert(e.message || "Não foi possível subir para a mesa.");
    }
  }

  function subscribeRoom(roomId){
    stopRoomSubscriptions();
    const roomRef = db.collection("rooms").doc(roomId);
    const unsub = roomRef.onSnapshot(snapshot => {
      if(!snapshot.exists) return;
      const data = snapshot.data() || {};
      let state = cleanupStaleSlots(normalizeSharedState(data.state));
      gameState.roomState = state;
      if(Array.isArray(data.roomPlaylist) && data.roomPlaylist.length){
        gameState.roomPlaylist = data.roomPlaylist.slice();
      }else{
        gameState.roomPlaylist = getRoomPlaylist(roomId).slice();
      }
      const needsRefill = Object.keys(state.slots).some(slot => state.slots[slot] && (!Array.isArray(state.hands[slot]) || state.hands[slot].length < 7));
      if(needsRefill){
        db.runTransaction(async tx => {
          const freshSnap = await tx.get(roomRef);
          if(!freshSnap.exists) return;
          const freshData = freshSnap.data() || {};
          let freshState = cleanupStaleSlots(normalizeSharedState(freshData.state));
          freshState = ensureOccupiedHandsHaveSeven(freshState);
          tx.update(roomRef, {
            state: freshState,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }).catch(() => {});
      }
      if(gameState.myId){
        for(let slot = 1; slot <= 4; slot++){
          if(state.slots[slot] && String(state.slots[slot].id || "").toUpperCase().slice(0,4) === gameState.myId){
            gameState.mySlot = slot;
          }
        }
      }
      renderGame();
      renderPeopleModal();
    }, err => {
      console.error("Erro ao ouvir sala:", err);
    });
    adminUI.roomListeners.push(unsub);
  }

  function initRoomChat(roomId){
    if(window.chatUnsubscribe) window.chatUnsubscribe();
    const q = db.collection("chat").where("roomId", "==", roomId);
    window.chatUnsubscribe = q.onSnapshot(snapshot => {
      const msgs = [];
      snapshot.forEach(doc => {
        const d = doc.data() || {};
        msgs.push({
          id: doc.id,
          author: d.author || "Anônimo",
          authorId: d.authorId || "",
          message: d.message || "",
          timestamp: d.timestamp?.toDate?.() || new Date()
        });
      });
      msgs.sort((a,b) => a.timestamp - b.timestamp);
      renderChatMessages(msgs);
    }, err => {
      console.error("Erro no chat:", err);
      document.getElementById("chatMessagesList").innerHTML = `<div style="text-align:center;color:red;">Erro no chat: ${escapeHtml(err.message || "erro")}</div>`;
    });

  function initOfflineChat(){
    if(window.chatUnsubscribe) window.chatUnsubscribe();
    const stored = localStorage.getItem(CHAT_PREFIX_LS_KEY + "offline");
    let msgs = stored ? JSON.parse(stored) : [];
    msgs.sort((a,b) => new Date(a.timestamp) - new Date(b.timestamp));
    renderChatMessages(msgs);
  }

  function saveOfflineMessage(author, message){
    const stored = localStorage.getItem(CHAT_PREFIX_LS_KEY + "offline");
    let msgs = stored ? JSON.parse(stored) : [];
    msgs.push({
      id: Date.now().toString(),
      author,
      authorId: gameState.myId,
      message,
      timestamp: new Date().toISOString()
    });
    if(msgs.length > 80) msgs = msgs.slice(-80);
    localStorage.setItem(CHAT_PREFIX_LS_KEY + "offline", JSON.stringify(msgs));
    renderChatMessages(msgs);
  }

  function renderChatMessages(messages){
    const container = document.getElementById("chatMessagesList");
    if(!container) return;
    if(!messages || !messages.length){
      container.innerHTML = '<div style="text-align:center; color:var(--muted);">Nenhuma mensagem ainda.</div>';
      return;
    }
    const registry = Array.isArray(adminUI.settings.userRegistry) ? adminUI.settings.userRegistry : [];
    container.innerHTML = "";
    messages.forEach(msg => {
      const time = new Date(msg.timestamp).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" });
      let authorName = msg.author || "Anônimo";
      let authorId = String(msg.authorId || "").toUpperCase().slice(0,4);
      if(!authorId){
        const hit = registry.find(u => normalizeText(u.name) === normalizeText(authorName));
        if(hit) authorId = String(hit.id || "").toUpperCase().slice(0,4);
      }
      const div = document.createElement("div");
      div.className = "chat-message";
      div.innerHTML = `
        <div class="message-header">
          <span class="message-author">${escapeHtml(authorName)} ${authorId ? formatIdChip(authorId) : ""}</span>
          <span class="message-time">${time}</span>
        </div>
        <div class="message-text">${escapeHtml(msg.message || "")}</div>
      `;
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  }

  function initGame(){
    clearTimeout(gameState.botTimer);
    ensureCurrentUserId();
    gameState.botIds = [randomId4(), randomId4(), randomId4()];
    gameState.deck = [];
    gameState.players = [[],[],[],[]];

    gameState.turn = 0;
    gameState.gameRunning = true;
    for(let i = 0; i < 100; i++) gameState.deck.push(createCard());
    for(let p = 0; p < 4; p++) for(let i = 0; i < 7; i++) gameState.players[p].push(drawFromDeckOffline());
