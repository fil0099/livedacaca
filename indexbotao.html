<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle em Tempo Real - Firestore</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --off-color: #888888;
            --on-color: #2ecc71;
            --toggle-bg: #dcdde1;
            --toggle-active: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            min-width: 250px;
        }

        h2 {
            margin: 0;
            color: #2f3640;
            font-size: 1.2rem;
        }

        /* Estilo do Botão Deslizante (Switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--toggle-active);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* Indicador de Status (Bola) */
        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .indicator-ball {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--off-color);
            transition: background-color 0.3s, box-shadow 0.3s;
        }

        .indicator-ball.active {
            background-color: var(--on-color);
            box-shadow: 0 0 10px var(--on-color);
        }

        .status-text {
            font-size: 0.9rem;
            font-weight: bold;
            color: #57606f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Controle Remoto</h2>
        
        <label class="switch">
            <input type="checkbox" id="toggleSwitch">
            <span class="slider"></span>
        </label>

        <div class="status-container">
            <div id="ball" class="indicator-ball"></div>
            <span id="statusText" class="status-text">DESLIGADO</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

        // Sua configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBcSfnaRwXZPJ2Z6MUoednrqZug2YJwzEc",
            authDomain: "testbotao.firebaseapp.com",
            databaseURL: "https://testbotao-default-rtdb.firebaseio.com",
            projectId: "testbotao",
            storageBucket: "testbotao.firebasestorage.app",
            messagingSenderId: "940068631746",
            appId: "1:940068631746:web:2df2dee1d918a0f55bb75b"
        };

        // Inicializa Firebase e Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referência ao documento específico no Firestore (conforme suas regras)
        // Coleção: toggle | Documento: estado
        const docRef = doc(db, "toggle", "estado");

        const toggleSwitch = document.getElementById('toggleSwitch');
        const ball = document.getElementById('ball');
        const statusText = document.getElementById('statusText');

        // 1. ESCUTAR MUDANÇAS EM TEMPO REAL (Firestore -> UI)
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                updateUI(data.ligado);
            } else {
                // Se o documento não existir, força estado inicial desligado
                updateUI(false);
            }
        });

        // 2. ATUALIZAR INTERFACE
        function updateUI(isLigado) {
            toggleSwitch.checked = isLigado;
            if (isLigado) {
                ball.classList.add('active');
                statusText.innerText = "LIGADO";
                statusText.style.color = "#2ecc71";
            } else {
                ball.classList.remove('active');
                statusText.innerText = "DESLIGADO";
                statusText.style.color = "#888888";
            }
        }

        // 3. ENVIAR MUDANÇAS PARA O FIRESTORE (UI -> Firestore)
        toggleSwitch.addEventListener('change', async (e) => {
            const novoEstado = e.target.checked;
            try {
                // Usamos merge: true para garantir que o documento seja criado se não existir
                await setDoc(docRef, { ligado: novoEstado }, { merge: true });
            } catch (error) {
                console.error("Erro ao atualizar Firestore:", error);
            }
        });
    </script>
</body>
</html>
