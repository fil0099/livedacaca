<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Botão x</title>

  <style>
    body {
      font-family: Arial;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f3f4f6;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 15px;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .switch {
      position: relative;
      width: 60px;
      height: 34px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      background-color: #ccc;
      border-radius: 34px;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      transition: 0.3s;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 26px;
      width: 26px;
      left: 4px;
      top: 4px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    input:checked + .slider {
      background-color: #22c55e;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .bola {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: gray;
      transition: 0.3s;
    }

    .bola.on {
      background: #22c55e;
    }
  </style>
</head>
<body>

<div class="container">
  <label class="switch">
    <input id="toggle" type="checkbox">
    <span class="slider"></span>
  </label>

  <div id="bola" class="bola"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// SUA CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBcSfnaRwXZPJ2Z6MUoednrqZug2YJwzEc",
  authDomain: "testbotao.firebaseapp.com",
  projectId: "testbotao",
  storageBucket: "testbotao.firebasestorage.app",
  messagingSenderId: "940068631746",
  appId: "1:940068631746:web:2df2dee1d918a0f55bb75b"
};

// INICIALIZA
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ELEMENTOS
const toggle = document.getElementById("toggle");
const bola = document.getElementById("bola");

// REFERÊNCIA
const ref = doc(db, "toggle", "estado");

// 🔥 TEMPO REAL
onSnapshot(ref, (snap) => {
  if (snap.exists()) {
    const ativo = snap.data().ativo;

    toggle.checked = ativo;
    bola.classList.toggle("on", ativo);
  }
});

// SALVAR
toggle.addEventListener("change", async () => {
  await setDoc(ref, {
    ativo: toggle.checked
  });
});
</script>

</body>
</html>
