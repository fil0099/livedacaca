<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cartas Multiplayer - Só Admin cria salas</title>
  <style>
    /* ========== SEU CSS ORIGINAL (mantido) ========== */
    :root{
      --bg1:#eef2ff;
      --bg2:#f8fafc;
      --panel: rgba(255,255,255,0.78);
      --panel-strong: rgba(255,255,255,0.94);
      --stroke: rgba(15,23,42,0.10);
      --text:#0f172a;
      --muted:#64748b;
      --accent:#16a34a;
      --accent-2:#0ea5e9;
      --shadow: 0 20px 60px rgba(15,23,42,.12);
      --card-w: clamp(58px, 6.4vw, 88px);
      --card-h: calc(var(--card-w) * 1.42);
      --card-small-w: clamp(42px, 4.8vw, 58px);
      --card-small-h: calc(var(--card-small-w) * 1.42);
      --radius: 22px;
      --board-glow: rgba(14, 165, 233, .12);
      --board-glow-2: rgba(34, 197, 94, .12);
    }

    body[data-theme="dark"]{
      --bg1:#07111f;
      --bg2:#0f172a;
      --panel: rgba(15, 23, 42, 0.70);
      --panel-strong: rgba(15, 23, 42, 0.92);
      --stroke: rgba(255,255,255,0.10);
      --text:#e5eefb;
      --muted:#93a4bf;
      --accent:#22c55e;
      --accent-2:#38bdf8;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --board-glow: rgba(56, 189, 248, .16);
      --board-glow-2: rgba(34, 197, 94, .14);
    }

    *{ box-sizing:border-box; }
    html, body{ width:100%; height:100%; margin:0; }
    body{
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 15%, var(--board-glow), transparent 24%),
                  radial-gradient(circle at 80% 20%, var(--board-glow-2), transparent 22%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
    }
    .screen{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      padding:24px;
      background: radial-gradient(circle at top, rgba(56,189,248,.12), transparent 35%),
                  linear-gradient(180deg, rgba(248,250,252,.78), rgba(241,245,249,.90));
      backdrop-filter: blur(12px);
    }
    .panel{
      width:min(980px, 100%);
      border:1px solid var(--stroke);
      background:var(--panel);
      border-radius:30px;
      padding:clamp(22px, 4vw, 40px);
      backdrop-filter: blur(12px);
      text-align:center;
    }
    h1 span{
      display:inline-block;
      padding:0 .35em;
      border-radius:999px;
      background: linear-gradient(135deg, rgba(14,165,233,.16), rgba(34,197,94,.16));
      border:1px solid var(--stroke);
    }
    .btn{
      appearance:none; border:none; cursor:pointer;
      padding:12px 18px; border-radius:999px;
      font-weight:800; color:white;
      background: linear-gradient(135deg, #22c55e, #0ea5e9);
      transition: transform .15s ease;
    }
    .btn.secondary{
      background:var(--panel-strong);
      color:var(--text);
      border:1px solid var(--stroke);
    }
    .lobby-grid{
      display:grid;
      gap:18px;
      margin-top:24px;
      text-align:left;
    }
    .hero-card, .lobby-card{
      border:1px solid var(--stroke);
      background:var(--panel);
      border-radius:24px;
      padding:22px;
    }
    .name-row{
      display:flex;
      gap:10px;
      margin-top:14px;
    }
    .name-row input{
      flex:1;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--stroke);
      background:var(--panel-strong);
      color:var(--text);
    }
    .rooms{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:14px;
      margin-top:12px;
    }
    .room-card{
      border:1px solid var(--stroke);
      background:var(--panel);
      border-radius:24px;
      padding:18px;
    }
    .room-head{
      display:flex;
      justify-content:space-between;
      margin-bottom:10px;
    }
    .room-tag{
      padding:6px 10px;
      border-radius:999px;
      font-size:.75rem;
      background:rgba(14,165,233,.12);
    }
    .room-actions{
      display:flex;
      justify-content:space-between;
      margin-top:14px;
    }
    .modal{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(8px);
      z-index:100;
    }
    .modal-card{
      background:var(--panel-strong);
      border-radius:24px;
      padding:24px;
      width:min(500px, 90%);
      border:1px solid var(--stroke);
    }
    .modal-row{
      display:flex;
      gap:10px;
      margin-top:12px;
    }
    .field{
      flex:1;
      padding:12px;
      border-radius:16px;
      border:1px solid var(--stroke);
      background:var(--panel);
    }
    /* Área do jogo (escondida inicialmente) */
    #gameArea{
      display:none;
      position:fixed; inset:0;
      background: radial-gradient(circle at 50% 45%, var(--board-glow-2), transparent 30%),
                  radial-gradient(circle at 50% 45%, var(--board-glow), transparent 42%);
    }
    .game-container{
      display:flex;
      flex-direction:column;
      height:100%;
      padding:16px;
    }
    .hud{
      display:flex;
      justify-content:space-between;
      background:var(--panel);
      border-radius:24px;
      padding:12px 20px;
      margin-bottom:16px;
    }
    .board{
      flex:1;
      display:grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      grid-template-rows: auto 1fr auto;
      gap:12px;
    }
    .hand{
      background:var(--panel);
      border-radius:20px;
      padding:10px;
    }
    .cards{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .card{
      width:var(--card-w);
      height:var(--card-h);
      border-radius:16px;
      background-size:cover;
      border:2px solid rgba(255,255,255,0.3);
      cursor:pointer;
      transition:transform 0.1s;
    }
    .card:hover{ transform:translateY(-5px); }
    .center-area{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
    }
    .pile{
      width:var(--card-w);
      height:var(--card-h);
      background:var(--panel-strong);
      border-radius:16px;
      border:1px solid var(--stroke);
    }
    .chat-panel{
      position:fixed;
      right:16px;
      bottom:16px;
      width:280px;
      background:var(--panel-strong);
      border-radius:20px;
      padding:10px;
      border:1px solid var(--stroke);
    }
    .chat-messages{
      height:200px;
      overflow-y:auto;
      font-size:0.85rem;
    }
    .chat-form{
      display:flex;
      gap:6px;
      margin-top:8px;
    }
    .chat-form input{
      flex:1;
      padding:8px;
      border-radius:20px;
      border:1px solid var(--stroke);
    }
    @media (max-width:800px){
      .rooms{ grid-template-columns:1fr; }
      .board{ grid-template-columns:1fr; gap:8px; }
      .hand{ min-height:120px; }
    }
  </style>
</head>
<body data-theme="light">
  <!-- TELA DE LOBBY -->
  <div id="lobbyScreen" class="screen">
    <div class="panel">
      <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
        <button class="btn secondary" onclick="openAdminModal()">Admin</button>
      </div>
      <h1><span>Cartas Multiplayer</span></h1>
      <p class="subtitle">Só o admin pode criar salas. Entre em uma sala para jogar.</p>
      <div class="lobby-grid">
        <div class="hero-card">
          <strong>Seu nome</strong>
          <div class="name-row">
            <input id="playerName" placeholder="Seu nome" maxlength="18">
            <button class="btn" onclick="joinRobots()">Jogar contra robôs</button>
          </div>
        </div>
        <div class="lobby-card">
          <strong>Salas disponíveis</strong>
          <div class="rooms" id="roomsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- TELA DO JOGO (mesa) -->
  <div id="gameArea">
    <div class="game-container">
      <div class="hud">
        <div>
          <button class="btn secondary" onclick="backToLobby()">Sair</button>
          <span style="margin-left:10px;">Sua vez: <span id="turnIndicator">—</span></span>
        </div>
        <div>
          <button id="audioBtn" class="btn secondary" onclick="toggleAudio()">Áudio: off</button>
          <button id="micBtn" class="btn secondary" onclick="toggleMic()">Mic: off</button>
        </div>
      </div>
      <div class="board">
        <div id="p2" class="hand"><div class="info"></div><div class="cards"></div></div>
        <div id="p3" class="hand"><div class="info"></div><div class="cards"></div></div>
        <div class="center-area">
          <div style="display:flex; gap:16px;">
            <div id="drawPile" class="pile"></div>
            <div id="discardPile" class="pile"></div>
          </div>
          <button class="btn" onclick="drawCard()">Comprar carta</button>
          <div id="statusNote" style="font-size:0.9rem;"></div>
        </div>
        <div id="p4" class="hand"><div class="info"></div><div class="cards"></div></div>
        <div id="p1" class="hand"><div class="info"></div><div class="cards"></div></div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatPanel" class="chat-panel" style="display:none;">
    <div><strong>Chat da sala</strong></div>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" placeholder="Mensagem...">
      <button type="submit" class="btn secondary">Enviar</button>
    </form>
  </div>

  <!-- MODAL ADMIN -->
  <div id="adminModal" class="modal">
    <div class="modal-card">
      <h3>Administração</h3>
      <div id="adminLoginDiv">
        <input id="adminPassword" type="password" placeholder="Senha do admin" class="field">
        <div class="modal-row">
          <button class="btn" onclick="loginAdmin()">Entrar como admin</button>
        </div>
      </div>
      <div id="adminPanelDiv" style="display:none;">
        <div class="modal-row">
          <input id="newRoomName" class="field" placeholder="Nome da nova sala">
          <button class="btn" onclick="createRoom()">Criar sala</button>
        </div>
        <div id="adminRoomsList" style="margin-top:16px;"></div>
        <button class="btn secondary" onclick="logoutAdmin()" style="margin-top:12px;">Sair do admin</button>
      </div>
      <button class="btn secondary" onclick="closeAdminModal()" style="margin-top:12px;">Fechar</button>
    </div>
  </div>

  <!-- MODAL SENHA -->
  <div id="passwordModal" class="modal">
    <div class="modal-card">
      <h3>Senha da sala</h3>
      <input id="roomPasswordInput" type="password" class="field" placeholder="Senha">
      <div class="modal-row">
        <button class="btn" onclick="confirmPassword()">Entrar</button>
        <button class="btn secondary" onclick="closePasswordModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    // ==================== CONFIGURAÇÕES DO JOGO ====================
    const imgs = [
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/000404.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/0005563.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/000569.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/001013.webp"
    ];
    const colors = ["red", "blue", "green", "yellow"];
    const colorMap = { red:"#ef4444", blue:"#3b82f6", green:"#22c55e", yellow:"#eab308" };

    let state = {
      roomMode: false,
      roomId: null,
      roomName: "",
      myName: "Você",
      myId: "",
      isAdmin: false,
      players: [[],[],[],[]],
      topCard: null,
      turn: 0,
      penalty: 0,
      gameRunning: false,
      deck: [],
      roomMembers: [],
      audioEnabled: false,
      micEnabled: false,
      micStream: null
    };
    window.state = state;

    // Salvar/recuperar salas (apenas admin pode modificar)
    let rooms = [];
    const ADMIN_PASSWORD = "adm123";

    function loadRooms(){
      try{
        const saved = localStorage.getItem("cartas_rooms");
        if(saved) rooms = JSON.parse(saved);
        else rooms = [
          { id: "room1", name: "Sala do Admin", locked: false, password: "" },
          { id: "room2", name: "Sala dos Amigos", locked: false, password: "" }
        ];
      }catch(e){ rooms = []; }
      renderLobbyRooms();
    }
    function saveRooms(){
      localStorage.setItem("cartas_rooms", JSON.stringify(rooms));
      renderLobbyRooms();
      if(state.isAdmin) renderAdminRooms();
      // sincronizar com Firebase (se disponível)
      if(window.firebaseBridge && window.firebaseBridge.syncPublic){
        window.firebaseBridge.syncPublic({ rooms });
      }
    }

    function renderLobbyRooms(){
      const container = document.getElementById("roomsList");
      if(!container) return;
      container.innerHTML = "";
      rooms.forEach(room => {
        const div = document.createElement("div");
        div.className = "room-card";
        div.innerHTML = `
          <div class="room-head">
            <strong>${escapeHtml(room.name)}</strong>
            <span class="room-tag">${room.locked ? "🔒" : "🔓"}</span>
          </div>
          <div class="room-actions">
            <button class="btn secondary" onclick="joinRoom('${room.id}')">Entrar</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function renderAdminRooms(){
      const container = document.getElementById("adminRoomsList");
      if(!container) return;
      container.innerHTML = "<strong>Editar salas:</strong>";
      rooms.forEach(room => {
        const div = document.createElement("div");
        div.style.marginTop = "12px";
        div.style.border = "1px solid var(--stroke)";
        div.style.padding = "10px";
        div.style.borderRadius = "16px";
        div.innerHTML = `
          <div><strong>${escapeHtml(room.name)}</strong></div>
          <div class="modal-row">
            <input type="text" id="pass-${room.id}" value="${room.password || ''}" placeholder="Senha (deixe vazio para aberta)" style="flex:1;">
            <button class="btn secondary" onclick="updateRoom('${room.id}')">Salvar</button>
            <button class="btn secondary" onclick="deleteRoom('${room.id}')">Excluir</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function updateRoom(roomId){
      const room = rooms.find(r => r.id === roomId);
      if(room){
        const newPass = document.getElementById(`pass-${roomId}`).value.trim();
        room.password = newPass;
        room.locked = newPass !== "";
        saveRooms();
        renderAdminRooms();
      }
    }

    function deleteRoom(roomId){
      rooms = rooms.filter(r => r.id !== roomId);
      saveRooms();
      renderAdminRooms();
    }

    function createRoom(){
      if(!state.isAdmin){ alert("Apenas administradores podem criar salas."); return; }
      const name = document.getElementById("newRoomName").value.trim();
      if(!name){ alert("Digite um nome."); return; }
      const newId = "room_"+Date.now();
      rooms.push({ id: newId, name: name, locked: false, password: "" });
      saveRooms();
      document.getElementById("newRoomName").value = "";
      renderAdminRooms();
    }

    function loginAdmin(){
      const pass = document.getElementById("adminPassword").value;
      if(pass === ADMIN_PASSWORD){
        state.isAdmin = true;
        document.getElementById("adminLoginDiv").style.display = "none";
        document.getElementById("adminPanelDiv").style.display = "block";
        renderAdminRooms();
      } else {
        alert("Senha incorreta.");
      }
    }

    function logoutAdmin(){
      state.isAdmin = false;
      document.getElementById("adminLoginDiv").style.display = "block";
      document.getElementById("adminPanelDiv").style.display = "none";
      closeAdminModal();
    }

    function openAdminModal(){
      document.getElementById("adminModal").style.display = "flex";
      if(state.isAdmin){
        document.getElementById("adminLoginDiv").style.display = "none";
        document.getElementById("adminPanelDiv").style.display = "block";
        renderAdminRooms();
      } else {
        document.getElementById("adminLoginDiv").style.display = "block";
        document.getElementById("adminPanelDiv").style.display = "none";
      }
    }
    function closeAdminModal(){ document.getElementById("adminModal").style.display = "none"; }

    let pendingRoom = null;
    function joinRoom(roomId){
      const room = rooms.find(r => r.id === roomId);
      if(!room) return;
      const name = document.getElementById("playerName").value.trim();
      if(!name){ alert("Digite seu nome."); return; }
      state.myName = name;
      state.myId = "user_"+Math.random().toString(36).substr(2,6);
      if(room.locked && !state.isAdmin){
        pendingRoom = room;
        document.getElementById("passwordModal").style.display = "flex";
        return;
      }
      enterRoom(room);
    }
    function confirmPassword(){
      const pass = document.getElementById("roomPasswordInput").value;
      if(pass === pendingRoom.password){
        closePasswordModal();
        enterRoom(pendingRoom);
      } else {
        alert("Senha errada.");
      }
    }
    function closePasswordModal(){ document.getElementById("passwordModal").style.display = "none"; pendingRoom = null; }
    function enterRoom(room){
      state.roomMode = true;
      state.roomId = room.id;
      state.roomName = room.name;
      // Iniciar jogo multiplayer via Firebase (se disponível)
      if(window.startMultiplayerGame){
        window.startMultiplayerGame(room);
      } else {
        // fallback local (apenas para teste)
        startLocalMultiplayer();
      }
      document.getElementById("lobbyScreen").style.display = "none";
      document.getElementById("gameArea").style.display = "block";
      document.getElementById("chatPanel").style.display = "block";
      initGame();
    }

    function backToLobby(){
      if(window.leaveMultiplayerGame) window.leaveMultiplayerGame();
      state.roomMode = false;
      document.getElementById("lobbyScreen").style.display = "flex";
      document.getElementById("gameArea").style.display = "none";
      document.getElementById("chatPanel").style.display = "none";
      renderLobbyRooms();
    }

    // Funções do jogo (simplificadas)
    function createCard(){ return { color: colors[Math.floor(Math.random()*4)], value: Math.floor(Math.random()*10).toString(), img: imgs[Math.floor(Math.random()*imgs.length)] }; }
    function drawFromDeck(){ if(state.deck.length===0) for(let i=0;i<60;i++) state.deck.push(createCard()); return state.deck.pop(); }
    function initGame(){
      state.deck = [];
      for(let i=0;i<100;i++) state.deck.push(createCard());
      state.players = [[],[],[],[]];
      for(let p=0;p<4;p++) for(let i=0;i<6;i++) state.players[p].push(drawFromDeck());
      state.topCard = drawFromDeck();
      state.turn = 0;
      state.penalty = 0;
      state.gameRunning = true;
      renderGame();
    }
    function canPlay(c){ if(!state.topCard) return true; if(c.value==="+4") return true; if(c.value==="+2") return c.color===state.topCard.color || state.topCard.value==="+2"; return c.color===state.topCard.color || c.value===state.topCard.value; }
    function playCard(index){
      if(!state.gameRunning || state.turn!==0 || state.penalty>0) return;
      const card = state.players[0][index];
      if(!canPlay(card)) return;
      state.topCard = card;
      if(card.value==="+2") state.penalty+=2;
      if(card.value==="+4") state.penalty+=4;
      state.players[0].splice(index,1);
      renderGame();
      nextTurn();
    }
    function drawCard(){
      if(!state.gameRunning || state.turn!==0 || state.penalty>0) return;
      state.players[0].push(drawFromDeck());
      renderGame();
      nextTurn();
    }
    function nextTurn(){
      if(checkWin()) return;
      state.turn = (state.turn+1)%4;
      if(state.penalty>0 && state.turn===0){
        for(let i=0;i<state.penalty;i++) state.players[0].push(drawFromDeck());
        state.penalty=0;
        renderGame();
        nextTurn();
        return;
      }
      renderGame();
      if(!state.roomMode && state.turn!==0) setTimeout(()=>botTurn(), 800);
    }
    function botTurn(){
      if(!state.gameRunning || state.turn===0) return;
      const hand = state.players[state.turn];
      const idx = hand.findIndex(c=>canPlay(c));
      if(idx!==-1){
        state.topCard = hand[idx];
        if(hand[idx].value==="+2") state.penalty+=2;
        if(hand[idx].value==="+4") state.penalty+=4;
        hand.splice(idx,1);
      } else {
        hand.push(drawFromDeck());
      }
      renderGame();
      nextTurn();
    }
    function checkWin(){
      for(let i=0;i<4;i++) if(state.players[i].length===0){
        state.gameRunning=false;
        alert((i===0?"Você":`Jogador ${i+1}`)+" venceu!");
        backToLobby();
        return true;
      }
      return false;
    }
    function renderGame(){
      const p1div = document.getElementById("p1");
      p1div.querySelector(".info").innerHTML = `<strong>${state.myName}</strong> (${state.players[0].length})`;
      p1div.querySelector(".cards").innerHTML = state.players[0].map((c,i)=>`<div class="card" style="background-image:url('${c.img}'); border-color:${colorMap[c.color]}" onclick="playCard(${i})"></div>`).join("");
      for(let i=1;i<=3;i++){
        const pdiv = document.getElementById(`p${i+1}`);
        pdiv.querySelector(".info").innerHTML = `<strong>${state.roomMode ? (state.roomMembers[i-1]?.name || `Jogador ${i+1}`) : `Robô ${i}`}</strong> (${state.players[i].length})`;
        pdiv.querySelector(".cards").innerHTML = state.players[i].map(()=>`<div class="card" style="background:#334155;"></div>`).join("");
      }
      document.getElementById("discardPile").innerHTML = state.topCard ? `<div class="card" style="background-image:url('${state.topCard.img}'); border-color:${colorMap[state.topCard.color]}"></div>` : "";
      document.getElementById("turnIndicator").innerText = state.turn===0 ? "Sua vez" : `Vez de ${state.roomMode ? (state.roomMembers[state.turn-1]?.name || `Jogador ${state.turn+1}`) : `Robô ${state.turn}`}`;
      document.getElementById("statusNote").innerText = state.penalty>0 ? `+${state.penalty} cartas!` : "";
    }
    function joinRobots(){ state.roomMode=false; backToLobby(); initGame(); document.getElementById("lobbyScreen").style.display="none"; document.getElementById("gameArea").style.display="block"; document.getElementById("chatPanel").style.display="none"; }

    // Áudio
    function toggleAudio(){ state.audioEnabled=!state.audioEnabled; document.getElementById("audioBtn").innerText=state.audioEnabled?"Áudio: on":"Áudio: off"; }
    async function toggleMic(){
      state.micEnabled=!state.micEnabled;
      if(state.micEnabled){
        try{ state.micStream = await navigator.mediaDevices.getUserMedia({audio:true}); }catch(e){ alert("Microfone negado"); state.micEnabled=false; }
      } else {
        if(state.micStream) state.micStream.getTracks().forEach(t=>t.stop());
        state.micStream=null;
      }
      document.getElementById("micBtn").innerText=state.micEnabled?"Mic: on":"Mic: off";
    }

    // Chat local (simples)
    function addChatMessage(author, msg){
      const msgsDiv = document.getElementById("chatMessages");
      const div = document.createElement("div");
      div.innerHTML = `<strong>${escapeHtml(author)}:</strong> ${escapeHtml(msg)}`;
      msgsDiv.appendChild(div);
      msgsDiv.scrollTop = msgsDiv.scrollHeight;
    }
    document.getElementById("chatForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const input = document.getElementById("chatInput");
      if(input.value.trim()){
        addChatMessage(state.myName, input.value);
        input.value = "";
      }
    });
    function escapeHtml(str){ return String(str).replace(/[&<>]/g, function(m){ if(m==="&") return "&amp;"; if(m==="<") return "&lt;"; if(m===">") return "&gt;"; return m; }); }

    // Inicialização
    loadRooms();
    document.getElementById("playerName").value = "Jogador_" + Math.floor(Math.random()*1000);
    // Simular um Firebase Bridge mínimo (pois seu original já tem, mas vamos usar apenas o essencial)
    window.firebaseBridge = window.firebaseBridge || { syncPublic: (data)=>{ if(data.rooms) saveRooms(); } };
    // Caso o Firebase real esteja presente, ele vai sobrescrever, mas garantimos que as salas carregam.
  </script>
