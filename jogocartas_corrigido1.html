<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cartass Multiplayer - Jogo em Tempo Real</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    :root {
      --bg1: #eef2ff;
      --bg2: #f8fafc;
      --panel: rgba(255,255,255,0.78);
      --panel-strong: rgba(255,255,255,0.94);
      --stroke: rgba(15,23,42,0.10);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #16a34a;
      --accent-2: #0ea5e9;
      --shadow: 0 20px 60px rgba(15,23,42,.12);
      --card-w: clamp(58px, 6.4vw, 88px);
      --card-h: calc(var(--card-w) * 1.42);
      --card-small-w: clamp(42px, 4.8vw, 58px);
      --card-small-h: calc(var(--card-small-w) * 1.42);
      --board-glow: rgba(14, 165, 233, .12);
      --board-glow-2: rgba(34, 197, 94, .12);
    }

    body[data-theme="dark"] {
      --bg1: #07111f;
      --bg2: #0f172a;
      --panel: rgba(15, 23, 42, 0.70);
      --panel-strong: rgba(15, 23, 42, 0.92);
      --stroke: rgba(255,255,255,0.10);
      --text: #e5eefb;
      --muted: #93a4bf;
      --accent: #22c55e;
      --accent-2: #38bdf8;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --board-glow: rgba(56, 189, 248, .16);
      --board-glow-2: rgba(34, 197, 94, .14);
    }

    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 20% 15%, var(--board-glow), transparent 24%),
                  radial-gradient(circle at 80% 20%, var(--board-glow-2), transparent 22%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      color: var(--text);
      transition: all 0.2s;
      overflow-x: hidden;
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(12px);
      z-index: 20;
    }

    #lobbyScreen {
      position: relative;
      overflow-y: auto;
      align-items: flex-start;
      padding: 24px;
    }

    .panel {
      width: min(980px, 100%);
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 30px;
      padding: clamp(22px, 4vw, 40px);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .centered { text-align: center; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: -0.04em;
    }

    h1 span {
      display: inline-block;
      padding: 0 .35em;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(14,165,233,.16), rgba(34,197,94,.16));
      border: 1px solid var(--stroke);
    }

    .subtitle {
      color: var(--muted);
      margin-top: 10px;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 800;
      color: white;
      background: linear-gradient(135deg, #22c55e, #0ea5e9);
      transition: transform 0.1s, filter 0.1s;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-1px); filter: brightness(1.02); }
    .btn.secondary {
      background: var(--panel-strong);
      color: var(--text);
      border: 1px solid var(--stroke);
      box-shadow: none;
    }

    .lobby-grid {
      display: grid;
      gap: 18px;
      margin-top: 24px;
    }

    .hero-card, .lobby-card, .room-card {
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 22px;
      backdrop-filter: blur(12px);
    }

    .name-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .name-row input {
      flex: 1;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--stroke);
      background: var(--panel-strong);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    .rooms {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-top: 12px;
    }

    .room-card {
      padding: 18px;
    }

    .room-head {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .room-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
    }

    /* Jogo */
    #gameScreen, #endScreen { display: none; }

    #table {
      position: fixed;
      inset: 0;
      display: none;
      background: radial-gradient(circle at 50% 45%, var(--board-glow-2), transparent 30%),
                  radial-gradient(circle at 50% 45%, var(--board-glow), transparent 42%);
    }

    .table-shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .board {
      flex: 1;
      display: grid;
      grid-template-rows: auto auto auto;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 12px;
      min-height: 0;
    }

    .hand {
      background: var(--panel);
      border-radius: 20px;
      padding: 10px;
      border: 1px solid var(--stroke);
    }

    .player-top { grid-column: 1 / 4; grid-row: 1; }
    .player-left { grid-column: 1; grid-row: 2; align-self: center; }
    .player-right { grid-column: 3; grid-row: 2; align-self: center; }
    .center-area { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .player-bottom { grid-column: 1 / 4; grid-row: 3; }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .card {
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 10px 22px rgba(0,0,0,0.2);
      transition: transform 0.1s;
      cursor: pointer;
      position: relative;
    }

    .card::after {
      content: attr(data-value);
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: bold;
    }

    .card.playable { transform: translateY(-6px) scale(1.02); }
    .card.back {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid rgba(255,255,255,0.1);
    }
    .card.back::after { content: ""; }

    .pile {
      width: var(--card-w);
      height: var(--card-h);
      border-radius: 16px;
      background: var(--panel-strong);
      border: 1px solid var(--stroke);
    }

    .chat-panel {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 300px;
      background: var(--panel);
      border: 1px solid var(--stroke);
      border-radius: 20px;
      padding: 12px;
      backdrop-filter: blur(12px);
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-messages {
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .chat-msg {
      background: rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .chat-form {
      display: flex;
      gap: 8px;
    }

    .chat-form input {
      flex: 1;
      padding: 8px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: var(--panel-strong);
      color: var(--text);
    }

    .turn-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34,197,94,0.2);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: bold;
    }

    .room-presence {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .presence-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-2);
    }

    @media (max-width: 800px) {
      .board { grid-template-columns: 1fr; gap: 8px; }
      .player-top, .player-left, .player-right, .player-bottom, .center-area { grid-column: 1; }
      .player-top { grid-row: 1; }
      .center-area { grid-row: 2; }
      .player-left { grid-row: 3; }
      .player-right { grid-row: 4; }
      .player-bottom { grid-row: 5; }
      .rooms { grid-template-columns: 1fr; }
      .chat-panel { width: 260px; }
    }
  </style>
</head>
<body data-theme="light">
  <!-- LOBBY -->
  <div id="lobbyScreen" class="screen">
    <div class="panel centered">
      <h1><span>Cartas</span></h1>
      <p class="subtitle">Combine cor ou valor e zere sua mão.</p>
      <div class="lobby-grid">
        <div class="hero-card">
          <strong>Seu nome</strong>
          <div class="name-row">
            <input id="playerName" placeholder="Seu nome" maxlength="18">
            <button class="btn" onclick="joinRobots()">Jogar com robôs</button>
          </div>
          <div class="mini-note">Modo offline contra robôs</div>
        </div>
        <div class="lobby-card">
          <strong>Salas multiplayer</strong>
          <div class="room-name-row">
            <input id="roomName" placeholder="Apelido na sala" maxlength="18">
          </div>
          <div class="rooms" id="roomsList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- FIM DE JOGO -->
  <div id="endScreen" class="screen">
    <div class="panel centered">
      <h1 id="winnerText"></h1>
      <button class="btn" onclick="backToLobby()">Voltar ao lobby</button>
    </div>
  </div>

  <!-- MESA -->
  <div id="table">
    <div class="table-shell">
      <div class="hud">
        <div><button class="btn secondary" onclick="backToLobby()">Sair</button> <strong>Cartas Multiplayer</strong></div>
        <div class="hud-right">
          <div class="turn-badge"><span class="turn-dot"></span><span id="turnLabel">Sua vez</span></div>
          <button id="micBtn" class="btn secondary" onclick="toggleMicrophone()">Mic: off</button>
          <button id="audioBtn" class="btn secondary" onclick="toggleOutputAudio()">Áudio: on</button>
        </div>
      </div>
      <div class="board">
        <div id="p2" class="hand player-top"><div class="info"></div><div class="cards"></div></div>
        <div id="p3" class="hand player-left"><div class="info"></div><div class="cards"></div></div>
        <div class="center-area">
          <div style="display:flex; gap:12px;">
            <div id="drawPile" class="pile draw"></div>
            <div id="discardPile" class="pile discard"></div>
          </div>
          <div id="statusNote" class="board-note">Aguardando jogadores...</div>
          <button class="btn" onclick="drawCard()">Comprar carta</button>
        </div>
        <div id="p4" class="hand player-right"><div class="info"></div><div class="cards"></div></div>
        <div id="p1" class="hand player-bottom"><div class="info"></div><div class="cards"></div></div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatPanel" class="chat-panel">
    <div><strong>Chat da sala</strong> <button class="btn secondary" style="padding:4px 8px;" onclick="toggleChat()">–</button></div>
    <div id="roomPresence" class="room-presence"></div>
    <div id="chatMessages" class="chat-messages"></div>
    <form id="chatForm" class="chat-form">
      <input id="chatInput" placeholder="Mensagem..." autocomplete="off">
      <button class="btn secondary" type="submit">Enviar</button>
    </form>
  </div>

  <script type="module">
    // -------------------- FIREBASE IMPORTAÇÃO --------------------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";
    import { getFirestore, doc, collection, getDoc, setDoc, deleteDoc, addDoc, onSnapshot, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDr5UNy6SCUOQpKQMuqCxQbwJ32bTeN9Ew",
      authDomain: "cartas--jogo.firebaseapp.com",
      projectId: "cartas--jogo",
      storageBucket: "cartas--jogo.firebasestorage.app",
      messagingSenderId: "572709591073",
      appId: "1:572709591073:web:ef23f9079b9fc98b95ab60"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    await signInAnonymously(auth);
    let currentUser = null;
    onAuthStateChanged(auth, (user) => { currentUser = user; });

    // -------------------- CONSTANTES --------------------
    const ROOM_SEATS = 4;
    const SIGNAL_STUN = [{ urls: "stun:stun.l.google.com:19302" }];
    const colorsList = ["red", "blue", "green", "yellow"];
    const colorMap = { red: "#ef4444", blue: "#3b82f6", green: "#22c55e", yellow: "#eab308" };
    const imgs = [
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/000404.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/0005563.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/000569.webp",
      "https://raw.githubusercontent.com/fil0099/livedacaca/refs/heads/main/001013.webp"
    ];

    // -------------------- ESTADO GLOBAL --------------------
    const state = {
      roomId: null,
      roomMode: false,
      myName: "Você",
      myId: "",
      mySeat: 0,
      roomMembers: [],
      players: [[], [], [], []],
      topCard: null,
      turn: 0,
      penalty: 0,
      gameRunning: false,
      deck: [],
      audioEnabled: true,
      micEnabled: false,
      localStream: null,
      peerConnections: new Map(),
      remoteAudioElements: new Map(),
      processedSignals: new Set()
    };
    window.state = state;

    // -------------------- FUNÇÕES AUXILIARES --------------------
    function randomId() {
      return Math.random().toString(36).substring(2, 6).toUpperCase();
    }
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;});}

    // -------------------- JOGO (LÓGICA LOCAL) --------------------
    function createCard() {
      let value = Math.floor(Math.random() * 10).toString();
      const r = Math.random();
      if (r < 0.12) value = "+2";
      else if (r < 0.18) value = "+4";
      return { color: colorsList[Math.floor(Math.random() * colorsList.length)], value, img: imgs[Math.floor(Math.random() * imgs.length)] };
    }

    function drawFromDeck() {
      if (state.deck.length === 0) {
        for (let i = 0; i < 60; i++) state.deck.push(createCard());
      }
      return state.deck.pop();
    }

    function initGameLocal() {
      state.deck = [];
      state.players = [[], [], [], []];
      for (let i = 0; i < 100; i++) state.deck.push(createCard());
      for (let p = 0; p < 4; p++) for (let i = 0; i < 6; i++) state.players[p].push(drawFromDeck());
      state.topCard = drawFromDeck();
      state.penalty = 0;
      state.turn = 0;
      state.gameRunning = true;
      renderGame();
    }

    function canPlay(card) {
      if (!state.topCard) return true;
      if (card.value === "+4") return true;
      if (card.value === "+2") return card.color === state.topCard.color || state.topCard.value === "+2";
      return card.color === state.topCard.color || card.value === state.topCard.value;
    }

    function applyCard(card) {
      state.topCard = card;
      if (card.value === "+2") state.penalty += 2;
      if (card.value === "+4") state.penalty += 4;
    }

    function nextTurn() {
      if (checkWin()) return;
      state.turn = (state.turn + 1) % ROOM_SEATS;
      renderGame();
      if (state.roomMode) syncGameStateToFirestore();
    }

    function checkWin() {
      for (let i = 0; i < ROOM_SEATS; i++) {
        if (state.players[i].length === 0) {
          state.gameRunning = false;
          document.getElementById("table").style.display = "none";
          document.getElementById("endScreen").style.display = "flex";
          document.getElementById("winnerText").innerHTML = (i === state.mySeat) ? "Você venceu!" : `${getPlayerName(i)} venceu!`;
          if (state.roomMode) syncGameStateToFirestore();
          return true;
        }
      }
      return false;
    }

    function getPlayerName(seat) {
      if (!state.roomMode) return (seat === 0 ? state.myName : `Robô ${seat}`);
      const member = state.roomMembers.find(m => m.seat === seat);
      return member ? member.name : `Jogador ${seat+1}`;
    }

    function renderGame() {
      const discardDiv = document.getElementById("discardPile");
      if (discardDiv) discardDiv.innerHTML = state.topCard ? `<div class="card" data-value="${state.topCard.value}" style="background-image:url('${state.topCard.img}'); border-color:${colorMap[state.topCard.color]}"></div>` : '';
      document.getElementById("turnLabel").innerText = (state.turn === state.mySeat) ? "Sua vez" : `Vez de ${getPlayerName(state.turn)}`;
      const status = document.getElementById("statusNote");
      if (status) status.innerText = state.gameRunning ? (state.penalty > 0 ? `Penalidade: +${state.penalty} cartas` : "Escolha uma carta") : "Fim de jogo";

      for (let seat = 0; seat < 4; seat++) {
        const handDiv = document.getElementById(`p${seat+1}`);
        if (!handDiv) continue;
        const info = handDiv.querySelector(".info");
        if (info) info.innerHTML = `<strong>${getPlayerName(seat)}</strong> <small>${state.players[seat].length} cartas</small>`;
        const cardsDiv = handDiv.querySelector(".cards");
        if (!cardsDiv) continue;
        if (seat === state.mySeat) {
          cardsDiv.innerHTML = state.players[seat].map((c, idx) => `<div class="card ${canPlay(c) ? 'playable' : ''}" data-value="${c.value}" style="background-image:url('${c.img}'); border-color:${colorMap[c.color]}" onclick="window.playCard(${idx})"></div>`).join('');
        } else {
          cardsDiv.innerHTML = state.players[seat].map(() => `<div class="card back"></div>`).join('');
        }
      }
    }

    // Ações do jogador local
    window.playCard = function(cardIndex) {
      if (!state.gameRunning || state.turn !== state.mySeat || state.penalty > 0) return;
      const card = state.players[state.mySeat][cardIndex];
      if (!card || !canPlay(card)) return;
      applyCard(card);
      state.players[state.mySeat].splice(cardIndex, 1);
      renderGame();
      nextTurn();
      if (state.roomMode) syncGameStateToFirestore();
    };

    window.drawCard = function() {
      if (!state.gameRunning || state.turn !== state.mySeat || state.penalty > 0) return;
      state.players[state.mySeat].push(drawFromDeck());
      renderGame();
      nextTurn();
      if (state.roomMode) syncGameStateToFirestore();
    };

    // -------------------- FIRESTORE: SALAS --------------------
    const roomsRef = collection(db, "cartas_rooms_meta");
    async function loadRooms() {
      const snapshot = await getDoc(doc(db, "cartas_meta", "public"));
      let rooms = [];
      if (snapshot.exists()) rooms = snapshot.data().rooms || [];
      if (!rooms.length) rooms = [{ id: "room-1", name: "Sala 1", locked: false }, { id: "room-2", name: "Sala 2", locked: false }, { id: "room-3", name: "Sala 3", locked: false }];
      renderRoomList(rooms);
    }
    function renderRoomList(rooms) {
      const container = document.getElementById("roomsList");
      if (!container) return;
      container.innerHTML = rooms.map(room => `
        <div class="room-card">
          <div class="room-head"><strong>${escapeHtml(room.name)}</strong><span class="room-tag">${room.locked ? "🔒" : "🔓"}</span></div>
          <div class="room-actions"><button class="btn secondary" onclick="joinRoom('${room.id}')">Entrar</button></div>
        </div>
      `).join('');
    }
    window.joinRoom = async (roomId) => {
      const nameInput = document.getElementById("roomName").value.trim();
      if (!nameInput) { alert("Digite seu nome"); return; }
      state.myName = nameInput.slice(0,18);
      state.myId = randomId();
      state.roomId = roomId;
      state.roomMode = true;
      // Participar da sala
      await joinRoomFirestore(roomId);
    };

    async function joinRoomFirestore(roomId) {
      const uid = currentUser?.uid || randomId();
      const memberRef = doc(db, `cartas_rooms/${roomId}/members`, uid);
      const memberData = {
        uid,
        name: state.myName,
        seat: -1,
        color: `#${Math.floor(Math.random()*16777215).toString(16)}`,
        lastSeen: Date.now()
      };
      await setDoc(memberRef, memberData, { merge: true });
      // Iniciar listeners
      listenRoomMembers(roomId);
      listenGameState(roomId);
      listenSignals(roomId);
      listenChat(roomId);
      document.getElementById("lobbyScreen").style.display = "none";
      document.getElementById("table").style.display = "block";
      document.getElementById("chatPanel").style.display = "flex";
    }

    function listenRoomMembers(roomId) {
      const membersCol = collection(db, `cartas_rooms/${roomId}/members`);
      onSnapshot(membersCol, (snap) => {
        const members = [];
        snap.forEach(doc => members.push(doc.data()));
        // Atribuir assentos automaticamente
        members.sort((a,b) => a.lastSeen - b.lastSeen);
        const seated = [];
        for (let i=0; i<members.length && i<ROOM_SEATS; i++) {
          members[i].seat = i;
          seated.push(members[i]);
          // Atualizar seat no firestore se necessário
          if (members[i].seat !== i) updateDoc(doc(db, `cartas_rooms/${roomId}/members`, members[i].uid), { seat: i });
        }
        state.roomMembers = seated;
        const myMember = seated.find(m => m.uid === currentUser?.uid);
        if (myMember) state.mySeat = myMember.seat;
        else state.mySeat = 0;
        renderRoomPresence();
        renderGame();
      });
    }

    function listenGameState(roomId) {
      const stateRef = doc(db, `cartas_rooms/${roomId}/gameState`, "current");
      onSnapshot(stateRef, (snap) => {
        if (!snap.exists()) {
          // Inicializar jogo se for o primeiro
          initGameLocal();
          syncGameStateToFirestore();
        } else {
          const data = snap.data();
          state.players = data.players || [[],[],[],[]];
          state.topCard = data.topCard || null;
          state.turn = data.turn || 0;
          state.penalty = data.penalty || 0;
          state.gameRunning = data.gameRunning !== false;
          state.deck = data.deck || [];
          renderGame();
        }
      });
    }

    async function syncGameStateToFirestore() {
      if (!state.roomId) return;
      const stateRef = doc(db, `cartas_rooms/${state.roomId}/gameState`, "current");
      await setDoc(stateRef, {
        players: state.players,
        topCard: state.topCard,
        turn: state.turn,
        penalty: state.penalty,
        gameRunning: state.gameRunning,
        deck: state.deck,
        updatedAt: Date.now()
      }, { merge: true });
    }

    // -------------------- CHAT EM TEMPO REAL --------------------
    function listenChat(roomId) {
      const chatRef = doc(db, `cartas_chats`, roomId);
      onSnapshot(chatRef, (snap) => {
        if (snap.exists()) {
          const msgs = snap.data().messages || [];
          renderChatMessages(msgs);
        }
      });
    }

    async function sendChatMessage(text) {
      if (!text.trim() || !state.roomId) return;
      const chatRef = doc(db, `cartas_chats`, state.roomId);
      const newMsg = { author: state.myName, authorId: state.myId, message: text.trim(), timestamp: Date.now() };
      await updateDoc(chatRef, { messages: arrayUnion(newMsg) }).catch(() => setDoc(chatRef, { messages: [newMsg] }));
    }

    function renderChatMessages(messages) {
      const container = document.getElementById("chatMessages");
      if (!container) return;
      container.innerHTML = messages.map(m => `<div class="chat-msg"><strong>${escapeHtml(m.author)}</strong>: ${escapeHtml(m.message)}</div>`).join('');
      container.scrollTop = container.scrollHeight;
    }

    function renderRoomPresence() {
      const container = document.getElementById("roomPresence");
      if (!container) return;
      container.innerHTML = state.roomMembers.map(m => `<span class="presence-dot" title="${escapeHtml(m.name)}" style="background:${m.color}"></span>`).join('');
    }

    // -------------------- WEBRTC (ÁUDIO) --------------------
    async function createPeerConnection(peerUid) {
      if (peerUid === currentUser?.uid) return null;
      if (state.peerConnections.has(peerUid)) return state.peerConnections.get(peerUid);
      const pc = new RTCPeerConnection({ iceServers: SIGNAL_STUN });
      state.peerConnections.set(peerUid, pc);

      if (state.localStream) {
        state.localStream.getTracks().forEach(track => pc.addTrack(track, state.localStream));
      }

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          sendSignal(peerUid, { type: "ice-candidate", candidate: event.candidate });
        }
      };
      pc.ontrack = (event) => {
        let audioEl = state.remoteAudioElements.get(peerUid);
        if (!audioEl) {
          audioEl = new Audio();
          audioEl.autoplay = true;
          audioEl.hidden = true;
          document.body.appendChild(audioEl);
          state.remoteAudioElements.set(peerUid, audioEl);
        }
        audioEl.srcObject = event.streams[0];
        audioEl.volume = state.audioEnabled ? 1 : 0;
      };
      // Oferta se for o menor UID
      if (currentUser.uid < peerUid) {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        sendSignal(peerUid, { type: "offer", sdp: pc.localDescription });
      }
      return pc;
    }

    async function sendSignal(toUid, data) {
      if (!state.roomId) return;
      const signalRef = collection(db, `cartas_rooms/${state.roomId}/signals`);
      await addDoc(signalRef, { to: toUid, from: currentUser.uid, ...data, createdAt: Date.now() });
    }

    function listenSignals(roomId) {
      const signalsCol = collection(db, `cartas_rooms/${roomId}/signals`);
      onSnapshot(signalsCol, async (snap) => {
        for (const docSnap of snap.docs) {
          const signal = docSnap.data();
          if (signal.to !== currentUser?.uid) continue;
          if (state.processedSignals.has(docSnap.id)) continue;
          state.processedSignals.add(docSnap.id);
          let pc = state.peerConnections.get(signal.from);
          if (!pc && signal.type !== "ice-candidate") {
            pc = await createPeerConnection(signal.from);
          }
          if (!pc) continue;
          if (signal.type === "offer") {
            await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sendSignal(signal.from, { type: "answer", sdp: pc.localDescription });
          } else if (signal.type === "answer") {
            await pc.setRemoteDescription(new RTCSessionDescription(signal.sdp));
          } else if (signal.type === "ice-candidate" && signal.candidate) {
            try { await pc.addIceCandidate(new RTCIceCandidate(signal.candidate)); } catch(e) {}
          }
        }
      });
    }

    window.toggleMicrophone = async function() {
      if (!state.micEnabled) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          state.localStream = stream;
          state.micEnabled = true;
          // Adicionar a todas as conexões existentes
          for (const [uid, pc] of state.peerConnections.entries()) {
            stream.getTracks().forEach(track => pc.addTrack(track, stream));
          }
          // Criar conexões com membros que ainda não tem
          for (const member of state.roomMembers) {
            if (member.uid !== currentUser?.uid && !state.peerConnections.has(member.uid)) {
              await createPeerConnection(member.uid);
            }
          }
          document.getElementById("micBtn").innerText = "Mic: on";
        } catch(e) { alert("Microfone não permitido"); }
      } else {
        if (state.localStream) {
          state.localStream.getTracks().forEach(t => t.stop());
          state.localStream = null;
        }
        state.micEnabled = false;
        document.getElementById("micBtn").innerText = "Mic: off";
      }
    };

    window.toggleOutputAudio = function() {
      state.audioEnabled = !state.audioEnabled;
      for (let el of state.remoteAudioElements.values()) {
        el.volume = state.audioEnabled ? 1 : 0;
      }
      document.getElementById("audioBtn").innerText = state.audioEnabled ? "Áudio: on" : "Áudio: off";
    };

    // -------------------- LOBBY E NAVEGAÇÃO --------------------
    window.joinRobots = function() {
      const name = document.getElementById("playerName").value.trim() || "Você";
      state.myName = name;
      state.roomMode = false;
      state.roomId = null;
      initGameLocal();
      document.getElementById("lobbyScreen").style.display = "none";
      document.getElementById("table").style.display = "block";
      document.getElementById("chatPanel").style.display = "none";
    };

    window.backToLobby = function() {
      // Limpar conexões
      for (let pc of state.peerConnections.values()) pc.close();
      state.peerConnections.clear();
      for (let el of state.remoteAudioElements.values()) el.remove();
      state.remoteAudioElements.clear();
      if (state.localStream) state.localStream.getTracks().forEach(t => t.stop());
      state.localStream = null;
      state.roomMode = false;
      state.roomId = null;
      document.getElementById("table").style.display = "none";
      document.getElementById("endScreen").style.display = "none";
      document.getElementById("lobbyScreen").style.display = "flex";
      document.getElementById("chatPanel").style.display = "none";
      loadRooms();
    };

    // Chat submit
    document.getElementById("chatForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("chatInput");
      if (input.value.trim()) sendChatMessage(input.value);
      input.value = "";
    });

    function toggleChat() {
      const panel = document.getElementById("chatPanel");
      panel.style.display = panel.style.display === "none" ? "flex" : "none";
    }
    window.toggleChat = toggleChat;

    // Inicialização
    loadRooms();
  </script>
</body>
</html>
